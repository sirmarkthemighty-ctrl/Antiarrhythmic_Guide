0 h",metabolism:"Extensive hepatic metabolism by CYP2D6, CYP1A2 and CYP2C19; smoking can double clearance",excretion:"Mostly as metabolites in urine"},renalAdjustment:{crcl50:"Unknown (no dose rule in label)",crcl30_50:"Unknown (no dose rule in label)",crcl10_30:"Unknown (label: chronic renal failure may reduce hepatic metabolism; hypoglycemia reported in renal insufficiency)",crclLess10:"Unknown (label: chronic renal failure may reduce hepatic metabolism; hypoglycemia reported in renal insufficiency)",hd:"Unknown"},renalAdjust:null,hepaticAdjustment:"Consider a lower IV dose in hepatic insufficiency (lower clearance, variable half-life).",cautionsAndWarnings:["Avoid in overt heart failure; the failing heart needs sympathetic drive (give IV doses low and slowly).","Rate over 1 mg/min IV risks hypotension and cardiac standstill.","Abrupt stop: worse angina, MI.","Bronchospastic disease: contraindicated in asthma.","With diltiazem or disopyramide: severe bradycardia, heart block, heart failure reported.","Changes thyroid-function tests (T4 and reverse T3 up, T3 down)."],contraindications:["Cardiogenic shock","Sinus bradycardia and heart block greater than first degree","Bronchial asthma","Known hypersensitivity"],adverseEffects:["Bradycardia, hypotension, heart failure, heart block (most common cardiovascular events)","Raynaud-type arterial insufficiency","Hypoglycemia (after exertion, renal insufficiency)"],monitoring:["ECG and central venous pressure during IV dosing","Heart rate and blood pressure"],interactions:["Lidocaine: lidocaine levels up about 25% (toxicity reported)","Cimetidine: propranolol levels up about 40%","Diltiazem, disopyramide: severe bradycardia, heart block, heart failure","Drugs acting on CYP2D6, CYP1A2, CYP2C19: altered levels","Smoking: clearance up to doubled"],safeInHfref:!1,safeCad:!0,qtRisk:"None",nlem:{list:"b",old:"ก",items:[{form:"Propranolol HCl tab",cond:"-"}]},refs:{mech:["lbl:propranolol-inj#Clinical Pharmacology"],dose:["lbl:propranolol-inj#Indications, Dosage and Administration","aha25-als#Table (AF/AFL rate control)","acc23-af#Table 21","lbl:propranolol-tab#Dosage and Administration"],pk:["lbl:propranolol-inj#Clinical Pharmacology","acc23-af#Table 21"],renal:["lbl:propranolol-inj#Clinical Pharmacology, Warnings"],hepatic:["lbl:propranolol-inj#Dosage and Administration, Precautions"],warn:["lbl:propranolol-inj#Indications, Warnings, Precautions"],contra:["lbl:propranolol-inj#Contraindications","lbl:propranolol-tab#Contraindications"],adverse:["lbl:propranolol-inj#Adverse Reactions, Overdosage"],monitor:["lbl:propranolol-inj#Dosage and Administration"],interact:["lbl:propranolol-inj#Precautions: Drug Interactions"],flags:["lbl:propranolol-inj#Warnings (avoid in overt heart failure)"],nlem:["nlem2569"]}},{id:"bisoprolol",genericName:"Bisoprolol",brandNames:[],vwClass:"II",classFullName:"Class II - Cardioselective Beta-1 Blocker",color:"indigo",primaryTarget:"Beta-1 selective adrenergic blocker; selectivity not absolute (beta-2 inhibition at 20 mg or more)",actionPotential:{phase0:"Unknown",apd:"Unknown",erp:"Unknown"},ecgEffects:{pr:"Unknown",qrs:"Unknown",qtc:"Unknown",hr:"Decreased"},indications:["af_rate"],routes:["PO"],acuteDose:{en:"No IV form; not used for acute rate control in the sources checked.",th:"ไม่มีรูปแบบฉีด ไม่ใช้ควบคุมอัตราเต้นแบบเฉียบพลันตามแหล่งอ้างอิงที่ตรวจ"},maintenanceDose:{en:"AF rate control (ACC/AHA 2023): 2.5-10 mg once daily. US label (hypertension only): start 5 mg once daily (2.5 mg may be appropriate, e.g. bronchospastic disease), up to 10 then 20 mg once daily.",th:"ควบคุมอัตราเต้นใน AF (ACC/AHA 2023): 2.5-10 มก. วันละครั้ง. ฉลากสหรัฐฯ (เฉพาะความดันสูง): เริ่ม 5 มก. วันละครั้ง (อาจเริ่ม 2.5 มก. เช่น มีโรคหลอดลมหดเกร็ง) เพิ่มได้ถึง 10 และ 20 มก. วันละครั้ง"},pharmacokinetics:{onset:"Unknown",peak:"Unknown",halfLife:"9-12 h; about 3-fold longer if CrCl under 40 mL/min",metabolism:"About half non-renal to inactive metabolites; not metabolized by CYP2D6",excretion:"About 50% unchanged in urine. Limited data suggest it is not dialyzable."},renalAdjustment:{crcl50:"Usual dose",crcl30_50:"CrCl under 40: start 2.5 mg daily; titrate with caution",crcl10_30:"Start 2.5 mg daily; titrate with caution",crclLess10:"Start 2.5 mg daily; titrate with caution",hd:"Not dialyzable (limited data); no replacement dose needed"},renalAdjust:!0,hepaticAdjustment:"Hepatitis or cirrhosis: start 2.5 mg daily; titrate with caution.",cautionsAndWarnings:["Bronchospastic disease: in general do not use beta-blockers; if needed, use the lowest dose with a bronchodilator available.","Abrupt stop in coronary disease: worse angina, MI or ventricular arrhythmia.","May mask hypoglycemia (tachycardia).","Abrupt withdrawal may precipitate thyroid storm."],contraindications:["Cardiogenic shock","Overt cardiac failure","Second- or third-degree AV block","Marked sinus bradycardia"],adverseEffects:["See label adverse reaction table (hypertension trials)"],monitoring:["Heart rate and blood pressure","Renal and hepatic function when choosing the dose"],interactions:["Rifampin: faster clearance, shorter half-life","Other negative chronotropes: additive bradycardia (class effect in label)"],safeInHfref:null,safeCad:!0,qtRisk:"None",nlem:{list:null},refs:{mech:["lbl:bisoprolol-tab#Clinical Pharmacology, Warnings"],dose:["acc23-af#Table 21","lbl:bisoprolol-tab#Indications, Dosage and Administration"],pk:["lbl:bisoprolol-tab#Clinical Pharmacology, Dosage and Administration"],renal:["lbl:bisoprolol-tab#Dosage and Administration"],hepatic:["lbl:bisoprolol-tab#Dosage and Administration"],warn:["lbl:bisoprolol-tab#Warnings"],contra:["lbl:bisoprolol-tab#Contraindications"],adverse:["lbl:bisoprolol-tab#Adverse Reactions"],monitor:["lbl:bisoprolol-tab#Dosage and Administration"],interact:["lbl:bisoprolol-tab#Precautions: Drug Interactions"],flags:["lbl:bisoprolol-tab#Contraindications (overt cardiac failure)"],nlem:["nlem2569"]}}],DRUGS_PART_3=[{id:"amiodarone",genericName:"Amiodarone",brandNames:["Nexterone","Cordarone"],vwClass:"III",classFullName:"Class III - Multichannel Blocker",color:"purple",primaryTarget:"ACC/AHA 2023: inhibits IKr, IKs, INa, IKur, Ito, ICa-L, IKAch; noncompetitive beta-blocker",actionPotential:{phase0:"Unknown",apd:"Unknown",erp:"Unknown"},ecgEffects:{pr:"AV block possible",qrs:"Unknown",qtc:"Prolonged (ACC/AHA 2023)",hr:"Bradycardia"},indications:["vt_vf","af_rhythm","af_rate"],routes:["IV","PO"],acuteDose:{en:"Cardiac arrest, shock-refractory VF/pVT (AHA 2025): 300 mg IV/IO bolus, second dose 150 mg.\nStable wide-QRS tachycardia (AHA 2025): 150 mg IV over 10 min, repeat as needed if VT recurs, then 1 mg/min for the first 6 h.\nNexterone label (VF / unstable VT): 150 mg over 10 min (15 mg/min), then 360 mg over 6 h (1 mg/min), then 540 mg over 18 h (0.5 mg/min); after 24 h continue 0.5 mg/min (720 mg/24 h). Breakthrough: extra 150 mg over 10 min. Mean daily doses above 2100 mg raised hypotension risk.\nAF rate control (AHA 2025): 300 mg IV over 1 h, then 10-50 mg/h over 24 h (ACC/AHA 2023: 150-300 mg over 1 h).\nAF conversion (ACC/AHA 2023): 5-7 mg/kg or 300 mg IV, then 1200-3000 mg over 24 h; conversion in 8-12 h.",th:"หัวใจหยุดเต้น VF/pVT ที่ช็อกไม่ได้ผล (AHA 2025): 300 มก. IV/IO ครั้งที่สอง 150 มก.\nWide-QRS tachycardia ที่คงที่ (AHA 2025): 150 มก. IV ใน 10 นาที ซ้ำได้ถ้า VT กลับมา แล้ว 1 มก./นาที ใน 6 ชม. แรก\nฉลาก Nexterone (VF / VT ที่ไม่คงที่): 150 มก. ใน 10 นาที (15 มก./นาที) แล้ว 360 มก. ใน 6 ชม. (1 มก./นาที) แล้ว 540 มก. ใน 18 ชม. (0.5 มก./นาที) หลัง 24 ชม. ให้ 0.5 มก./นาที ต่อ (720 มก./24 ชม.) กำเริบระหว่างให้ยา: ให้เพิ่ม 150 มก. ใน 10 นาที ขนาดเฉลี่ยเกิน 2100 มก./วัน เพิ่มความเสี่ยงความดันต่ำ\nควบคุมอัตราเต้นใน AF (AHA 2025): 300 มก. IV ใน 1 ชม. แล้ว 10-50 มก./ชม. ใน 24 ชม. (ACC/AHA 2023: 150-300 มก. ใน 1 ชม.)\nแปลง AF (ACC/AHA 2023): 5-7 มก./กก. หรือ 300 มก. IV แล้ว 1200-3000 มก. ใน 24 ชม. กลับจังหวะใน 8-12 ชม."},maintenanceDose:{en:"Tablet label (life-threatening VF/VT): load 800-1600 mg/day until response (usually 1-3 weeks), then 600-800 mg/day for 1 month, then usually 400 mg/day; lowest effective dose; divide with meals if 1000 mg/day or more. AF (ACC/AHA 2023): load 400-800 mg/day in 2-4 doses for 1-4 weeks (total 6-10 g), then 200 mg once daily (rate control 100-200 mg daily).",th:"ฉลากยาเม็ด (VF/VT ที่อันตรายถึงชีวิต): ขนาดนำ 800-1600 มก./วัน จนได้ผล (มัก 1-3 สัปดาห์) แล้ว 600-800 มก./วัน 1 เดือน แล้วโดยทั่วไป 400 มก./วัน ใช้ขนาดต่ำสุดที่ได้ผล แบ่งให้พร้อมอาหารถ้า 1000 มก./วันขึ้นไป. AF (ACC/AHA 2023): ขนาดนำ 400-800 มก./วัน แบ่ง 2-4 ครั้ง นาน 1-4 สัปดาห์ (รวม 6-10 ก.) แล้ว 200 มก. วันละครั้ง (ควบคุมอัตราเต้น 100-200 มก./วัน)"},pharmacokinetics:{onset:"AF conversion in 8-12 h with IV loading (ACC/AHA 2023)",peak:"Unknown",halfLife:"IV label: 9-36 days (desethylamiodarone 9-30 days). Tablet label: terminal 26-107 days, mean about 53 days",metabolism:"CYP3A and CYP2C8 to desethylamiodarone (DEA); inhibits CYP2C9, CYP2D6, CYP3A and P-gp",excretion:"Liver metabolism, biliary excretion. Neither amiodarone nor DEA is dialyzable."},renalAdjustment:{crcl50:"No adjustment (renal impairment does not change kinetics)",crcl30_50:"No adjustment (renal impairment does not change kinetics)",crcl10_30:"No adjustment (renal impairment does not change kinetics)",crclLess10:"No adjustment (renal impairment does not change kinetics)",hd:"Not dialyzable"},renalAdjust:!1,hepaticAdjustment:"No dose rule given. Tablets: reduce dose or stop if transaminases exceed 3 times normal (or double an elevated baseline); stop if clinical liver injury. IV: acute hepatocellular necrosis reported.",cautionsAndWarnings:["BOXED WARNING (tablets): pulmonary toxicity in up to 17% in some series, fatal in about 10% of cases; baseline chest X-ray and lung function including DLCO; repeat history, exam and chest X-ray every 3-6 months.","BOXED WARNING (tablets): hepatotoxicity, can be fatal; baseline and periodic transaminases.","BOXED WARNING (tablets): can worsen arrhythmias; start where continuous ECG and resuscitation are available. Use only for the indicated life-threatening arrhythmias.","IV: hypotension (16% of 1836 patients; most common in the first hours); slow the infusion. Bradycardia and AV block.","Thyroid: hypothyroidism up to 10%, hyperthyroidism about 2% (may cause breakthrough arrhythmia).","Optic neuropathy or neuritis; corneal microdeposits in most adults (reversible).","Photosensitivity; long half-life means adverse effects persist after stopping.","Correct low K, Mg and Ca before starting."],contraindications:["Cardiogenic shock","Marked sinus bradycardia; sick sinus syndrome, second- or third-degree AV block or bradycardia causing syncope without a functioning pacemaker","Hypersensitivity, including to iodine"],adverseEffects:["IV: hypotension (16%), bradycardia, AV block, phlebitis","Oral: pulmonary toxicity, hepatotoxicity, hypo- or hyperthyroidism, corneal microdeposits, photosensitivity, skin pigmentation (ACC/AHA 2023: blue-gray), peripheral neuropathy"],monitoring:["Baseline chest X-ray, lung function, thyroid tests, transaminases (label)","ACC/AHA 2023: TSH and AST/ALT at baseline, 3-6 months, then every 6 months; ECG at baseline and yearly; chest X-ray if cough or dyspnea; yearly exam for skin and nerves","ECG and BP during IV loading"],interactions:["Warfarin: reduce dose by one-third to one-half; monitor PT/INR","Digoxin: reduce by half or stop","Simvastatin: limit to 20 mg (lovastatin, atorvastatin levels also rise)","Sofosbuvir: symptomatic bradycardia needing pacemakers","Dabigatran: higher levels","Cimetidine: higher amiodarone levels"],safeInHfref:!0,safeCad:!0,qtRisk:"Warning",nlem:{list:"ex",old:"ค",items:[{form:"Amiodarone HCl tab",cond:"ใช้สำหรับ supraventricular และ ventricular arrhythmias"},{form:"Amiodarone HCl sterile sol",cond:"ใช้สำหรับ supraventricular และ ventricular arrhythmias"}]},refs:{mech:["acc23-af#Table 23"],dose:["aha25-ca","aha25-tachy","lbl:amiodarone-nexterone#Dosage and Administration","aha25-als#Table (AF/AFL rate control)","acc23-af#Tables 21, 22, 23","lbl:amiodarone-tab#Dosage and Administration"],pk:["lbl:amiodarone-nexterone#Warnings 5.1, Clinical Pharmacology","lbl:amiodarone-tab#Clinical Pharmacology","acc23-af#Table 22"],renal:["lbl:amiodarone-tab#Clinical Pharmacology, Overdosage"],hepatic:["lbl:amiodarone-tab#Boxed Warning","lbl:amiodarone-nexterone#Warnings 5.4"],warn:["lbl:amiodarone-tab#Boxed Warning, Warnings and Precautions","lbl:amiodarone-nexterone#Warnings and Precautions"],contra:["lbl:amiodarone-tab#Contraindications","lbl:amiodarone-nexterone#Contraindications"],adverse:["lbl:amiodarone-nexterone#Warnings 5.2, Adverse Reactions","acc23-af#Table 23"],monitor:["lbl:amiodarone-tab#Dosage and Administration, Boxed Warning","acc23-af#Table 24"],interact:["lbl:amiodarone-tab#Drug Interactions","lbl:amiodarone-nexterone#Drug Interactions"],flags:["acc23-af#text (AF-CHF: amiodarone in heart failure)"],nlem:["nlem2569"]}},{id:"sotalol",genericName:"Sotalol",brandNames:["Betapace","Betapace AF"],vwClass:"III",classFullName:"Class III - Potassium Channel Blocker with Beta-Blockade",color:"purple",primaryTarget:"ACC/AHA 2023: inhibits IKr and blocks beta-receptors; d-sotalol augments late INa",actionPotential:{phase0:"Unknown",apd:"Unknown",erp:"Unknown"},ecgEffects:{pr:"Unknown",qrs:"Unknown",qtc:"Prolonged, dose-related (reduce or stop at 500 ms or more)",hr:"Decreased (bradycardia)"},indications:["vt_vf","af_rhythm"],routes:["PO","IV"],acuteDose:{en:"Not a single-dose conversion drug in the sources checked. Start (or restart) only in hospital for at least 3 days or until steady state, with continuous ECG and resuscitation available; baseline QT, potassium and magnesium normalized, CrCl calculated. IV sotalol (label) can replace oral dosing or load faster; dose depends on target oral dose and CrCl (see label).",th:"ไม่ใช่ยาแปลงจังหวะแบบให้ครั้งเดียวในแหล่งที่ตรวจ เริ่ม (หรือเริ่มใหม่) ในโรงพยาบาลอย่างน้อย 3 วัน หรือจนถึงระดับคงที่ มีการติดตาม ECG ต่อเนื่องและพร้อมกู้ชีพ ตรวจ QT และแก้โพแทสเซียม แมกนีเซียมให้ปกติ คำนวณ CrCl ก่อน. Sotalol ฉีด (ตามฉลาก) ใช้แทนยารับประทานหรือให้ถึงระดับเร็วขึ้น ขนาดขึ้นกับขนาดยารับประทานเป้าหมายและ CrCl (ดูฉลาก)"},maintenanceDose:{en:"Label: start 80 mg twice daily; increase by 80 mg/day every 3 days if QTc under 500 ms (max 320 mg/day for AF/flutter; VT usually 160-320 mg/day in 2-3 doses, up to 480-640 mg/day in refractory cases). AF/flutter: most respond to 120 mg twice daily. Check QTc 2-4 h after each increase. ACC/AHA 2023 (AF): CrCl over 60: 80-160 mg twice daily; CrCl 40-60: 80-160 mg once daily; CrCl under 40: contraindicated.",th:"ฉลากยา: เริ่ม 80 มก. วันละ 2 ครั้ง เพิ่มครั้งละ 80 มก./วัน ทุก 3 วัน ถ้า QTc ต่ำกว่า 500 ms (สูงสุด 320 มก./วัน สำหรับ AF/flutter; VT ส่วนใหญ่ 160-320 มก./วัน แบ่ง 2-3 ครั้ง ถึง 480-640 มก./วัน ในรายดื้อยา) AF/flutter ส่วนใหญ่ได้ผลที่ 120 มก. วันละ 2 ครั้ง ตรวจ QTc 2-4 ชม. หลังเพิ่มขนาดทุกครั้ง. ACC/AHA 2023 (AF): CrCl เกิน 60: 80-160 มก. วันละ 2 ครั้ง; CrCl 40-60: 80-160 มก. วันละครั้ง; CrCl ต่ำกว่า 40: ห้ามใช้"},pharmacokinetics:{onset:"Unknown",peak:"2-3 h",halfLife:"Mean 12 h; up to 69 h in anuric patients",metabolism:"Not metabolized; no CYP450 inhibition or induction",excretion:"Mainly unchanged by the kidney. Partly removed by hemodialysis."},renalAdjustment:{crcl50:"CrCl over 60: every 12 h. CrCl 30-59: every 24 h (label)",crcl30_50:"CrCl 30-59: every 24 h (label). ACC/AHA 2023 for AF: CrCl 40-60 once daily, under 40 contraindicated",crcl10_30:"CrCl 10-29: every 36-48 h (label). AF: contraindicated if CrCl under 40 (ACC/AHA 2023)",crclLess10:"CrCl under 10: individualize (label)",hd:"Partly removed by dialysis; no specific dosing advice in label"},renalAdjust:!0,hepaticAdjustment:"No change in clearance in hepatic impairment.",cautionsAndWarnings:["BOXED WARNING: life-threatening VT with QT prolongation. Start or restart where resuscitation and continuous ECG are available. If QT reaches 500 ms or more, reduce the dose, lengthen the interval or stop. Adjust the interval to CrCl.","Withdraw other antiarrhythmics first (monitor 2-3 half-lives).","Avoid in minimally symptomatic or easily reversible AF/flutter.","Hemodialysis lowers levels in overdose (no protein binding)."],contraindications:["Sinus bradycardia, sick sinus syndrome, second- or third-degree AV block without a pacemaker","Congenital or acquired long QT syndromes","Cardiogenic shock or decompensated heart failure","Serum potassium under 4 mEq/L","Bronchial asthma or related bronchospastic conditions","For AF/flutter: baseline QT over 450 ms","Hypersensitivity"],adverseEffects:["ACC/AHA 2023 list: AV block, bradycardia, bronchospasm, diarrhea, worse heart failure, fatigue, nausea and vomiting, QT prolongation, torsades de pointes"],monitoring:["Continuous ECG for at least 3 days at start; QTc 2-4 h after each dose increase","Potassium, magnesium and CrCl before starting","ACC/AHA 2023: ECG, K, Mg, creatinine at 3-6 months, then every 3-6 months"],interactions:["Digoxin, calcium channel blockers: more bradycardia, hypotension, heart failure","Antacids within 2 h before a dose: absorption down about 20-26%","Other QT-prolonging antiarrhythmics: withdraw before starting"],safeInHfref:!1,safeCad:null,qtRisk:"Boxed",nlem:{list:null},refs:{mech:["acc23-af#Table 23"],dose:["lbl:sotalol-betapace#Dosage and Administration","lbl:sotalol-iv#Dosage and Administration","acc23-af#Table 23"],pk:["lbl:sotalol-betapace#Clinical Pharmacology"],renal:["lbl:sotalol-betapace#Dosage and Administration 2.5","acc23-af#Table 23"],hepatic:["lbl:sotalol-betapace#Clinical Pharmacology"],warn:["lbl:sotalol-betapace#Boxed Warning, Indications, Dosage and Administration, Overdosage"],contra:["lbl:sotalol-betapace#Contraindications"],adverse:["acc23-af#Table 23"],monitor:["lbl:sotalol-betapace#Dosage and Administration","acc23-af#Table 25"],interact:["lbl:sotalol-betapace#Drug Interactions, Clinical Pharmacology"],flags:["lbl:sotalol-betapace#Contraindications (decompensated heart failure), Boxed Warning"],nlem:["nlem2569"]}},{id:"dronedarone",genericName:"Dronedarone",brandNames:["Multaq"],vwClass:"III",classFullName:"Class III - Multichannel Blocker (non-iodinated)",color:"purple",primaryTarget:"ACC/AHA 2023: inhibits IKr, IKs, INa, IKur, Ito, ICa-L, IKAch; noncompetitive beta-blocker",actionPotential:{phase0:"Unknown",apd:"Unknown",erp:"Unknown"},ecgEffects:{pr:"Increased about 12 ms (400 mg twice daily)",qrs:"Unknown",qtc:"QTcF increased about 15 ms; stop if over 500 ms",hr:"Bradycardia"},indications:["af_rhythm"],routes:["PO"],acuteDose:{en:"Not for acute conversion (maintenance drug only).",th:"ไม่ใช้แปลงจังหวะเฉียบพลัน (ใช้คงจังหวะระยะยาวเท่านั้น)"},maintenanceDose:{en:"400 mg twice daily with the morning and evening meals. Stop Class I or III antiarrhythmics and strong CYP3A inhibitors before starting. Indication: reduce AF hospitalization in patients in sinus rhythm with a history of paroxysmal or persistent AF.",th:"400 มก. วันละ 2 ครั้ง พร้อมอาหารเช้าและเย็น หยุดยาต้านหัวใจเต้นผิดจังหวะ Class I หรือ III และยายับยั้ง CYP3A แรงก่อนเริ่ม ข้อบ่งใช้: ลดการนอนโรงพยาบาลจาก AF ในผู้ป่วยที่อยู่ในจังหวะไซนัสและเคยเป็น AF ชนิด paroxysmal หรือ persistent"},pharmacokinetics:{onset:"Unknown",peak:"Unknown",halfLife:"13-19 h",metabolism:"CYP3A substrate; moderate CYP3A and CYP2D6 inhibitor; P-gp substrate and inhibitor",excretion:"Low renal excretion; inhibits tubular creatinine secretion (OCT2), so serum creatinine may rise without a GFR change"},renalAdjustment:{crcl50:"No adjustment (no PK difference in renal impairment)",crcl30_50:"No adjustment (no PK difference in renal impairment)",crcl10_30:"No adjustment (no PK difference in mild to severe renal impairment)",crclLess10:"Unknown",hd:"Unknown"},renalAdjust:!1,hepaticAdjustment:"Contraindicated in severe hepatic impairment. Liver injury reported: consider periodic liver enzymes, especially in the first 6 months; do not restart after unexplained liver injury.",cautionsAndWarnings:["BOXED WARNING: doubles the risk of death in symptomatic heart failure with recent decompensation needing hospitalization, or NYHA class IV.","BOXED WARNING: in permanent AF, doubles the risk of death, stroke and heart-failure hospitalization; contraindicated if sinus rhythm will not or cannot be restored.","New or worsening heart failure; liver injury; pulmonary toxicity (stop if confirmed).","Low K or Mg with potassium-depleting diuretics.","QT prolongation: stop if QTc over 500 ms.","INR rises (to 5 or more) in warfarin users, usually within 1 week: monitor INR."],contraindications:["Permanent AF","Symptomatic heart failure with recent decompensation needing hospitalization, or NYHA class IV","Second- or third-degree AV block or sick sinus syndrome without a pacemaker","Bradycardia under 50 bpm","Strong CYP3A inhibitors (e.g. ketoconazole, itraconazole, voriconazole, cyclosporine, clarithromycin, ritonavir) or erythromycin","QT-prolonging drugs (e.g. phenothiazines, tricyclics, some oral macrolides, Class I and III antiarrhythmics)","Liver or lung toxicity from prior amiodarone","QTc over 500 ms or PR over 280 ms","Severe hepatic impairment","Hypersensitivity"],adverseEffects:["Most common (2% or more): diarrhea, nausea, abdominal pain, vomiting, dyspepsia, bradycardia, skin reactions, asthenia"],monitoring:["12-lead ECG (QTc, PR, rhythm: stop if AF becomes permanent)","Liver enzymes, especially in the first 6 months (ACC/AHA 2023: baseline and within 6 months)","INR if on warfarin","K and Mg with diuretics"],interactions:["Digoxin: consider stopping; if continued, halve the dose and monitor levels","Dabigatran: higher levels; reduce dabigatran to 75 mg twice daily if CrCl 30-50, avoid if CrCl 15-30","Simvastatin: avoid more than 10 mg daily","Warfarin: INR rises; monitor","Grapefruit juice: avoid","CYP3A inducers (rifampin, St John's wort, phenytoin): lower dronedarone (ACC/AHA 2023)"],safeInHfref:!1,safeCad:!0,qtRisk:"Warning",nlem:{list:null},refs:{mech:[ .","หัวใจล้มเหลวและผู้สูงอายุ: ลดขนาด")]},mexiletine:{rows:[r("Oral · rapid control (ventricular arrhythmias)","รับประทาน · ต้องการควบคุมเร็ว (ventricular arrhythmia)","400 mg load, then 150-300 mg every 8-12 h. Doses as hydrochloride.","ขนาดนำ 400 มก. แล้ว 150-300 มก. ทุก 8-12 ชม. ขนาดเป็น hydrochloride"),r("Oral · when rapid control is not needed","รับประทาน · ไม่ต้องควบคุมเร็ว","Start 200 mg every 8 h; adjust by 50-100 mg at least 2-3 days apart. Usual 200-300 mg every 8 h; max 400 mg every 8 h.","เริ่ม 200 มก. ทุก 8 ชม. ปรับครั้งละ 50-100 มก. ห่างกันอย่างน้อย 2-3 วัน ปกติ 200-300 มก. ทุก 8 ชม. สูงสุด 400 มก. ทุก 8 ชม."),r("Twice-daily option","ทางเลือกวันละ 2 ครั้ง","If controlled on 300 mg or less every 8 h, may switch to every 12 h (max 450 mg every 12 h).","ถ้าคุมได้ที่ 300 มก. หรือน้อยกว่าทุก 8 ชม. เปลี่ยนเป็นทุก 12 ชม. ได้ (สูงสุด 450 มก. ทุก 12 ชม.)"),r("Special groups","กลุ่มพิเศษ","Mild to moderate hepatic impairment: raise the dose only after at least 2 weeks. (MIMS also lists myotonia: 167-500 mg/day as base.)","ตับบกพร่องเล็กน้อยถึงปานกลาง: เพิ่มขนาดหลังให้ยาอย่างน้อย 2 สัปดาห์ (MIMS ระบุข้อบ่งใช้ myotonia ด้วย: 167-500 มก./วัน เป็น base)")]},phenytoin:{na:!0,rows:[r("No arrhythmia dose","ไม่มีขนาดสำหรับหัวใจเต้นผิดจังหวะ","MIMS lists phenytoin for seizures only (for example status epilepticus: IV loading 10-15 mg/kg at no more than 50 mg/min).","MIMS ระบุเฉพาะข้อบ่งใช้ชัก (เช่น status epilepticus ให้ IV 10-15 มก./กก. ไม่เร็วกว่า 50 มก./นาที)")]},flecainide:{rows:[r("Oral · SVT and paroxysmal AF/flutter (no structural heart disease)","รับประทาน · SVT และ paroxysmal AF/flutter (ไม่มีโรคหัวใจเชิงโครงสร้าง)","Tablets 50 mg every 12 h, raised by 50 mg twice daily at 4-day intervals; max 300 mg/day. Controlled-release capsule 100 mg once daily, raised by 100 mg at least 7 days apart; max 300 mg/day.","ยาเม็ด 50 มก. ทุก 12 ชม. เพิ่มครั้งละ 50 มก. วันละ 2 ครั้ง ห่างกัน 4 วัน สูงสุด 300 มก./วัน แคปซูลออกฤทธิ์นาน 100 มก. วันละครั้ง เพิ่มครั้งละ 100 มก. ห่างกันอย่างน้อย 7 วัน สูงสุด 300 มก./วัน"),r("Oral · sustained VT (no structural heart disease)","รับประทาน · sustained VT (ไม่มีโรคหัวใจเชิงโครงสร้าง)","Tablets 50-100 mg every 12 h, raised by 50 mg twice daily every 4 days; max 400 mg/day.","ยาเม็ด 50-100 มก. ทุก 12 ชม. เพิ่มครั้งละ 50 มก. วันละ 2 ครั้ง ทุก 4 วัน สูงสุด 400 มก./วัน"),r("IV (as listed by MIMS)","ฉีด IV (ตามที่ MIMS ระบุ)","2 mg/kg over at least 10 min (max 150 mg). For prolonged therapy then 1.5 mg/kg/h for 1 h, then 0.1-0.25 mg/kg/h; max 600 mg in 24 h; continuous ECG.","2 มก./กก. ใน 10 นาทีขึ้นไป (สูงสุด 150 มก.) ถ้าต้องให้ต่อ หยด 1.5 มก./กก./ชม. 1 ชม. แล้ว 0.1-0.25 มก./กก./ชม. สูงสุด 600 มก. ใน 24 ชม. ติดตาม ECG ต่อเนื่อง")]},propafenone:{rows:[r("Oral · ventricular arrhythmias and paroxysmal AF/flutter/SVT","รับประทาน · ventricular arrhythmia และ paroxysmal AF/flutter/SVT","Tablets 150 mg three times daily; may raise at least 3 days apart to 300 mg twice daily (or 225 mg every 8 h for the atrial arrhythmias). Max 300 mg three times daily. Under 70 kg: may need a lower dose.","ยาเม็ด 150 มก. วันละ 3 ครั้ง เพิ่มได้ห่างกันอย่างน้อย 3 วันเป็น 300 มก. วันละ 2 ครั้ง (หรือ 225 มก. ทุก 8 ชม. สำหรับ atrial arrhythmia) สูงสุด 300 มก. วันละ 3 ครั้ง น้ำหนักน้อยกว่า 70 กก. อาจต้องลดขนาด"),r("Oral · AF recurrence (no structural heart disease)","รับประทาน · ป้องกัน AF กลับเป็นซ้ำ (ไม่มีโรคหัวใจเชิงโครงสร้าง)","Extended-release capsule 225 mg every 12 h, raised at least 5 days apart to 325 mg, then 425 mg every 12 h.","แคปซูลออกฤทธิ์นาน 225 มก. ทุก 12 ชม. เพิ่มห่างกันอย่างน้อย 5 วันเป็น 325 มก. แล้ว 425 มก. ทุก 12 ชม.")]},esmolol:{rows:[r("IV · rate control in supraventricular arrhythmias and sinus tachycardia","ฉีด IV · ควบคุมอัตราเต้นใน supraventricular arrhythmia และ sinus tachycardia","500 mcg/kg over 1 min, then 50 mcg/kg/min for 4 min.","500 มคก./กก. ใน 1 นาที แล้ว 50 มคก./กก./นาที นาน 4 นาที"),r("IV · if the response is inadequate","ฉีด IV · ถ้าตอบสนองไม่พอ","Within 5 min, raise in 50 mcg/kg/min steps (4 min each) to a max of 200 mcg/kg/min; the 500 mcg/kg load may be repeated before each step. May continue up to 48 h.","ภายใน 5 นาที เพิ่มครั้งละ 50 มคก./กก./นาที (ขั้นละ 4 นาที) สูงสุด 200 มคก./กก./นาที ให้ขนาดนำ 500 มคก./กก. ซ้ำก่อนเพิ่มแต่ละขั้นได้ ต่อได้นานถึง 48 ชม."),r("IV · perioperative tachycardia or hypertension","ฉีด IV · หัวใจเต้นเร็วหรือความดันสูงระหว่างผ่าตัด","1,000 mcg/kg bolus, then 150 mcg/kg/min, up to 300 mcg/kg/min.","1,000 มคก./กก. แล้ว 150 มคก./กก./นาที สูงสุด 300 มคก./กก./นาที")]},metoprolol:{rows:[r("IV · arrhythmias (especially supraventricular)","ฉีด IV · arrhythmia (โดยเฉพาะ supraventricular)","Up to 5 mg at 1-2 mg/min, repeated every 5 min to a total of 10-15 mg.","ไม่เกิน 5 มก. อัตรา 1-2 มก./นาที ซ้ำทุก 5 นาที รวม 10-15 มก."),r("IV · during anaesthesia","ฉีด IV · ระหว่างดมยาสลบ","2-4 mg slow IV, plus 2 mg as needed; max 10 mg.","2-4 มก. ฉีดช้า เพิ่มครั้งละ 2 มก. ตามต้องการ สูงสุด 10 มก."),r("Oral · arrhythmias","รับประทาน · arrhythmia","Tartrate 50 mg two or three times daily, up to 300 mg/day in divided doses; max 400 mg/day.","tartrate 50 มก. วันละ 2-3 ครั้ง เพิ่มได้ถึง 300 มก./วัน แบ่งให้ สูงสุด 400 มก./วัน"),r("Oral · heart failure (succinate)","รับประทาน · หัวใจล้มเหลว (succinate)","12.5-25 mg once daily, raised every 2 weeks; max 200 mg/day.","12.5-25 มก. วันละครั้ง เพิ่มทุก 2 สัปดาห์ สูงสุด 200 มก./วัน")]},carvedilol:{na:!0,rows:[r("No arrhythmia dose","ไม่มีขนาดสำหรับหัวใจเต้นผิดจังหวะ","MIMS lists carvedilol for heart failure, post-MI LV dysfunction, angina and hypertension only.","MIMS ระบุเฉพาะหัวใจล้มเหลว LV dysfunction หลัง MI angina และความดันสูง"),r("Chronic heart failure (immediate-release)","หัวใจล้มเหลวเรื้อรัง (ชนิดออกฤทธิ์ทันที)","3.125 mg twice daily for 2 weeks, doubled at least 2 weeks apart to 25 mg twice daily (50 mg twice daily if over 85 kg).","3.125 มก. วันละ 2 ครั้ง 2 สัปดาห์ เพิ่มเป็น 2 เท่าห่างกันอย่างน้อย 2 สัปดาห์ จนถึง 25 มก. วันละ 2 ครั้ง (น้ำหนักเกิน 85 กก. 50 มก. วันละ 2 ครั้ง)"),r("Post-MI LV dysfunction","LV dysfunction หลัง MI","6.25 mg twice daily, target 25 mg twice daily.","6.25 มก. วันละ 2 ครั้ง เป้าหมาย 25 มก. วันละ 2 ครั้ง")]},propranolol:{rows:[r("IV · emergency treatment of arrhythmias","ฉีด IV · รักษา arrhythmia ฉุกเฉิน","1 mg over 1 min, may repeat every 2 min until a response. Max 10 mg in conscious patients, 5 mg under anaesthesia.","1 มก. ใน 1 นาที ซ้ำได้ทุก 2 นาทีจนตอบสนอง สูงสุด 10 มก. ในผู้ป่วยที่รู้ตัว หรือ 5 มก. ขณะดมยาสลบ"),r("Oral · arrhythmias","รับประทาน · arrhythmia","10-40 mg three or four times daily.","10-40 มก. วันละ 3-4 ครั้ง")]},bisoprolol:{na:!0,rows:[r("No arrhythmia dose","ไม่มีขนาดสำหรับหัวใจเต้นผิดจังหวะ","MIMS lists bisoprolol for heart failure, angina and hypertension only.","MIMS ระบุเฉพาะหัวใจล้มเหลว angina และความดันสูง"),r("Chronic heart failure","หัวใจล้มเหลวเรื้อรัง","1.25 mg once daily for 1 week, stepped up weekly to 10 mg once daily (max 10 mg).","1.25 มก. วันละครั้ง 1 สัปดาห์ เพิ่มทุกสัปดาห์จนถึง 10 มก. วันละครั้ง (สูงสุด 10 มก.)"),r("Angina or hypertension","angina หรือความดันสูง","5 mg once daily, usual 10 mg; max 20 mg/day.","5 มก. วันละครั้ง ปกติ 10 มก. สูงสุด 20 มก./วัน")]},amiodarone:{rows:[r("IV · severe arrhythmias unresponsive to other therapy","ฉีด IV · arrhythmia รุนแรงที่ไม่ตอบสนองการรักษาอื่น","5 mg/kg in 250 mL D5W over 20-120 min; may repeat to a total of 1,200 mg in 24 h.","5 มก./กก. ใน D5W 250 มล. นาน 20-120 นาที ซ้ำได้จนรวม 1,200 มก. ใน 24 ชม."),r("IV · emergency","ฉีด IV · ฉุกเฉิน","150-300 mg slow IV over at least 3 min; may repeat after at least 15 min.","150-300 มก. ฉีดช้านานอย่างน้อย 3 นาที ซ้ำได้หลังอย่างน้อย 15 นาที"),r("IV · recurrent VF or unstable VT","ฉีด IV · VF ซ้ำหรือ VT ที่ไม่คงที่","150 mg over 10 min, then 900 mg at 1 mg/min for 6 h and 0.5 mg/min for 18 h; then 0.5 mg/min. Breakthrough: 150 mg over 10 min.","150 มก. ใน 10 นาที แล้ว 900 มก. อัตรา 1 มก./นาที 6 ชม. และ 0.5 มก./นาที 18 ชม. จากนั้น 0.5 มก./นาที กำเริบระหว่างให้ยา: 150 มก. ใน 10 นาที"),r("IV · cardiac arrest (refractory VF / pulseless VT)","ฉีด IV · หัวใจหยุดเต้น (VF / pulseless VT ดื้อต่อช็อก)","300 mg (or 5 mg/kg) rapid IV, then 150 mg (2.5 mg/kg) if it persists.","300 มก. (หรือ 5 มก./กก.) ฉีดเร็ว แล้ว 150 มก. (2.5 มก./กก.) ถ้ายังไม่หาย"),r("Oral · severe arrhythmias","รับประทาน · arrhythmia รุนแรง","200 mg three times daily for 1 week, 200 mg twice daily for 1 week, then 200 mg or less daily.","200 มก. วันละ 3 ครั้ง 1 สัปดาห์ แล้ว 200 มก. วันละ 2 ครั้ง 1 สัปดาห์ แล้ว 200 มก. หรือน้อยกว่าต่อวัน"),r("Oral · recurrent VF / unstable VT","รับประทาน · VF ซ้ำ / VT ที่ไม่คงที่","800-1,600 mg/day for 1-3 weeks, then 600-800 mg/day for 1 month, then usually 400 mg/day (lowest effective dose, e.g. 200 mg).","800-1,600 มก./วัน 1-3 สัปดาห์ แล้ว 600-800 มก./วัน 1 เดือน แล้วโดยทั่วไป 400 มก./วัน (ขนาดต่ำสุดที่ได้ผล เช่น 200 มก.)"),r("Special groups","กลุ่มพิเศษ","Elderly: lowest effective dose.","ผู้สูงอายุ: ใช้ขนาดต่ำสุดที่ได้ผล")]},sotalol:{rows:[r("Oral · life-threatening ventricular arrhythmias","รับประทาน · ventricular arrhythmia ที่อันตรายถึงชีวิต","80 mg daily (one or two doses), raised every 2-3 days; or 80 mg twice daily, raised every 3 days. Usual 160-320 mg/day in 2 doses; 480-640 mg/day in some refractory cases.","80 มก./วัน (ครั้งเดียวหรือแบ่ง 2 ครั้ง) เพิ่มทุก 2-3 วัน หรือ 80 มก. วันละ 2 ครั้ง เพิ่มทุก 3 วัน ปกติ 160-320 มก./วัน แบ่ง 2 ครั้ง บางรายที่ดื้อต้องใช้ 480-640 มก./วัน"),r("Oral · keep sinus rhythm after AF/flutter conversion","รับประทาน · รักษาจังหวะไซนัสหลังแปลง AF/flutter","Start 80 mg/day, raise to 160-320 mg/day in 2 doses. Alternative: 80 mg twice daily, up to 120 mg twice daily if QT is under 500 ms.","เริ่ม 80 มก./วัน เพิ่มเป็น 160-320 มก./วัน แบ่ง 2 ครั้ง ทางเลือก: 80 มก. วันละ 2 ครั้ง เพิ่มได้ถึง 120 มก. วันละ 2 ครั้งถ้า QT ต่ำกว่า 500 ms"),r("Renal impairment (oral)","ไตบกพร่อง (รับประทาน)","CrCl 30-60: half the dose. 10 to under 30: a quarter. Under 10: contraindicated.","CrCl 30-60: ครึ่งหนึ่ง 10 ถึงต่ำกว่า 30: หนึ่งในสี่ ต่ำกว่า 10: ห้ามใช้"),r("IV · when oral is not feasible","ฉีด IV · เมื่อรับประทานไม่ได้","75 mg twice daily over 5 h (equals 80 mg oral); raise at 3-day steps to 112.5, then 150 mg twice daily if QT allows.","75 มก. วันละ 2 ครั้ง ใน 5 ชม. (เทียบเท่ายากิน 80 มก.) เพิ่มทุก 3 วันเป็น 112.5 แล้ว 150 มก. วันละ 2 ครั้ง ถ้า QT ไม่ยาวเกิน")]},dronedarone:{rows:[r("Oral · keep sinus rhythm after cardioversion","รับประทาน · รักษาจังหวะไซนัสหลังแปลงจังหวะ","400 mg twice daily, in clinically stable paroxysmal or persistent AF when other options are unsuitable.","400 มก. วันละ 2 ครั้ง ใน AF ชนิด paroxysmal หรือ persistent ที่อาการคงที่ เมื่อทางเลือกอื่นไม่เหมาะสม")]},ibutilide:{rows:[r("IV · rapid conversion of recent-onset AF or flutter","ฉีด IV · แปลง AF หรือ flutter ที่เพิ่งเกิด","Under 60 kg: 0.01 mg/kg. 60 kg or more: 1 mg. Over 10 min.","น้อยกว่า 60 กก.: 0.01 มก./กก. 60 กก. ขึ้นไป: 1 มก. ใน 10 นาที"),r("Second dose","ครั้งที่สอง","If it persists 10 min after the end of the infusion, a second equal 10-min infusion may be given.","ถ้ายังไม่หายภายใน 10 นาทีหลังจบการหยด ให้ครั้งที่สองขนาดเท่าเดิมใน 10 นาทีได้")]},dofetilide:{rows:[r("Oral · keep sinus rhythm (AF/flutter over 1 week, converted)","รับประทาน · รักษาจังหวะไซนัส (AF/flutter นานกว่า 1 สัปดาห์ ที่แปลงแล้ว)","500 mcg twice daily. Check QTc 2-3 h after the first dose.","500 มคก. วันละ 2 ครั้ง ตรวจ QTc 2-3 ชม. หลังขนาดแรก"),r("QTc rules","เกณฑ์ QTc","If QTc rose over 15% or is over 500 ms (550 ms with ventricular conduction abnormality): reduce to 250 mcg twice daily. Stop if over 500 ms (550 ms) after the second dose.","ถ้า QTc เพิ่มเกิน 15% หรือเกิน 500 ms (550 ms ถ้ามีการนำไฟฟ้าห้องล่างผิดปกติ): ลดเป็น 250 มคก. วันละ 2 ครั้ง หยุดยาถ้าเกิน 500 ms (550 ms) หลังขนาดที่สอง"),r("Renal impairment","ไตบกพร่อง","CrCl 40-60: start 250 mcg twice daily (125 mcg twice daily if QTc rises). 20-39: start 125 mcg twice daily (125 mcg once daily if QTc rises). Under 20: contraindicated.","CrCl 40-60: เริ่ม 250 มคก. วันละ 2 ครั้ง (ลดเป็น 125 มคก. วันละ 2 ครั้งถ้า QTc เพิ่ม) 20-39: เริ่ม 125 มคก. วันละ 2 ครั้ง (ลดเป็น 125 มคก. วันละครั้ง) ต่ำกว่า 20: ห้ามใช้")]},diltiazem:{rows:[r("IV bolus · AF/flutter rate control and PSVT conversion","ฉีด IV · ควบคุมอัตราเต้นใน AF/flutter และแปลง PSVT","0.25 mg/kg (about 20 mg) over 2 min; if inadequate after 15 min, 0.35 mg/kg (about 25 mg).","0.25 มก./กก. (ประมาณ 20 มก.) ใน 2 นาที ถ้าไม่พอหลัง 15 นาที ให้ 0.35 มก./กก. (ประมาณ 25 มก.)"),r("IV infusion · continued rate control","หยด IV · ควบคุมอัตราเต้นต่อเนื่อง","After 1-2 boluses: 5-10 mg/h, raised by 5 mg/h to a max of 15 mg/h, for up to 24 h.","หลังฉีดนำ 1-2 ครั้ง: 5-10 มก./ชม. เพิ่มครั้งละ 5 มก./ชม. สูงสุด 15 มก./ชม. นานถึง 24 ชม."),r("Oral","รับประทาน","MIMS gives angina and hypertension doses only (angina: conventional tablets 30 mg four times daily, usual 180-360 mg/day); no oral arrhythmia dose.","MIMS ระบุเฉพาะขนาดสำหรับ angina และความดันสูง (angina: ยาเม็ดธรรมดา 30 มก. วันละ 4 ครั้ง ปกติ 180-360 มก./วัน) ไม่มีขนาดยากินสำหรับ arrhythmia")]},verapamil:{rows:[r("IV · supraventricular arrhythmias","ฉีด IV · supraventricular arrhythmia","5-10 mg by slow injection over 2-3 min, then 5 mg after 5-10 min if needed.","5-10 มก. ฉีดช้าใน 2-3 นาที แล้ว 5 มก. หลัง 5-10 นาทีถ้าจำเป็น"),r("Oral · supraventricular arrhythmias","รับประทาน · supraventricular arrhythmia","120-480 mg/day in 3-4 divided doses, depending on response and severity.","120-480 มก./วัน แบ่ง 3-4 ครั้ง ตามการตอบสนองและความรุนแรง")]},adenosine:{rows:[r("IV · PSVT conversion","ฉีด IV · แปลง PSVT","3 mg rapid bolus over 2 s; if ineffective within 1-2 min, 6 mg, then 12 mg after another 1-2 min.","3 มก. ฉีดเร็วใน 2 วินาที ถ้าไม่ได้ผลใน 1-2 นาที ให้ 6 มก. แล้ว 12 มก. หลังอีก 1-2 นาที"),r("IV · alternative","ฉีด IV · ทางเลือก","6 mg over 1-2 s, then two further 12 mg doses at 1-2 min intervals.","6 มก. ใน 1-2 วินาที แล้ว 12 มก. อีก 2 ครั้ง ห่างกัน 1-2 นาที"),r("How to give","วิธีให้","Inject into an IV line as close to the patient as possible, then a rapid saline flush (large-bore cannula if peripheral). The same schedule is used as an aid to diagnosing broad- or narrow-complex SVT.","ฉีดเข้าสายน้ำเกลือใกล้ตัวผู้ป่วยที่สุด ตามด้วย NSS flush เร็ว (ใช้เข็มขนาดใหญ่ถ้าฉีดทางหลอดเลือดส่วนปลาย) ใช้ขนาดเดียวกันเพื่อช่วยวินิจฉัย SVT ชนิด QRS กว้างหรือแคบ")]},digoxin:{rows:[r("IV · AF/flutter and heart failure (no glycoside in the last 2 weeks)","ฉีด IV · AF/flutter และหัวใจล้มเหลว (ไม่ได้ glycoside ใน 2 สัปดาห์)","Load 0.5-1 mg in divided doses over 10-20 min: about half first, the rest every 4-8 h.","ขนาดนำ 0.5-1 มก. แบ่งให้ ใน 10-20 นาที ให้ประมาณครึ่งหนึ่งก่อน ที่เหลือทุก 4-8 ชม."),r("Oral · rapid digitalisation","รับประทาน · digitalisation เร็ว","0.75-1.5 mg as a single dose, or divided 6 h apart. Mild heart failure: 0.25-0.75 mg daily for 1 week.","0.75-1.5 มก. ครั้งเดียว หรือแบ่งห่างกัน 6 ชม. หัวใจล้มเหลวเล็กน้อย: 0.25-0.75 มก./วัน 1 สัปดาห์"),r("Maintenance","ขนาดต่อเนื่อง","By lean body weight and renal function. Most heart failure patients 0.125-0.25 mg daily (0.0625 mg or less if sensitive). Elderly: a lower dose may be needed.","ตามน้ำหนักตัวไม่รวมไขมันและการทำงานของไต ผู้ป่วยหัวใจล้มเหลวส่วนใหญ่ 0.125-0.25 มก./วัน (0.0625 มก. หรือน้อยกว่าถ้าไวต่อยา) ผู้สูงอายุ: อาจต้องลดขนาด")]},magnesium:{na:!0,rows:[r("No antiarrhythmic dose","ไม่มีขนาดต้านหัวใจเต้นผิดจังหวะ","The torsades dose in this guide comes from the Tzivoni 1988 case series, not MIMS.","ขนาดสำหรับ torsades ในคู่มือนี้มาจากรายงาน Tzivoni 1988 ไม่ใช่ MIMS"),r("Low magnesium · IV","Mg ต่ำ · ฉีด IV","No symptoms: 1-2 g over 1-2 h (mild) up to 4-8 g over 4-24 h (severe). Symptomatic: 1-2 g bolus over 2-15 min, repeated as needed.","ไม่มีอาการ: 1-2 ก. ใน 1-2 ชม. (เล็กน้อย) ถึง 4-8 ก. ใน 4-24 ชม. (รุนแรง) มีอาการ: 1-2 ก. ฉีดใน 2-15 นาที ซ้ำได้ตามต้องการ"),r("Eclampsia · IV","ครรภ์เป็นพิษ · ฉีด IV","4-6 g over 15-30 min, then 1-2 g/h.","4-6 ก. ใน 15-30 นาที แล้ว 1-2 ก./ชม.")]},vernakalant:{na:!0,rows:[r("Not in MIMS Thailand","ไม่มีใน MIMS Thailand","No dosage section. The EU label dose is in vel A, but not with impaired LV systolic function, severe LVH or coronary artery disease. Adding a beta-blocker, diltiazem or verapamil should be considered (IIa, C) so atrial flutter cannot conduct 1:1.","Class I ระดับหลักฐาน A แต่ไม่ใช้ถ้า LV systolic function บกพร่อง LVH รุนแรง หรือโรคหลอดเลือดหัวใจ ควรพิจารณาให้ beta-blocker, diltiazem หรือ verapamil ร่วมด้วย (IIa, C) เพื่อกันการนำ 1:1 เมื่อเปลี่ยนเป็น atrial flutter")];return{flecainide:{rows:[...a("200-300 mg; long-term 50-150 mg twice daily. Converts about 50-60% by 3 h and 75-85% by 6-8 h.","200-300 มก. ระยะยาว 50-150 มก. วันละ 2 ครั้ง แปลงจังหวะได้ประมาณ 50-60% ใน 3 ชม. และ 75-85% ใน 6-8 ชม.","1-2 mg/kg over 10 min; converts 52-95% (within about 6 h).","1-2 มก./กก. ใน 10 นาที แปลงจังหวะได้ 52-95% (ภายในประมาณ 6 ชม.)"),e("Cautions","ข้อควรระวัง","Not for severe structural or coronary artery disease, Brugada syndrome, or CrCl below 35 mL/min/1.73 m2. Give an AV-node blocker in case it turns into flutter. Stop the infusion if QRS widens over 25% or bundle branch block appears. Not for converting atrial flutter. Pill-in-the-pocket only after supervised inpatient testing.","ไม่ใช้ในโรคโครงสร้างหัวใจหรือหลอดเลือดหัวใจรุนแรง Brugada syndrome หรือ CrCl ต่ำกว่า 35 มล./นาที/1.73 ตร.ม. ให้ยาที่กด AV node ไว้ เผื่อเปลี่ยนเป็น flutter หยุดยาเมื่อ QRS กว้างขึ้นเกิน 25% หรือเกิด bundle branch block ไม่ใช้แปลง atrial flutter และใช้ pill-in-the-pocket ได้เมื่อเคยทดสอบความปลอดภัยในโรงพยาบาลแล้วเท่านั้น")]},propafenone:{rows:a("450-600 mg; long-term 150-300 mg three times daily. Converts about 45-55% by 3 h and 69-78% by 8 h.","450-600 มก. ระยะยาว 150-300 มก. วันละ 3 ครั้ง แปลงจังหวะได้ประมาณ 45-55% ใน 3 ชม. และ 69-78% ใน 8 ชม.","1.5-2 mg/kg over 10 min; converts 43-89% (within about 6 h).","1.5-2 มก./กก. ใน 10 นาที แปลงจังหวะได้ 43-89% (ภายในประมาณ 6 ชม.)")},amiodarone:{rows:[e("Rhythm control, IV / oral","ควบคุมจังหวะ IV / รับประทาน","300 mg IV over 30-60 min, then 900-1,200 mg IV over 24 h (or 200 mg orally three times daily for 4 weeks). Long-term 200 mg daily. Converts about 44% (8-12 h to several days).","300 มก. IV ใน 30-60 นาที แล้ว 900-1,200 มก. IV ใน 24 ชม. (หรือรับประทาน 200 มก. วันละ 3 ครั้ง 4 สัปดาห์) ระยะยาว 200 มก. วันละครั้ง แปลงจังหวะได้ประมาณ 44% (8-12 ชม. ถึงหลายวัน)"),e("Recommendation","คำแนะนำ","Class I, level A for long-term rhythm control in AF with HFrEF, with monitoring for extracardiac toxicity. For rate control it is a last option; IV amiodarone may be considered when haemodynamics are unstable or LVEF is severely low (IIb, B).","Class I ระดับ A สำหรับควบคุมจังหวะระยะยาวใน AF ที่มี HFrEF โดยติดตามพิษนอกหัวใจ ใช้ควบคุมอัตราเป็นทางเลือกสุดท้าย IV amiodarone พิจารณาได้เมื่อ hemodynamics ไม่คงที่หรือ LVEF ต่ำมาก (IIb, B)"),e("Cautions","ข้อควรระวัง","Phlebitis (large peripheral vein, avoid IV over 24 h, volumetric pump). Hypotension, bradycardia or AV block, QT prolongation. Only if nothing else works in hyperthyroidism. Contraindicated in iodine sensitivity. Many drug interactions; serious lung, eye, liver and thyroid effects.","หลอดเลือดดำอักเสบ (ใช้หลอดเลือดดำส่วนปลายขนาดใหญ่ ไม่ให้ IV เกิน 24 ชม. ใช้ volumetric pump) ความดันต่ำ หัวใจเต้นช้าหรือ AV block QT ยาว ในภาวะไทรอยด์เป็นพิษใช้เมื่อไม่มีทางเลือกอื่นเท่านั้น ห้ามใช้ถ้าแพ้ไอโอดีน ปฏิกิริยาระหว่างยามาก และมีผลข้างเคียงรุนแรงต่อปอด ตา ตับ และไทรอยด์")]},ibutilide:{rows:[e("IV (cardioversion)","ฉีด IV (แปลงจังหวะ)","1 mg over 10 min (0.01 mg/kg if under 60 kg); repeat 1 mg 10-20 min later. Converts 31-51% of AF (30-90 min) and 60-75% of flutter (60 min).","1 มก. ใน 10 นาที (0.01 มก./กก. ถ้าน้ำหนักต่ำกว่า 60 กก.) ให้ซ้ำ 1 มก. หลัง 10-20 นาที แปลง AF ได้ 31-51% (30-90 นาที) และ flutter ได้ 60-75% (60 นาที)"),e("Cautions","ข้อควรระวัง","Give in a cardiac care unit (QT prolongation, torsades de pointes). ECG monitoring for at least 4 h afterwards. Not with prolonged QT, severe LVH or low LVEF.","ให้ในหอผู้ป่วยโรคหัวใจ (QT ยาว torsades de pointes) ติดตาม ECG อย่างน้อย 4 ชม. หลังให้ยา ไม่ใช้เมื่อ QT ยาว LVH รุนแรง หรือ LVEF ต่ำ")]},vernakalant:{rows:[e("IV (cardioversion)","ฉีด IV (แปลงจังหวะ)","3 mg/kg over 10 min (max 339 mg); if needed 2 mg/kg over 10 min after 10-15 min (max 226 mg). About 50% convert within 10 min.","3 มก./กก. ใน 10 นาที (สูงสุด 339 มก.) ถ้าจำเป็นให้ 2 มก./กก. ใน 10 นาที หลัง 10-15 นาที (สูงสุด 226 มก.) ประมาณ 50% แปลงจังหวะภายใน 10 นาที"),e("Cautions","ข้อควรระวัง","Not with systolic BP under 100 mmHg, ACS within 1 month, NYHA III-IV HF, QT prolongation or severe aortic stenosis. May cause hypotension, QT prolongation, QRS widening or non-sustained VT.","ไม่ใช้เมื่อ SBP ต่ำกว่า 100 มม.ปรอท ACS ภายใน 1 เดือน HF NYHA III-IV QT ยาว หรือ aortic stenosis รุนแรง อาจทำให้ความดันต่ำ QT ยาว QRS กว้าง หรือ non-sustained VT")]},dronedarone:{rows:[e("Long-term rhythm control","ควบคุมจังหวะระยะยาว","400 mg twice daily. Class I, level A for AF needing long-term rhythm control, including HFmrEF, HFpEF, ischaemic heart disease and valve disease.","400 มก. วันละ 2 ครั้ง Class I ระดับ A สำหรับ AF ที่ต้องควบคุมจังหวะระยะยาว รวมถึง HFmrEF, HFpEF, โรคหัวใจขาดเลือด และโรคลิ้นหัวใจ"),e("Rate control","ควบคุมอัตราการเต้น","Do not start it for rate control: it raised heart failure, stroke and cardiovascular death in permanent AF.","ไม่เริ่มใช้เพื่อควบคุมอัตราการเต้น เพราะเพิ่ม heart failure, stroke และการเสียชีวิตจากโรคหัวใจใน AF แบบถาวร")]},sotalol:{rows:[e("Long-term rhythm control","ควบคุมจังหวะระยะยาว","80-160 mg twice daily. Class IIb, level A, for normal LVEF or coronary artery disease, with close monitoring of QT, potassium, renal function and other proarrhythmia risks. The guideline notes a mortality signal.","80-160 มก. วันละ 2 ครั้ง Class IIb ระดับ A ในผู้ที่ LVEF ปกติหรือมีโรคหลอดเลือดหัวใจ โดยติดตาม QT โพแทสเซียม การทำงานของไต และปัจจัยเสี่ยง proarrhythmia อย่างใกล้ชิด แนวทางระบุสัญญาณการเสียชีวิตที่เพิ่มขึ้น")]},metoprolol:{rows:[e("Rate control","ควบคุมอัตราการเต้น","Tartrate: 2.5-5 mg IV over 2 min, up to 15 mg total; orally 25-100 mg twice daily. XL (succinate): 50-200 mg once daily. Beta-blockers are first choice at any LVEF (I, B); with LVEF 40% or less, beta-blocker and/or digoxin.","Tartrate: 2.5-5 มก. IV ใน 2 นาที รวมไม่เกิน 15 มก. รับประทาน 25-100 มก. วันละ 2 ครั้ง XL (succinate): 50-200 มก. วันละครั้ง Beta-blocker เป็นยาแรกที่เลือกได้ทุกระดับ LVEF (I, B) ถ้า LVEF 40% หรือต่ำกว่าใช้ beta-blocker และ/หรือ digoxin"),e("Contraindications","ข้อห้ามใช้","Acute heart failure and a history of severe bronchospasm. Avoid non-selective beta-blockers in asthma.","ภาวะหัวใจล้มเหลวเฉียบพลันและประวัติหลอดลมหดเกร็งรุนแรง หลีกเลี่ยง beta-blocker แบบไม่จำเพาะในโรคหืด")]},esmolol:{rows:[e("Rate control, IV","ควบคุมอัตราการเต้น IV","500 microgram/kg bolus over 1 min, then 50-300 microgram/kg/min.","bolus 500 ไมโครกรัม/กก. ใน 1 นาที แล้วหยด 50-300 ไมโครกรัม/กก./นาที")]},bisoprolol:{rows:[e("Rate control","ควบคุมอัตราการเต้น","1.25-20 mg once daily (usual oral range).","1.25-20 มก. วันละครั้ง (ช่วงขนาดรับประทานทั่วไป)")]},carvedilol:{rows:[e("Rate control","ควบคุมอัตราการเต้น","3.125-50 mg twice daily (usual oral range).","3.125-50 มก. วันละ 2 ครั้ง (ช่วงขนาดรับประทานทั่วไป)")]},verapamil:{rows:[e("Rate control","ควบคุมอัตราการเต้น","IV 2.5-10 mg bolus over 5 min; orally 40 mg twice daily up to 480 mg once daily (extended release). First choice with LVEF above 40% (I, B).","IV 2.5-10 มก. bolus ใน 5 นาที รับประทาน 40 มก. วันละ 2 ครั้ง ถึง 480 มก. วันละครั้ง (ชนิดออกฤทธิ์นาน) เป็นยาแรกที่เลือกได้เมื่อ LVEF มากกว่า 40% (I, B)"),e("Contraindications","ข้อห้ามใช้","Contraindicated if LVEF is 40% or less. Adapt the dose in hepatic and renal impairment. Avoid combining with a beta-blocker except under close monitoring.","ห้ามใช้ถ้า LVEF 40% หรือต่ำกว่า ปรับขนาดในผู้ป่วยตับและไตบกพร่อง หลีกเลี่ยงการใช้ร่วมกับ beta-blocker ยกเว้นติดตามอย่างใกล้ชิด")]},diltiazem:{rows:[e("Rate control","ควบคุมอัตราการเต้น","IV 0.25 mg/kg bolus over 5 min, then 5-15 mg/h; orally 60 mg three times daily up to 360 mg once daily (extended release). First choice with LVEF above 40% (I, B).","IV 0.25 มก./กก. bolus ใน 5 นาที แล้วหยด 5-15 มก./ชม. รับประทาน 60 มก. วันละ 3 ครั้ง ถึง 360 มก. วันละครั้ง (ชนิดออกฤทธิ์นาน) เป็นยาแรกที่เลือกได้เมื่อ LVEF มากกว่า 40% (I, B)"),e("Contraindications","ข้อห้ามใช้","Contraindicated if LVEF is 40% or less. Adapt the dose in hepatic and renal impairment. Avoid combining with a beta-blocker except under close monitoring.","ห้ามใช้ถ้า LVEF 40% หรือต่ำกว่า ปรับขนาดในผู้ป่วยตับและไตบกพร่อง หลีกเลี่ยงการใช้ร่วมกับ beta-blocker ยกเว้นติดตามอย่างใกล้ชิด")]},digoxin:{rows:[e("Rate control","ควบคุมอัตราการเต้น","IV 0.5 mg bolus (0.75-1.5 mg over 24 h in divided doses); orally 0.0625-0.25 mg once daily. First choice with LVEF above 40% (I, B); with LVEF 40% or less, beta-blocker and/or digoxin (I, B). IV digoxin may be considered in unstable haemodynamics (IIb, B).","IV 0.5 มก. bolus (0.75-1.5 มก. ใน 24 ชม. แบ่งให้) รับประทาน 0.0625-0.25 มก. วันละครั้ง เป็นยาแรกที่เลือกได้เมื่อ LVEF มากกว่า 40% (I, B) ถ้า LVEF 40% หรือต่ำกว่าใช้ beta-blocker และ/หรือ digoxin (I, B) IV digoxin พิจารณาได้เมื่อ hemodynamics ไม่คงที่ (IIb, B)"),e("Cautions","ข้อควรระวัง","High plasma levels are linked to adverse events. Check renal function before starting and adapt the dose in CKD.","ระดับยาในเลือดสูงสัมพันธ์กับอาการไม่พึงประสงค์ ตรวจการทำงานของไตก่อนเริ่มและปรับขนาดใน CKD")]}}})();DRUGS_DATA.forEach((e=>{e.esc=ESC_AF[e.id]||null})),SOURCES["esc24-af"]={short:"ESC 2024 AF guideline (Table 12, Table 13)",title:"Van Gelder IC, et al. 2024 ESC Guidelines for the management of atrial fibrillation developed in collaboration with EACTS. Eur Heart J 2024;45:3314-3414",url:"https://doi.org/10.1093/eurheartj/ehae176"};const ESC_VA=(()=>{const e=(e,a,t,r)=>({lEn:e,lTh:a,en:t,th:r}),a=a=>[e("Beta-blocker class entry","ข้อมูลระดับกลุ่ม beta-blocker",'Used for PVC and VT (LQTS, CPVT). The guideline gives no dose for this drug ("various"). Slows the sinus node, prolongs PR, shortens QT.','ใช้ใน PVC และ VT (LQTS, CPVT) แนวทางไม่ระบุขนาดของยาตัวนี้ ("various") ทำให้ sinus node ช้าลง PR ยาวขึ้น QT สั้นลง'),e("Contraindications","ข้อห้ามใช้","Severe sinus node dysfunction, severe AV conduction disturbance, decompensated heart failure, coronary vasospasm, severe asthma, Brugada syndrome. Can cause bradycardia, AV block, hypotension.","sinus node dysfunction รุนแรง ความผิดปกติของการนำไฟฟ้า AV รุนแรง หัวใจล้มเหลวที่ไม่คงที่ coronary vasospasm หอบหืดรุนแรง Brugada syndrome อาจทำให้หัวใจเต้นช้า AV block ความดันต่ำ"),...a];return{amiodarone:{rows:[e("Dose","ขนาดยา","Oral 200-400 mg/day after loading 600-1,200 mg/day for 8-10 days. IV 5 mg/kg over 20 min to 2 h, 2-3 times in 24 h, then 600-1,200 mg/24 h. For PVC, VT and VF; can be used in heart failure.","รับประทาน 200-400 มก./วัน หลังให้ loading 600-1,200 มก./วัน นาน 8-10 วัน IV 5 มก./กก. ใน 20 นาที ถึง 2 ชม. วันละ 2-3 ครั้ง แล้ว 600-1,200 มก./24 ชม. ใช้ใน PVC, VT และ VF ใช้ในผู้ป่วยหัวใจล้มเหลวได้"),e("Recommendations","คำแนะนำ","Electrical storm with structural heart disease: a beta-blocker (non-selective preferred) plus IV amiodarone (I, B). Tolerated sustained monomorphic VT with no established diagnosis: IV amiodarone may be considered (IIb, B).","Electrical storm ที่มีโรคโครงสร้างหัวใจ: beta-blocker (แนะนำชนิดไม่จำเพาะ) ร่วมกับ IV amiodarone (I, B) sustained monomorphic VT ที่ทนได้และยังไม่ทราบการวินิจฉัย: พิจารณา IV amiodarone ได้ (IIb, B)"),e("Cautions","ข้อควรระวัง","Sinus node dysfunction, severe AV conduction disturbance, hyperthyroidism. Raises myopathy risk with statins. Bradycardia, rarely TdP; photosensitivity, corneal deposits, thyroid, lung and liver toxicity, neuropathy, skin discolouration.","sinus node dysfunction ความผิดปกติของการนำไฟฟ้า AV รุนแรง ไทรอยด์เป็นพิษ เพิ่มความเสี่ยงกล้ามเนื้ออักเสบเมื่อใช้ร่วมกับ statin หัวใจเต้นช้า พบ TdP ได้น้อย แพ้แสง corneal deposits พิษต่อไทรอยด์ ปอด ตับ เส้นประสาท ผิวสีเปลี่ยน")]},adenosine:{rows:[e("Dose and use","ขนาดยาและการใช้","IV 6-18 mg bolus (no oral use). Regular wide-complex tachycardia of unknown origin (outflow tract VT). When the tachycardia may be supraventricular, adenosine or vagal manoeuvres should be considered (IIa, C).","IV 6-18 มก. bolus (ไม่มีรูปแบบรับประทาน) ใช้ใน wide-complex tachycardia ที่สม่ำเสมอและไม่ทราบต้นเหตุ (outflow tract VT) เมื่อสงสัยว่าเป็น SVT ควรพิจารณา adenosine หรือ vagal manoeuvres (IIa, C)"),e("Cautions","ข้อควรระวัง","Not in severe asthma or pre-excited AF. Chest pain, flushing, bronchoconstriction. Theophylline is the antagonist.","ห้ามใช้ในโรคหืดรุนแรงหรือ pre-excited AF เจ็บหน้าอก หน้าแดง หลอดลมหดเกร็ง ยาต้านฤทธิ์คือ theophylline")]},disopyramide:{rows:[e("Dose","ขนาดยา","Oral 250-750 mg/day, for PVC and VT. Also reduces LV outflow obstruction and symptoms in HCM.","รับประทาน 250-750 มก./วัน ใช้ใน PVC และ VT ลด LV outflow obstruction และอาการใน HCM ได้"),e("Contraindications","ข้อห้ามใช้","Severe sinus node dysfunction, severe AV or intraventricular conduction disturbance, prior MI, significant structural heart disease, hypotension. Negative inotropy, AV block, proarrhythmia (occasionally TdP), anticholinergic effects.","sinus node dysfunction รุนแรง ความผิดปกติของการนำไฟฟ้า AV หรือในห้องล่างรุนแรง เคยเป็น MI โรคโครงสร้างหัวใจที่สำคัญ ความดันต่ำ กดการบีบตัว AV block proarrhythmia (บางครั้ง TdP) ผลต้านโคลิเนอร์จิก")]},flecainide:{rows:[e("Dose","ขนาดยา","Oral 200-400 mg/day; IV 1-2 mg/kg over 10 min. For PVC and VT; unmasks the Brugada ECG. For a tolerated sustained monomorphic VT without significant structural heart disease, flecainide, ajmaline or sotalol may be considered (IIb, C).","รับประทาน 200-400 มก./วัน IV 1-2 มก./กก. ใน 10 นาที ใช้ใน PVC และ VT และใช้เปิดเผย Brugada ECG สำหรับ sustained monomorphic VT ที่ทนได้และไม่มีโรคโครงสร้างหัวใจสำคัญ พิจารณา flecainide, ajmaline หรือ sotalol ได้ (IIb, C)"),e("Contraindications","ข้อห้ามใช้","Prior MI, significant structural heart disease, Brugada syndrome, severe sinus node dysfunction, severe AV or intraventricular conduction disturbance, inherited LQTS other than LQT3, CrCl below 35 mL/min/1.73 m2. Stop if QRS widens over 25% or bundle branch block appears.","เคยเป็น MI โรคโครงสร้างหัวใจที่สำคัญ Brugada syndrome sinus node dysfunction รุนแรง ความผิดปกติของการนำไฟฟ้า AV หรือในห้องล่างรุนแรง inherited LQTS ที่ไม่ใช่ LQT3 CrCl ต่ำกว่า 35 มล./นาที/1.73 ตร.ม. หยุดยาเมื่อ QRS กว้างขึ้นเกิน 25% หรือเกิด bundle branch block")]},lidocaine:{rows:[e("Dose","ขนาดยา","IV 50-200 mg bolus, then 2-4 mg/min (no oral use). For VT/VF associated with acute coronary syndrome. More effective with high potassium; few haemodynamic effects.","IV 50-200 มก. bolus แล้ว 2-4 มก./นาที (ไม่มีรูปแบบรับประทาน) ใช้ใน VT/VF ที่สัมพันธ์กับ ACS ได้ผลดีขึ้นเมื่อโพแทสเซียมสูง ผลต่อ hemodynamics น้อย"),e("Cautions","ข้อควรระวัง","Reduce the dose when liver blood flow is low (shock, beta-blockade, severe heart failure). Sinoatrial arrest; drowsiness and dizziness.","ลดขนาดเมื่อเลือดไปตับน้อย (shock, ใช้ beta-blocker, หัวใจล้มเหลวรุนแรง) sinoatrial arrest ง่วงซึม เวียนศีรษะ")]},mexiletine:{rows:[e("Dose","ขนาดยา","Oral 600-1,200 mg/day; loading 400 mg first, then 600 mg in the first 24 h. For PVC and VT (LQT3).","รับประทาน 600-1,200 มก./วัน loading 400 มก. ก่อน แล้ว 600 มก. ใน 24 ชม.แรก ใช้ใน PVC และ VT (LQT3)"),e("Contraindications","ข้อห้ามใช้","Sinus node dysfunction, severe AV conduction disturbance, severe heart failure. Tremor, dysarthria, dizziness, GI complaints; sinus bradycardia and hypotension.","sinus node dysfunction ความผิดปกติของการนำไฟฟ้า AV รุนแรง หัวใจล้มเหลวรุนแรง มือสั่น พูดไม่ชัด เวียนศีรษะ อาการทางเดินอาหาร หัวใจเต้นช้าและความดันต่ำ")]},procainamide:{rows:[e("Dose","ขนาดยา","IV 100 mg bolus, repeat after 5 min if no effect, up to 500-750 mg (max 50 mg/min), then 2-6 mg/min. For VT. For a tolerated sustained monomorphic VT with known or suspected structural heart disease, IV procainamide should be considered (IIa, B).","IV 100 มก. bolus ให้ซ้ำหลัง 5 นาทีถ้าไม่ได้ผล รวมไม่เกิน 500-750 มก. (ไม่เกิน 50 มก./นาที) แล้ว 2-6 มก./นาที ใช้ใน VT สำหรับ sustained monomorphic VT ที่ทนได้และมีหรือสงสัยโรคโครงสร้างหัวใจ ควรพิจารณา IV procainamide (IIa, B)"),e("Contraindications","ข้อห้ามใช้","Severe sinus node dysfunction, severe AV or intraventricular conduction disturbance, severe LV dysfunction, hypotension, Brugada syndrome. Bradycardia, hypotension, TdP; rash, myalgia, vasculitis, lupus, agranulocytosis.","sinus node dysfunction รุนแรง ความผิดปกติของการนำไฟฟ้า AV หรือในห้องล่างรุนแรง LV dysfunction รุนแรง ความดันต่ำ Brugada syndrome หัวใจเต้นช้า ความดันต่ำ TdP ผื่น ปวดกล้ามเนื้อ vasculitis lupus agranulocytosis")]},propafenone:{rows:[e("Dose","ขนาดยา","Oral 450-900 mg/day, for PVC and VT.","รับประทาน 450-900 มก./วัน ใช้ใน PVC และ VT"),e("Contraindications","ข้อห้ามใช้","Prior MI, significant structural heart disease, Brugada syndrome, severe sinus node dysfunction, severe AV or intraventricular conduction disturbance, LQTS, significant renal or liver disease. Stop if QRS widens over 25% or bundle branch block appears.","เคยเป็น MI โรคโครงสร้างหัวใจที่สำคัญ Brugada syndrome sinus node dysfunction รุนแรง ความผิดปกติของการนำไฟฟ้า AV หรือในห้องล่างรุนแรง LQTS โรคไตหรือตับที่สำคัญ หยุดยาเมื่อ QRS กว้างขึ้นเกิน 25% หรือเกิด bundle branch block")]},quinidine:{rows:[e("Dose","ขนาดยา","Oral 600-1,600 mg/day; loading 200 mg every 3 h until effect, max 3 g in the first 24 h. For VF, Brugada syndrome and short QT syndrome. May be considered in coronary artery disease with electrical storm from recurrent polymorphic VT when other drugs fail (IIb, C).","รับประทาน 600-1,600 มก./วัน loading 200 มก. ทุก 3 ชม. จนได้ผล สูงสุด 3 ก. ใน 24 ชม.แรก ใช้ใน VF, Brugada syndrome และ short QT syndrome พิจารณาได้ในโรคหลอดเลือดหัวใจที่เกิด electrical storm จาก polymorphic VT ซ้ำเมื่อยาอื่นไม่ได้ผล (IIb, C)"),e("Contraindications","ข้อห้ามใช้","Severe sinus node dysfunction, severe AV or intraventricular conduction disturbance, previous MI, significant structural heart disease, hypotension, LQTS. Hypotension and TdP; GI, hearing and vision disturbances, confusion, blood count effects, anaphylaxis.","sinus node dysfunction รุนแรง ความผิดปกติของการนำไฟฟ้า AV หรือในห้องล่างรุนแรง เคยเป็น MI โรคโครงสร้างหัวใจที่สำคัญ ความดันต่ำ LQTS ความดันต่ำและ TdP ผลต่อทางเดินอาหาร การได้ยิน การมองเห็น สับสน เม็ดเลือดผิดปกติ anaphylaxis")]},ranolazine:{rows:[e("Dose","ขนาดยา","Oral 750-2,000 mg/day, for VT (LQT3).","รับประทาน 750-2,000 มก./วัน ใช้ใน VT (LQT3)"),e("Contraindications","ข้อห้ามใช้","Severe sinus node dysfunction, severe heart failure, LQTS other than LQT3. Caution with other QT-prolonging treatment. Sinus bradycardia, hypotension, dizziness, nausea, constipation.","sinus node dysfunction รุนแรง หัวใจล้มเหลวรุนแรง LQTS ที่ไม่ใช่ LQT3 ระวังเมื่อใช้ร่วมกับการรักษาที่ทำให้ QT ยาว หัวใจเต้นช้า ความดันต่ำ เวียนศีรษะ คลื่นไส้ ท้องผูก")]},sotalol:{rows:[e("Dose","ขนาดยา","Oral 160-640 mg/day; IV 0.5-1.5 mg/kg over 10 min, can be repeated after 6 h. For VT. The potassium-channel effect needs higher doses than the beta-blocker effect.","รับประทาน 160-640 มก./วัน IV 0.5-1.5 มก./กก. ใน 10 นาที ให้ซ้ำได้หลัง 6 ชม. ใช้ใน VT ผลบล็อกช่องโพแทสเซียมต้องใช้ขนาดสูงกว่าผล beta-blocker"),e("Contraindications","ข้อห้ามใช้","Severe sinus node dysfunction, severe AV conduction disturbance, severe heart failure with reduced LVEF, significant LVH, CrCl below 30 mL/min, coronary vasospasm, LQTS. TdP in over 2% of patients: monitor QT and CrCl closely; caution with hypokalaemia and other QT-prolonging drugs.","sinus node dysfunction รุนแรง ความผิดปกติของการนำไฟฟ้า AV รุนแรง หัวใจล้มเหลวรุนแรงที่ LVEF ต่ำ LVH ที่สำคัญ CrCl ต่ำกว่า 30 มล./นาที coronary vasospasm LQTS พบ TdP ในผู้ป่วยมากกว่า 2% ต้องติดตาม QT และ CrCl อย่างใกล้ชิด ระวังเมื่อโพแทสเซียมต่ำและใช้ยาอื่นที่ทำให้ QT ยาว")]},verapamil:{rows:[e("Dose and use","ขนาดยาและการใช้","Oral 120-480 mg/day; IV 5-10 mg slow bolus, can be repeated after 30 min. Tolerated idiopathic VT: IV verapamil for fascicular VT (I, C). IV verapamil is not recommended in broad-QRS tachycardia of unknown mechanism (III, B).","รับประทาน 120-480 มก./วัน IV 5-10 มก. ฉีดช้า ให้ซ้ำได้หลัง 30 นาที idiopathic VT ที่ทนได้: ใช้ IV verapamil สำหรับ fascicular VT (I, C) ไม่แนะนำ IV verapamil ใน broad-QRS tachycardia ที่ไม่ทราบกลไก (III, B)"),e("Contraindications","ข้อห้ามใช้","Heart failure with reduced LVEF, severe sinus node dysfunction, severe AV conduction disturbance, VT of unknown origin, ACS, WPW syndrome. Raises myopathy risk with statins.","หัวใจล้มเหลวที่ LVEF ต่ำ sinus node dysfunction รุนแรง ความผิดปกติของการนำไฟฟ้า AV รุนแรง VT ที่ไม่ทราบต้นเหตุ ACS WPW syndrome เพิ่มความเสี่ยงกล้ามเนื้ออักเสบเมื่อใช้ร่วมกับ statin")]},propranolol:{rows:[e("Dose","ขนาดยา","Oral 80-320 mg/day (IV 160 mg/24 h). Non-selective; for PVC and VT (electrical storm, LQTS, CPVT). In electrical storm with structural heart disease, a non-selective beta-blocker plus IV amiodarone is recommended (I, B). Oral metoprolol, propranolol or verapamil should be considered for long-term idiopathic sustained VT in pregnancy (IIa, C).","รับประทาน 80-320 มก./วัน (IV 160 มก./24 ชม.) beta-blocker ชนิดไม่จำเพาะ ใช้ใน PVC และ VT (electrical storm, LQTS, CPVT) ใน electrical storm ที่มีโรคโครงสร้างหัวใจ แนะนำ beta-blocker ชนิดไม่จำเพาะร่วมกับ IV amiodarone (I, B) ในการตั้งครรภ์ควรพิจารณา metoprolol, propranolol หรือ verapamil แบบรับประทานสำหรับ idiopathic sustained VT ระยะยาว (IIa, C)"),e("Contraindications","ข้อห้ามใช้","Severe sinus node dysfunction, severe AV conduction disturbance, decompensated heart failure, coronary vasospasm, severe asthma, Brugada syndrome.","sinus node dysfunction รุนแรง ความผิดปกติของการนำไฟฟ้า AV รุนแรง หัวใจล้มเหลวที่ไม่คงที่ coronary vasospasm หอบหืดรุนแรง Brugada syndrome")]},metoprolol:{rows:a([e("Pregnancy","การตั้งครรภ์","Oral metoprolol, propranolol or verapamil should be considered for long-term management of idiopathic sustained VT during pregnancy (IIa, C).","ควรพิจารณา metoprolol, propranolol หรือ verapamil แบบรับประทานสำหรับ idiopathic sustained VT ระยะยาวในการตั้งครรภ์ (IIa, C)")])},esmolol:{rows:a([])},carvedilol:{rows:a([])},bisoprolol:{rows:a([])},magnesium:{rows:[e("Recommendation","คำแนะนำ","IV magnesium with potassium supplementation is recommended in torsades de pointes (I, C). No dose is given in the guideline.","แนะนำ IV magnesium ร่วมกับการเสริมโพแทสเซียมในผู้ป่วย torsades de pointes (I, C) แนวทางไม่ระบุขนาดยา")]}}})();DRUGS_DATA.forEach((e=>{e.escVa=ESC_VA[e.id]||null})),SOURCES["esc22-va"]={short:"ESC 2022 ventricular arrhythmia guideline (Table 8)",title:"Zeppenfeld K, et al. 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death. Eur Heart J 2022;43:3997-4126",url:"https://doi.org/10.1093/eurheartj/ehac262"};const ESC_SVT=(()=>{const e=(e,a,t,r)=>({lEn:e,lTh:a,en:t,th:r}),a=e("Cautions","ข้อควรระวัง","IV verapamil and diltiazem are contraindicated with hypotension or HFrEF. Not recommended, and potentially harmful, in pre-excited AF (III, B).","IV verapamil และ diltiazem ห้ามใช้เมื่อความดันต่ำหรือ HFrEF ไม่แนะนำและอาจเป็นอันตรายใน pre-excited AF (III, B)"),t=(a,t)=>e("Use","การใช้",a+" IV should be considered if vagal manoeuvres and adenosine fail, in narrow-QRS tachycardia, AVNRT and orthodromic AVRT (IIa, B), and in focal atrial tachycardia if adenosine fails (IIa, C). Chronic: with no HFrEF, should be considered if ablation is not desirable or feasible, in AVNRT (IIa, B), orthodromic AVRT without pre-excitation (IIa, B) and focal AT (IIa, C).",t+" IV ควรพิจารณาเมื่อ vagal manoeuvres และ adenosine ไม่ได้ผล ใน narrow-QRS tachycardia, AVNRT และ orthodromic AVRT (IIa, B) และใน focal atrial tachycardia เมื่อ adenosine ไม่ได้ผล (IIa, C) ระยะยาว: ถ้าไม่มี HFrEF ควรพิจารณาเมื่อการทำ ablation ไม่เหมาะหรือทำไม่ได้ ใน AVNRT (IIa, B), orthodromic AVRT ที่ไม่มี pre-excitation (IIa, B) และ focal AT (IIa, C)"),r=(a,t)=>e("Use","การใช้",a+" IV should be considered, if there is no decompensated HF, when vagal manoeuvres and adenosine fail, in narrow-QRS tachycardia, AVNRT and orthodromic AVRT (IIa, C), and in focal AT if adenosine fails (IIa, C). Chronic: beta-blockers should be considered if ablation is not desirable or feasible, in AVNRT (IIa, B), orthodromic AVRT without pre-excitation (IIa, B) and focal AT (IIa, C).",t+" IV ควรพิจารณา ถ้าไม่มี decompensated HF เมื่อ vagal manoeuvres และ adenosine ไม่ได้ผล ใน narrow-QRS tachycardia, AVNRT และ orthodromic AVRT (IIa, C) และใน focal AT เมื่อ adenosine ไม่ได้ผล (IIa, C) ระยะยาว: ควรพิจารณา beta-blocker เมื่อการทำ ablation ไม่เหมาะหรือทำไม่ได้ ใน AVNRT (IIa, B), orthodromic AVRT ที่ไม่มี pre-excitation (IIa, B) และ focal AT (IIa, C)"),n=e("Cautions","ข้อควรระวัง","IV beta-blockers are contraindicated in decompensated heart failure. Not recommended, and potentially harmful, in pre-excited AF (III, B).","IV beta-blocker ห้ามใช้ในหัวใจล้มเหลวที่ไม่คงที่ ไม่แนะนำและอาจเป็นอันตรายใน pre-excited AF (III, B)"),i=(a,t,r,n)=>[e("Use","การใช้","IV "+a+" may be used in focal atrial tachycardia if the first measures fail (IIb, C), and should be considered in antidromic AVRT (IIa, B). Chronic: "+a+" with no ischaemic or structural heart disease should be considered in focal AT if ablation is not desirable (IIa, C), and may be considered in AVRT (IIb, B)."+r,"IV "+t+" ใช้ได้ใน focal atrial tachycardia เมื่อมาตรการแรกไม่ได้ผล (IIb, C) และควรพิจารณาใน antidromic AVRT (IIa, B) ระยะยาว: "+t+" เมื่อไม่มีโรคหลอดเลือดหัวใจหรือโครงสร้างหัวใจ ควรพิจารณาใน focal AT ถ้าไม่เหมาะกับ ablation (IIa, C) และพิจารณาได้ใน AVRT (IIb, B)"+n),e("Cautions","ข้อควรระวัง","IV flecainide and propafenone are contraindicated in ischaemic or structural heart disease. They prolong the QTc, but much less than class III drugs.","IV flecainide และ propafenone ห้ามใช้ในโรคหลอดเลือดหัวใจหรือโครงสร้างหัวใจ ทำให้ QTc ยาวขึ้น แต่น้อยกว่ายา class III มาก")];return{adenosine:{rows:[e("Dose and use","ขนาดยาและการใช้","6-18 mg IV bolus. Recommended if vagal manoeuvres fail in regular narrow-QRS tachycardia, AVNRT and orthodromic AVRT (I, B); should be considered in focal atrial tachycardia (IIa, B).","6-18 มก. IV bolus แนะนำเมื่อ vagal manoeuvres ไม่ได้ผลใน narrow-QRS tachycardia ที่สม่ำเสมอ, AVNRT และ orthodromic AVRT (I, B) ควรพิจารณาใน focal atrial tachycardia (IIa, B)"),e("Wide-QRS tachycardia","wide-QRS tachycardia","Should be considered if vagal manoeuvres fail and the resting ECG shows no pre-excitation (IIa, C). Avoid it if the resting ECG suggests pre-excitation: in antidromic re-entry it can precipitate cardiac arrest if it induces AF.","ควรพิจารณาเมื่อ vagal manoeuvres ไม่ได้ผลและ ECG ขณะพักไม่มี pre-excitation (IIa, C) หลีกเลี่ยงถ้า ECG ขณะพักบ่งชี้ pre-excitation เพราะใน antidromic re-entry อาจทำให้หัวใจหยุดเต้นหากกระตุ้นให้เกิด AF")]},verapamil:{rows:[t("Verapamil","Verapamil"),e("Cautions","ข้อควรระวัง","IV verapamil is contraindicated with hypotension or HFrEF. Not recommended in wide-QRS tachycardia of unknown cause (III, B), because it can cause severe haemodynamic deterioration in VT. Not recommended, and potentially harmful, in pre-excited AF (III, B).","IV verapamil ห้ามใช้เมื่อความดันต่ำหรือ HFrEF ไม่แนะนำใน wide-QRS tachycardia ที่ไม่ทราบสาเหตุ (III, B) เพราะอาจทำให้ hemodynamics แย่ลงมากใน VT ไม่แนะนำและอาจเป็นอันตรายใน pre-excited AF (III, B)")]},diltiazem:{rows:[t("Diltiazem","Diltiazem"),e("Oral single dose","ขนาดรับประทานครั้งเดียว","A single oral dose of diltiazem 120 mg plus propranolol 80 mg may convert up to about 94% of AVNRT episodes out of hospital, with a risk of hypotension, transient AV block or syncope; caution in the elderly and with sinus or AV node disease.","diltiazem รับประทาน 120 มก. ครั้งเดียวร่วมกับ propranolol 80 มก. อาจแปลง AVNRT ได้สูงสุดประมาณ 94% นอกโรงพยาบาล เสี่ยงความดันต่ำ AV block ชั่วคราว หรือเป็นลม ระวังในผู้สูงอายุและผู้ที่มีโรคของ sinus หรือ AV node"),a]},esmolol:{rows:[r("Esmolol","Esmolol"),n]},metoprolol:{rows:[r("Metoprolol","Metoprolol"),n]},propranolol:{rows:[e("Use","การใช้","Oral propranolol 80 mg with diltiazem 120 mg can convert AVNRT (see diltiazem). IV propranolol, with or without procainamide, may be used for acute junctional ectopic tachycardia, but data are scarce; oral propranolol may be tried for chronic therapy. In inappropriate sinus tachycardia, beta-blockers should be considered in symptomatic patients (IIa, C).","propranolol รับประทาน 80 มก. ร่วมกับ diltiazem 120 มก. แปลง AVNRT ได้ (ดู diltiazem) IV propranolol จะใช้ร่วมกับ procainamide หรือไม่ก็ได้ สำหรับ junctional ectopic tachycardia เฉียบพลัน แต่ข้อมูลน้อย ระยะยาวลองใช้ propranolol รับประทานได้ ใน inappropriate sinus tachycardia ควรพิจารณา beta-blocker ในผู้ป่วยที่มีอาการ (IIa, C)"),n]},ibutilide:{rows:[e("Use","การใช้","IV ibutilide may be used in focal atrial tachycardia if the first measures fail (IIb, C), and should be considered in antidromic AVRT with IV procainamide, flecainide or propafenone, or cardioversion (IIa, B).","IV ibutilide ใช้ได้ใน focal atrial tachycardia เมื่อมาตรการแรกไม่ได้ผล (IIb, C) และควรพิจารณาใน antidromic AVRT ร่วมกับ IV procainamide, flecainide หรือ propafenone หรือการช็อกไฟฟ้า (IIa, B)"),e("Cautions","ข้อควรระวัง","Contraindicated in patients with a prolonged QTc.","ห้ามใช้ในผู้ป่วยที่ QTc ยาว")]},procainamide:{rows:[e("Use","การใช้","Wide-QRS tachycardia of unknown cause: IV procainamide should be considered if vagal manoeuvres and adenosine fail (IIa, B). Antidromic AVRT: should be considered (IIa, B). Also used, with scarce data, for acute junctional ectopic tachycardia.","wide-QRS tachycardia ที่ไม่ทราบสาเหตุ: ควรพิจารณา IV procainamide เมื่อ vagal manoeuvres และ adenosine ไม่ได้ผล (IIa, B) antidromic AVRT: ควรพิจารณา (IIa, B) ใช้ใน junctional ectopic tachycardia เฉียบพลันด้วย แต่ข้อมูลน้อย"),e("Cautions","ข้อควรระวัง","Prolongs the QTc, but much less than class III drugs.","ทำให้ QTc ยาวขึ้น แต่น้อยกว่ายา class III มาก")]},flecainide:{rows:i("flecainide","flecainide"," A single oral dose of 3 mg/kg may also convert AVNRT, at a lower rate than diltiazem plus a beta-blocker."," flecainide รับประทาน 3 มก./กก. ครั้งเดียวอาจแปลง AVNRT ได้เช่นกัน แต่อัตราต่ำกว่า diltiazem ร่วมกับ beta-blocker")},propafenone:{rows:i("propafenone","propafenone","","")},amiodarone:{rows:[e("Use","การใช้","IV amiodarone may be used in focal AT if the first measures fail (IIb, C), may be considered in wide-QRS tachycardia of unknown cause (IIb, B) and in refractory antidromic AVRT (IIb, B). Oral amiodarone may be considered chronically in focal AT if other measures fail (IIb, C). IV amiodarone is the drug of choice for post-operative junctional ectopic tachycardia.","IV amiodarone ใช้ได้ใน focal AT เมื่อมาตรการแรกไม่ได้ผล (IIb, C) พิจารณาได้ใน wide-QRS tachycardia ที่ไม่ทราบสาเหตุ (IIb, B) และ antidromic AVRT ที่ดื้อ (IIb, B) amiodarone รับประทานพิจารณาได้ระยะยาวใน focal AT เมื่อมาตรการอื่นไม่ได้ผล (IIb, C) IV amiodarone เป็นยาที่เลือกใช้สำหรับ junctional ectopic tachycardia หลังผ่าตัด"),e("Cautions","ข้อควรระวัง","Prolongs the QTc, but torsades de pointes is rare. Not recommended, and potentially harmful, in pre-excited AF (III, B).","ทำให้ QTc ยาวขึ้น แต่พบ torsades de pointes ได้น้อย ไม่แนะนำและอาจเป็นอันตรายใน pre-excited AF (III, B)")]},ivabradine:{rows:[e("Use","การใช้","Inappropriate sinus tachycardia: ivabradine alone or with a beta-blocker should be considered in symptomatic patients (IIa, B). Focal atrial tachycardia: with a beta-blocker, may be considered if the other measures fail (IIb, C). Postural orthostatic tachycardia syndrome: may be considered (IIb, C).","inappropriate sinus tachycardia: ควรพิจารณา ivabradine เดี่ยวหรือร่วมกับ beta-blocker ในผู้ป่วยที่มีอาการ (IIa, B) focal atrial tachycardia: ร่วมกับ beta-blocker พิจารณาได้เมื่อมาตรการอื่นไม่ได้ผล (IIb, C) postural orthostatic tachycardia syndrome: พิจารณาได้ (IIb, C)")]},digoxin:{rows:[e("Cautions","ข้อควรระวัง","Digoxin, together with beta-blockers, diltiazem, verapamil and amiodarone, is not recommended and is potentially harmful in pre-excited AF (III, B).","digoxin พร้อมกับ beta-blocker, diltiazem, verapamil art failure (rate typically 150 or more): synchronized cardioversion, sedated whenever feasible (AHA 2025). A first shock of 200 J or more is preferable to lower settings for AF and atrial flutter (AHA 2025).",refs:["aha25-tachy","aha25-als#Key changes"]},{stage:i?"2. ควบคุมอัตราเต้นเฉียบพลัน (IV)":"2. Acute rate control (IV)",content:i?"AHA 2025: Diltiazem 0.25 มก./กก. ใน 2 นาที แล้ว 5-10 มก./ชม.; Verapamil 0.075-0.15 มก./กก. ใน 2 นาที (หลีกเลี่ยง non-DHP CCB ในความดันต่ำ หัวใจล้มเหลว cardiomyopathy และ ACS). Metoprolol 2.5-5 มก. ใน 2 นาที ได้ถึง 3 ครั้ง; Esmolol 500 มคก./กก. ใน 1 นาที แล้ว 50-300 มคก./กก./นาที; Propranolol 1 มก. ใน 1 นาที ได้ถึง 3 ครั้ง (หลีกเลี่ยง beta-blocker ในหัวใจล้มเหลวที่ไม่คงที่). Amiodarone 300 มก. ใน 1 ชม. แล้ว 10-50 มก./ชม.; Digoxin 0.25 มก. ซ้ำได้ถึง 1.5 มก./24 ชม. (มักใช้เสริม)\nACC/AHA 2023: ในการศึกษาแบบสุ่ม diltiazem ควบคุมอัตราเต้นได้เร็วกว่า digoxin หรือ amiodarone":"AHA 2025: diltiazem 0.25 mg/kg over 2 min, then 5-10 mg/h; verapamil 0.075-0.15 mg/kg over 2 min (avoid non-dihydropyridine CCBs in hypotension, heart failure, cardiomyopathy and ACS). Metoprolol 2.5-5 mg over 2 min up to 3 doses; esmolol 500 mcg/kg over 1 min then 50-300 mcg/kg/min; propranolol 1 mg over 1 min up to 3 doses (avoid beta-blockers in decompensated heart failure). Amiodarone 300 mg over 1 h then 10-50 mg/h; digoxin 0.25 mg repeated to max 1.5 mg/24 h (usually adjunctive).\nACC/AHA 2023: in randomized trials IV diltiazem controlled the rate faster than digoxin or amiodarone.",refs:["aha25-als#Table (AF/AFL rate control)","acc23-af#Section 7.2.1, Table 21"]},{stage:i?"3. แปลงจังหวะและยาต้านการแข็งตัวของเลือด":"3. Cardioversion and anticoagulation",content:i?"ACC/AHA 2023: ความเสี่ยงลิ่มเลือดใช้กับทั้งการแปลงจังหวะด้วยยาและด้วยไฟฟ้า ให้ยาต้านการแข็งตัวของเลือดอย่างน้อย 3 สัปดาห์ก่อน (VKA หรือ DOAC; อาจเลือก DOAC ก่อน) หรือตรวจภาพหัวใจเพื่อหาลิ่มเลือด และให้ต่อ 4 สัปดาห์หลังแปลงจังหวะ แนวทางนี้ให้ประเมินความเสี่ยงของผู้ป่วยแต่ละราย แทนการยึดเกณฑ์ 48 ชั่วโมงอย่างเดียว\nยาแปลงจังหวะ (ACC/AHA 2023 ตาราง 22): flecainide 200 มก. (<70 กก.) / 300 มก. (>70 กก.) หรือ propafenone 450 / 600 มก. รับประทานครั้งเดียว (ให้ beta-blocker หรือ non-DHP CCB อย่างน้อย 30 นาทีก่อน ไม่ใช้เมื่อมีโรคหัวใจเชิงโครงสร้าง) ibutilide 1 มก. IV ใน 10 นาที amiodarone IV หรือ procainamide IV":"ACC/AHA 2023: thromboembolic risk applies to both pharmacological and electrical cardioversion. Anticoagulate for at least 3 weeks before (VKA or DOAC; DOACs may be preferred) or image to exclude thrombus, and continue for 4 weeks after. The guideline favors judging each patient's risk over strict reliance on the old 48-hour threshold.\nConversion drugs (ACC/AHA 2023 Table 22): single oral flecainide 200 mg (<70 kg) / 300 mg (>70 kg) or propafenone 450 / 600 mg (beta-blocker or non-DHP CCB at least 30 min before; not with structural heart disease), ibutilide 1 mg IV over 10 min, IV amiodarone, or IV procainamide.",refs:["acc23-af#Section 8.2.1, Table 22, text (pill-in-the-pocket)"]}]},svt:{name:i?"SVT (QRS แคบ จังหวะสม่ำเสมอ)":"Regular Narrow-Complex SVT",steps:[{stage:i?"1. ไม่คงที่":"1. Unstable",content:i?"Synchronized cardioversion ให้ยาระงับประสาทเมื่อทำได้ ถ้า QRS แคบและสม่ำเสมอ พิจารณา adenosine (AHA 2025) พลังงาน: ตามคำแนะนำของเครื่อง ถ้าไม่ทราบใช้พลังงานสูงสุด":"Synchronized cardioversion, sedated whenever feasible; if regular narrow complex, consider adenosine (AHA 2025). Energy: per the device; if not known, use the maximum setting.",refs:["aha25-tachy"]},{stage:i?"2. คงที่: vagal maneuver และ adenosine":"2. Stable: vagal maneuvers and adenosine",content:i?"Vagal maneuver (ถ้าจังหวะสม่ำเสมอ) แล้ว adenosine 6 มก. ฉีด IV เร็ว ตามด้วย NSS flush ถ้าจำเป็นให้ 12 มก. (AHA 2025) ฉลากยาให้ 12 มก. ซ้ำได้อีก 1 ครั้ง ข้อห้าม: AV block ระดับ 2-3 หรือ sick sinus โดยไม่มี pacemaker":"Vagal maneuvers (if regular), then adenosine 6 mg rapid IV push with a saline flush; 12 mg if required (AHA 2025). The label allows the 12 mg dose once more. Contraindicated in second- or third-degree AV block or sick sinus syndrome without a pacemaker.",refs:["aha25-tachy","lbl:adenosine-generic#Dosage and Administration, Contraindications"]},{stage:i?"3. ทางเลือกถัดไป":"3. Next options",content:i?"Beta-blocker หรือ calcium channel blocker (AHA 2025) diltiazem หรือ verapamil IV แปลงจังหวะได้ 64-98% verapamil ได้ผลใกล้ adenosine แต่ระวังความดันต่ำ ขอคำปรึกษาผู้เชี่ยวชาญ ถ้าดื้อต่อการรักษา: หาสาเหตุ เพิ่มพลังงานช็อก หรือเพิ่มยาต้านหัวใจเต้นผิดจังหวะ":"Beta-blocker or calcium channel blocker (AHA 2025). IV diltiazem or verapamil convert 64-98%; verapamil works about as well as adenosine but can cause hypotension. Consider expert consultation. If refractory: look for the cause, raise the energy for the next cardioversion, or add an antiarrhythmic.",refs:["aha25-tachy","aha25-als#Narrow-complex tachycardia text"]}]},vt:{name:"Ventricular Tachycardia (VT / VF)",steps:[{stage:i?"1. ไม่มีชีพจร (VF / pVT)":"1. Pulseless (VF / pVT)",content:i?"CPR และช็อกไฟฟ้า (biphasic ตามคำแนะนำผู้ผลิต เช่น 120-200 J ถ้าไม่ทราบใช้สูงสุด; monophasic 360 J) epinephrine 1 มก. ทุก 3-5 นาที หลังช็อกครั้งที่ 3: amiodarone 300 มก. (ครั้งที่สอง 150 มก.) หรือ lidocaine 1-1.5 มก./กก. (ครั้งที่สอง 0.5-0.75 มก./กก.) magnesium ไม่ช่วยในภาวะหัวใจหยุดเต้นทั่วไป (AHA 2025)":"CPR and defibrillation (biphasic per manufacturer, e.g. 120-200 J, maximum if unknown; monophasic 360 J). Epinephrine 1 mg every 3-5 min. After the third shock: amiodarone 300 mg (second dose 150 mg) or lidocaine 1-1.5 mg/kg (second dose 0.5-0.75 mg/kg). Magnesium does not help in cardiac arrest in general (AHA 2025).",refs:["aha25-ca","aha25-als#Antiarrhythmic and magnesium text"]},{stage:i?"2. Wide-QRS มีชีพจร":"2. Wide-QRS tachycardia with a pulse",content:i?"ไม่คงที่ (เช่น SBP <80 หรือสับสน): synchronized cardioversion ทันที. คงที่: adenosine เฉพาะเมื่อสม่ำเสมอและ QRS รูปเดียว; procainamide 20-50 มก./นาที จนหยุด ความดันต่ำ QRS กว้างขึ้นเกิน 50% หรือครบ 17 มก./กก. แล้ว 1-4 มก./นาที (หลีกเลี่ยงเมื่อ QT ยาวหรือหัวใจล้มเหลว ห้ามเร็วกว่า 50 มก./นาที) หรือ amiodarone 150 มก. ใน 10 นาที แล้ว 1 มก./นาที 6 ชม. ถ้ายังเป็น: synchronized cardioversion และขอคำปรึกษาผู้เชี่ยวชาญ":"Unstable (e.g. SBP under 80 or altered mentation): immediate synchronized cardioversion. Stable: adenosine only if regular and monomorphic; procainamide 20-50 mg/min until suppressed, hypotension, QRS widening over 50%, or 17 mg/kg, then 1-4 mg/min (avoid with prolonged QT or heart failure; never faster than 50 mg/min); or amiodarone 150 mg over 10 min, then 1 mg/min for 6 h. If it persists: synchronized cardioversion; expert consultation.",refs:["aha25-tachy","aha25-als#Wide-complex tachycardia text"]},{stage:i?"3. Polymorphic VT / Torsades de pointes":"3. Polymorphic VT / torsades de pointes",content:i?"Torsades (QT ยาว): magnesium IV ช่วยหยุดและป้องกันการกลับเป็นซ้ำ แก้โพแทสเซียมต่ำ ยาต้านหัวใจเต้นผิดจังหวะอาจทำให้ QT ยาวขึ้น beta-blocker เฉียบพลันอาจกระตุ้นโดยทำให้หัวใจเต้นช้า ขอคำปรึกษาผู้เชี่ยวชาญเมื่อเกิดจากหัวใจเต้นช้าหรือหยุดเต้นเป็นช่วง Magnesium (Tzivoni 1988 รายงาน 12 ราย): 2 ก. IV ซ้ำได้หลัง 5-15 นาที แล้วหยด 3-20 มก./นาที ไม่มี QT ยาว: magnesium ไม่ได้ผล (AHA 2025)":"Torsades (long QT): IV magnesium suppresses and prevents recurrences; correct hypokalemia. Antiarrhythmics can prolong QT further; acute beta-blockers can trigger it through bradycardia. Seek expert advice for bradycardia- or pause-dependent torsades. Magnesium (Tzivoni 1988, 12 patients): 2 g IV bolus, repeat after 5-15 min if needed, then 3-20 mg/min. Without long QT, magnesium is not effective (AHA 2025).",refs:["aha25-als#Polymorphic VT text","aha17-va#Section 5.1.5.1","tzivoni1988#Abstract"]}]},wpw:{name:"Pre-excited AF (WPW with AF)",steps:[{stage:i?"ข้อควรระวัง":"Key warning",content:i?"ยาที่ปิดกั้น AV node อาจเพิ่มการนำผ่านทางลัดและทำให้เกิด VF จึงอาจเป็นอันตราย มีรายงาน VF หลังให้ amiodarone IV (ACC/AHA 2023) ฉลากยาห้ามใช้ diltiazem และ verapamil IV ใน AF/flutter ที่มีทางลัด และ digoxin เพิ่มความเสี่ยง VF":"AV-node blocking drugs can speed conduction over the pathway and cause VF, so they are potentially harmful; VF has been reported after IV amiodarone (ACC/AHA 2023). The labels contraindicate IV diltiazem and verapamil in AF/flutter with an accessory pathway, and warn that digoxin raises VF risk.",refs:["acc23-af#Section 10.6","lbl:diltiazem-inj#Contraindications","lbl:verapamil-inj#Contraindications","lbl:digoxin-tab#Warnings 5.1"]},{stage:i?"การรักษา":"Management",content:i?"ไม่คงที่: แปลงจังหวะด้วยไฟฟ้า. คงที่: ibutilide หรือ procainamide (เพิ่มระยะ refractory ของทางลัด) การรักษาให้หายขาดคือจี้ทำลายทางลัด (สำเร็จ 93-95%) ซึ่งเสนอเป็นการรักษาแรกได้ (ACC/AHA 2023)":"Unstable: electrical cardioversion. Stable: ibutilide or procainamide (they lengthen pathway refractoriness). Definitive therapy is accessory-pathway ablation (93-95% success), which can be offered first-line (ACC/AHA 2023).",refs:["acc23-af#Section 10.6"]}]}}[r];return React.createElement("div",{className:"fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 animate-in fade-in duration-200",onClick:e=>{e.target===e.currentTarget&&a()}},React.createElement("div",{className:"bg-white dark:bg-slate-900 w-full max-w-4xl rounded-2xl shadow-2xl flex flex-col max-h-[92vh] overflow-hidden border border-slate-200 dark:border-slate-800"},React.createElement("div",{className:"flex items-center justify-between p-4 sm:p-5 border-b border-slate-100 dark:border-slate-800 bg-emerald-50/60 dark:bg-emerald-950/30"},React.createElement("div",{className:"flex items-center gap-3"},React.createElement("div",{className:"p-2.5 bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400 rounded-xl"},React.createElement(Stethoscope,{className:"w-5 h-5"})),React.createElement("div",null,React.createElement("h2",{className:"text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100"},"th"===t?"แนวทางการรักษาภาวะหัวใจเต้นผิดจังหวะ (Clinical Pathways)":"Arrhythmia Clinical Guideline
