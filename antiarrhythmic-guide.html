<script>
  // Frame measurement for embedded execution
  (function () {
    var framed = true;
    try { framed = window.self !== window.top; } catch (e) {}
    if (!framed || !window.IntersectionObserver) return;
    var root = document.documentElement;
    var probe = document.createElement('div');
    probe.setAttribute('aria-hidden', 'true');
    probe.setAttribute('data-frame-probe', '');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:100%;pointer-events:none;visibility:hidden;z-index:-1';
    document.body.appendChild(probe);
    var io = null;
    function apply(entries) {
      var e = entries[entries.length - 1], b = e.boundingClientRect, i = e.intersectionRect;
      var top = 0, bottom = 0;
      if (e.isIntersecting && i.height > 0) { top = Math.max(0, Math.round(i.top - b.top)); bottom = Math.max(0, Math.round(b.bottom - i.bottom)); }
      var scrolls = root.scrollHeight > window.innerHeight + 200;
      root.style.setProperty('--clip-top', top + 'px');
      root.style.setProperty('--clip-bottom', bottom + 'px');
      root.style.setProperty('--clip-pad', (scrolls ? Math.min(bottom, 200) : 0) + 'px');
      root.classList.toggle('frame-clipped', top + bottom > 0);
    }
    function watch() {
      if (io) io.disconnect();
      var n = Math.min(1000, Math.max(100, Math.ceil(window.innerHeight / 4))), steps = [];
      for (var k = 0; k <= n; k++) steps.push(k / n);
      io = new IntersectionObserver(apply, { threshold: steps });
      io.observe(probe);
    }
    watch();
    window.addEventListener('resize', watch);
  })();

abel (DailyMed): LANOXIN (digoxin), Advanz Pharma (US) Corp., oral, revised 2024-12-05",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d91e3646-4c63-4512-ab22-db39c085c4dc"},"lbl:digoxin-inj":{short:"FDA label: LANOXIN (digoxin)",title:"US FDA label (DailyMed): LANOXIN (digoxin), Covis Pharma US, Inc, intramuscular, intravenous, revised 2025-10-17",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=9ec84cac-6ecc-43dc-8006-6ccc029e2707"},"lbl:magnesium-inj":{short:"FDA label: Magnesium Sulfate In Dextrose",title:"US FDA label (DailyMed): Magnesium Sulfate In Dextrose, Hospira, Inc., intravenous, revised 2026-08-24",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=03ebeabb-8386-4af4-3086-bdf3c3fc4a5a"},"lbl:ivabradine-corlanor":{short:"FDA label: Corlanor (ivabradine)",title:"US FDA label (DailyMed): Corlanor (ivabradine), Amgen Inc, oral, revised 2025-11-10",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=92018a65-38f6-45f7-91d4-a34921b81d0d"},"lbl:atropine-inj":{short:"FDA label: Atropine Sulfate",title:"US FDA label (DailyMed): Atropine Sulfate, Hospira, Inc., intravenous, revised 2026-05-18",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=ad8916e7-206e-409e-2582-30d072845dd4"},"lbl:dofetilide-tikosyn":{short:"FDA label: Tikosyn (dofetilide)",title:"US FDA label (DailyMed): Tikosyn (dofetilide), Pfizer Laboratories Div Pfizer Inc, oral, revised 2026-04-21",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=02438044-d6a3-49e9-a1ac-3aad21ef2c8c"},"lbl:bisoprolol-tab":{short:"FDA label: Bisoprolol (bisoprolol fumarate)",title:"US FDA label (DailyMed): Bisoprolol (bisoprolol fumarate), Micro Labs Limited, oral, revised 2026-03-11",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=c3ee566c-74c4-45f4-a947-526a7313e326"},"lbl:ranolazine-er":{short:"FDA label: Ranolazine",title:"US FDA label (DailyMed): Ranolazine, Lifestar Pharma LLC, oral, revised 2026-05-06",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=195c4b51-fec2-410d-8d90-487c536a8728"},"lbl:propafenone-er":{short:"FDA label: Propafenone Hydrochloride",title:"US FDA label (DailyMed): Propafenone Hydrochloride, Northstar Rx LLC, oral, revised 2026-06-04",url:"https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2ecd6452-ccc3-493f-9a4a-69f0fbf67a42"},"aha25-als":{short:"AHA 2025 Adult ALS",title:"Part 9: Adult Advanced Life Support. 2025 AHA Guidelines for CPR and ECC. Circulation 2025;152(16 suppl 2):S538-S577",url:"https://www.ahajournals.org/doi/10.1161/CIR.0000000000001376"},"aha25-ca":{short:"AHA 2025 Cardiac Arrest Algorithm",title:"AHA 2025 Adult Cardiac Arrest Algorithm (accessible text version, 25 July 2025)",url:"https://cpr.heart.org/-/media/CPR-Files/CPR-Guidelines-Files/2025-Accessible/Algorithm-ACLS-CA-LngDscrp-250725-Ed.pdf"},"aha25-tachy":{short:"AHA 2025 Tachyarrhythmia Algorithm",title:"AHA 2025 Adult Tachyarrhythmia With a Pulse Algorithm (accessible text version, 26 July 2025)",url:"https://cpr.heart.org/-/media/CPR-Files/CPR-Guidelines-Files/2025-Accessible/Algorithm-ACLS-Tachyarrhythmia-LngDscrp-250726-Ed.pdf"},"aha25-brady":{short:"AHA 2025 Bradycardia Algorithm",title:"AHA 2025 Adult Bradycardia With a Pulse Algorithm (accessible text version, 25 July 2025)",url:"https://cpr.heart.org/-/media/CPR-Files/CPR-Guidelines-Files/2025-Accessible/Algorithm-ACLS-Bradycardia-LngDscrp-250725-Ed.pdf"},"acc23-af":{short:"ACC/AHA/ACCP/HRS 2023 AF",title:"2023 ACC/AHA/ACCP/HRS Guideline for the Diagnosis and Management of Atrial Fibrillation. Circulation 2024;149:e1-e156",url:"https://www.ahajournals.org/doi/10.1161/CIR.0000000000001193"},"aha17-va":{short:"AHA/ACC/HRS 2017 VA/SCD",title:"2017 AHA/ACC/HRS Guideline for Management of Patients With Ventricular Arrhythmias and the Prevention of Sudden Cardiac Death. Circulation 2018;138:e272-e391",url:"https://www.ahajournals.org/doi/10.1161/CIR.0000000000000549"},"ema-brinavess":{short:"EU SmPC: Brinavess",title:"Brinavess (vernakalant) EPAR product information, Summary of Product Characteristics, European Medicines Agency",url:"https://www.ema.europa.eu/en/documents/product-information/brinavess-epar-product-information_en.pdf"},nlem2569:{short:"บัญชียาหลักแห่งชาติ พ.ศ. 2569",title:"ประกาศคณะกรรมการพัฒนาระบบยาแห่งชาติ เรื่อง บัญชียาหลักแห่งชาติ พ.ศ. 2569 (ลงวันที่ 12 ก.พ. 2569; ราชกิจจานุเบกษา เล่ม 143 ตอนพิเศษ 85 ง, 30 มี.ค. 2569), รายการยาฉบับ Excel",url:"https://ndp.fda.moph.go.th/nlem/69-1"},tisdale2013:{short:"Tisdale 2013 QT risk score",title:"Tisdale JE et al. Development and validation of a risk score to predict QT interval prolongation in hospitalized patients. Circ Cardiovasc Qual Outcomes 2013;6:479-487 (PMC3788679)",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC3788679/"},tzivoni1988:{short:"Tzivoni 1988 (magnesium in TdP)",title:"Tzivoni D et al. Treatment of torsade de pointes with magnesium sulfate. Circulation 1988;77:392-397 (case series, 12 patients; PubMed 3338130)",url:"https://doi.org/10.1161/01.cir.77.2.392"}},DRUGS_PART_1=[{id:"procainamide",genericName:"Procainamide",brandNames:[],vwClass:"Ia",classFullName:"Class Ia - Sodium Channel Blocker",color:"amber",primaryTarget:"Sodium channel block (Group 1A); active metabolite NAPA has antiarrhythmic activity",actionPotential:{phase0:"Unknown",apd:"Unknown",erp:"Unknown"},ecgEffects:{pr:"Prolonged (less regularly)",qrs:"Widened",qtc:"Prolonged (less regularly)",hr:"Slight sinus tachycardia (anticholinergic action)"},indications:["vt_vf","af_rhythm"],routes:["IV"],acuteDose:{en:"Label (IV, under ECG monitoring): inject slowly, no faster than 50 mg/min; 100 mg every 5 min until the arrhythmia is suppressed or 500 mg given, then wait 10 min or longer before resuming. Or a loading infusion of 20 mg/mL (1 g in 50 mL D5W) at 1 mL/min for 25-30 min (500-600 mg). Maximum advisable loading dose 1 g. Stop if persistent conduction disturbances or hypotension develop.\nAHA 2025 (stable wide-QRS tachycardia): 20-50 mg/min until the arrhythmia is suppressed, hypotension ensues, QRS widens by more than 50%, or 17 mg/kg is given. Avoid if prolonged QT or heart failure.\nACC/AHA 2023 (AF conversion): 1 g IV over 30 min, then 2 mg/min for 1 h.",th:"ฉลากยา (IV ภายใต้การติดตาม ECG): ฉีดช้า ไม่เกิน 50 มก./นาที ให้ 100 มก. ทุก 5 นาที จนหยุดหัวใจเต้นผิดจังหวะหรือครบ 500 มก. แล้วรอ 10 นาทีขึ้นไปก่อนให้ต่อ หรือหยดนำ 20 มก./มล. (1 ก. ใน D5W 50 มล.) 1 มล./นาที นาน 25-30 นาที (500-600 มก.) ขนาดนำรวมไม่ควรเกิน 1 ก. หยุดยาถ้าการนำไฟฟ้าผิดปกติต่อเนื่องหรือความดันต่ำ\nAHA 2025 (wide-QRS tachycardia ที่คงที่): 20-50 มก./นาที จนหยุดหัวใจเต้นผิดจังหวะ ความดันต่ำ QRS กว้างขึ้นเกิน 50% หรือครบ 17 มก./กก. หลีกเลี่ยงเมื่อ QT ยาวหรือหัวใจล้มเหลว\nACC/AHA 2023 (แปลง AF): 1 ก. IV ใน 30 นาที แล้ว 2 มก./นาที นาน 1 ชม."},maintenanceDose:{en:"IV maintenance infusion: label 2-6 mg/min (1 g in 500 mL D5W = 2 mg/mL at 1-3 mL/min, or 1 g in 250 mL = 4 mg/mL at 0.5-1.5 mL/min), adjusted to response, weight, age, renal function and acetylator status. AHA 2025: 1-4 mg/min. Oral procainamide: Unknown (not covered by the sources used).",th:"หยดต่อเนื่อง IV: ฉลากยา 2-6 มก./นาที (1 ก. ใน D5W 500 มล. = 2 มก./มล. อัตรา 1-3 มล./นาที หรือ 1 ก. ใน 250 มล. = 4 มก./มล. อัตรา 0.5-1.5 มล./นาที) ปรับตามการตอบสนอง น้ำหนัก อายุ การทำงานของไต และการ acetylation. AHA 2025: 1-4 มก./นาที. ยารับประทาน: ไม่ทราบ (ไม่มีในแหล่งอ้างอิงที่ใช้)"},pharmacokinetics:{onset:"Unknown",peak:"IM: plasma peak in 15-60 min",halfLife:"3-4 h with normal renal function (prolonged by reduced CrCl and age); NAPA about 7 h (ACC/AHA 2023)",metabolism:"Hepatic acetylation to NAPA (active): 16-21% of a dose in slow acetylators, 24-33% in fast acetylators",excretion:"Urine: 30-60% unchanged, 6-52% as NAPA (glomerular filtration and tubular secretion). Removed by hemodialysis, not by peritoneal dialysis."},renalAdjustment:{crcl50:"Unknown (label gives no CrCl bands)",crcl30_50:"Reduce dose or infusion rate (label: less than the usual dose may suffice; no CrCl bands given)",crcl10_30:"Reduce dose or infusion rate (label: less than the usual dose may suffice; no CrCl bands given)",crclLess10:"Reduce dose or infusion rate (label: less than the usual dose may suffice; no CrCl bands given)",hd:"Procainamide and NAPA are removed by hemodialysis (not peritoneal dialysis); supplemental dose: Unknown"},renalAdjust:!0,hepaticAdjustment:"Unknown (label gives no hepatic dose rule; hepatic acetylation rate affects NAPA levels)",cautionsAndWarnings:["BOXED WARNING: Prolonged use often leads to a positive ANA, with or without a lupus-like syndrome; reassess benefit if ANA turns positive.","BOXED WARNING: Agranulocytosis, bone marrow depression, neutropenia, hypoplastic anemia and thrombocytopenia (about 0.5%; deaths reported). Check CBC with differential and platelets weekly for the first 3 months, then periodically.","BOXED WARNING (CAST): reserve for life-threatening ventricular arrhythmias; no antiarrhythmic drug has shown improved survival in patients without life-threatening arrhythmias.","Heart failure, acute ischemic heart disease or cardiomyopathy: use with caution (myocardial depression).","Renal insufficiency: accumulation to overdose levels unless the dose is adjusted.","Injection contains sodium metabisulfite (sulfite allergy, asthma)."],contraindications:["Complete heart block","Second-degree AV block or hemiblock unless the ventricular rate is controlled by a pacemaker (avoid or stop)","Established systemic lupus erythematosus","Torsades de pointes","Allergic reaction to procainamide (cross-sensitivity with procaine and ester local anesthetics is unlikely but possible)"],adverseEffects:["Hypotension and serious rhythm disturbances (more common with IV use)","Lupus-like syndrome (under 1 in 500 to 30% on long-term oral therapy)","Agranulocytosis, neutropenia, thrombocytopenia, hemolytic anemia","Raised liver enzymes; deaths from liver failure reported"],monitoring:["ECG during infusion (rhythm, QRS, PR, QT); concern if QRS widens more than 25%, interrupt if 50%","Blood pressure during infusion","CBC with differential and platelets weekly for 3 months, then periodically","Renal function; procainamide and NAPA levels where available"],interactions:["Other antiarrhythmics: additive cardiac effects; dose reduction may be needed","Anticholinergic drugs: additive antivagal effect on AV conduction","Neuromuscular blockers (e.g. succinylcholine): smaller doses may be needed"],safeInHfref:!1,safeCad:!1,qtRisk:"Warning",nlem:{list:null},refs:{mech:["lbl:procainamide-inj#Clinical Pharmacology"],dose:["lbl:procainamide-inj#Dosage and Administration","aha25-tachy","acc23-af#Table 22"],pk:["lbl:procainamide-inj#Clinical Pharmacology, Overdosage","acc23-af#Table 22"],renal:["lbl:procainamide-inj#Dosage and Administration, Warnings, Precautions, Overdosage"],hepatic:["lbl:procainamide-inj#Clinical Pharmacology"],warn:["lbl:procainamide-inj#Boxed Warning, Warnings"],contra:["lbl:procainamide-inj#Contraindications"],adverse:["lbl:procainamide-inj#Adverse Reactions"],monitor:["lbl:procainamide-inj#Boxed Warning, Precautions","acc23-af#Table 25"],interact:["lbl:procainamide-inj#Precautions: Drug Interactions"],flags:["lbl:procainamide-inj#Warnings (heart failure, CAST)","aha25-tachy"],nlem:["nlem2569"]}},{id:"quinidine",genericName:"Quinidine",brandNames:[],vwClass:"Ia",classFullName:"Class Ia - Sodium Channel Blocker",color:"amber",primaryTarget:"Class IA antiarrhythmic; also anticholinergic, negative inotropic and peripheral alpha-adrenergic blocking (vasodilator) activity",actionPotential:{phase0:"Unknown",apd:"Unknown",erp:"Unknown"},ecgEffects:{pr:"Unknown",qrs:"Widened (stop or reduce if QRS reaches 130% of baseline)",qtc:"Prolonged, dose-related",hr:"May rise paradoxically in atrial flutter/fibrillation (faster AV conduction as the atrial rate slows)"},indications:["af_rhythm","vt_vf"],routes:["PO"],acuteDose:{en:"AF/flutter conversion (only after rate control has failed; no optimal regimen established; start in a monitored setting if structural heart disease): one reported regimen is quinidine sulfate 400 mg every 6 h, cautiously increased if no conversion after 4-5 doses. Quinidine gluconate ER: 648 mg every 8 h (increase cautiously after 3-4 doses), or 324 mg every 8 h for 2 days, then 648 mg every 12 h for 2 days, then 648 mg every 8 h for up to 4 days. Stop if QRS or QTc reaches 130% of baseline (QTc then over 500 ms), P waves disappear, or significant tachycardia, symptomatic bradycardia or hypotension occurs.",th:"แปลง AF/flutter (ใช้เมื่อควบคุมอัตราเต้นไม่ได้ผลแล้วเท่านั้น ยังไม่มีสูตรที่ดีที่สุด เริ่มในที่ที่ติดตามได้หากมีโรคหัวใจเชิงโครงสร้าง): สูตรหนึ่งคือ quinidine sulfate 400 มก. ทุก 6 ชม. เพิ่มอย่างระวังถ้าไม่กลับจังหวะหลัง 4-5 ครั้ง. Quinidine gluconate ER: 648 มก. ทุก 8 ชม. (เพิ่มอย่างระวังหลัง 3-4 ครั้ง) หรือ 324 มก. ทุก 8 ชม. 2 วัน แล้ว 648 มก. ทุก 12 ชม. 2 วัน แล้ว 648 มก. ทุก 8 ชม. ไม่เกิน 4 วัน. หยุดยาถ้า QRS หรือ QTc ยาวถึง 130% ของค่าเดิม (และ QTc เกิน 500 ms) P wave หายไป หรือเกิดหัวใจเต้นเร็วมาก หัวใจเต้นช้ามีอาการ หรือความดันต่ำ"},maintenanceDose:{en:"Relapse prevention of AF/flutter: quinidine sulfate 200 mg every 6 h, or quinidine gluconate ER 324 mg every 8-12 h; raise cautiously if tolerated and the serum level is within range. Monitor for 2-3 days after starting the discharge regimen. Life-threatening ventricular arrhythmias: regimens not adequately studied (similar to the AF regimen).",th:"ป้องกันการกลับเป็น AF/flutter: quinidine sulfate 200 มก. ทุก 6 ชม. หรือ quinidine gluconate ER 324 มก. ทุก 8-12 ชม. เพิ่มอย่างระวังถ้าทนได้และระดับยาในเลือดอยู่ในช่วงรักษา ติดตาม 2-3 วันหลังเริ่มสูตรที่จะให้กลับบ้าน. Ventricular arrhythmia ที่อันตรายถึงชีวิต: ยังไม่มีการศึกษาสูตรยาเพียงพอ (ใช้คล้ายสูตร AF)"},pharmacokinetics:{onset:"Unknown",peak:"About 2 h (sulfate tablets)",halfLife:"6-8 h in adults; 3-hydroxyquinidine about 12 h; longer in cirrhosis",metabolism:"Hepatic CYP3A4 to hydroxylated metabolites; 3-hydroxyquinidine has at least half the parent's activity. Inhibits CYP2D6.",excretion:"Renal clearance about 1 mL/min/kg (filtration, tubular secretion, pH-dependent reabsorption). Not usually removed by dialysis."},renalAdjustment:{crcl50:"Unknown (label gives no CrCl bands)",crcl30_50:"Unknown (label: renal dysfunction slows elimination; no dose rule given)",crcl10_30:"Unknown (label: renal dysfunction slows elimination; no dose rule given)",crclLess10:"Unknown (label: renal dysfunction slows elimination; no dose rule given)",hd:"Not usually removed by dialysis"},renalAdjust:null,hepaticAdjustment:"Unknown (label: hepatic dysfunction slows elimination and cirrhosis lengthens the half-life; no dose rule given)",cautionsAndWarnings:["Mortality: in a meta-analysis of AF/flutter relapse-prevention trials, mortality with quinidine was more than 3 times that with placebo; in non-life-threatening ventricular arrhythmias it was higher than with alternative antiarrhythmics.","QT prolongation and torsades de pointes; risk rises with bradycardia, low K, Mg or Ca, and high levels, but may occur without them.","Paradoxical rise in ventricular rate in atrial flutter/fibrillation (may exceed 200 bpm): use only after rate control (e.g. digitalis or beta-blockers).","Vagolysis: vagal maneuvers to stop PSVT may fail.","Immune reactions: thrombocytopenic purpura, hemolytic anemia, agranulocytosis, lupus-like disorder, hepatotoxicity (granulomatous hepatitis)."],contraindications:["Allergy to quinidine, or thrombocytopenic purpura during prior quinidine or quinine therapy","Rhythm dependent on a junctional or idioventricular pacemaker, including complete AV block, without a functioning pacemaker","Conditions harmed by anticholinergic action, such as myasthenia gravis"],adverseEffects:["Diarrhea (35% in a 245-patient trial)","Upper GI distress (22%)","Lightheadedness (15%)","Headache, fatigue, palpitations (7% each)","Cinchonism: tinnitus, hearing loss, vertigo, blurred vision, confusion"],monitoring:["QRS and QTc (reduce or stop at 130% of baseline, QTc over 500 ms)","Serum quinidine level within the laboratory's range","Monitor 2-3 days after starting the discharge regimen","Signs of thrombocytopenia, hepatotoxicity"],interactions:["Digoxin: serum levels may double; digoxin dose usually needs reduction","Warfarin: anticoagulant effect potentiated","Amiodarone, cimetidine, ketoconazole, verapamil, diltiazem: raise quinidine levels","Phenobarbital, phenytoin, rifampin (CYP3A4 inducers): lower quinidine levels","Urine alkalinizers (acetazolamide, bicarbonate, thiazides): reduce renal elimination","Inhibits CYP2D6: raises levels of drugs such as mexiletine, some phenothiazines, tricyclics; raises procainamide levels"],safeInHfref:!1,safeCad:!1,qtRisk:"Warning",nlem:{list:null},refs:{mech:["lbl:quinidine-sulfate#Clinical Pharmacology, Warnings"],dose:["lbl:quinidine-sulfate#Dosage and Administration","lbl:quinidine-gluconate#Dosage and Administration"],pk:["lbl:quinidine-sulfate#Clinical Pharmacology, Overdosage"],renal:["lbl:quinidine-sulfate#Warnings, Overdosage"],hepatic:["lbl:quinidine-sulfate#Warnings, Clinical Pharmacology"],warn:["lbl:quinidine-sulfate#Warnings"],contra:["lbl:quinidine-sulfate#Contraindications"],adverse:["lbl:quinidine-sulfate#Adverse Reactions"],monitor:["lbl:quinidine-sulfate#Dosage and Administration"],interact:["lbl:quinidine-sulfate#Precautions: Drug Interactions"],flags:["lbl:quinidine-sulfate#Warnings (mortality, negative inotropy)"],nlem:["nlem2569"]}},{id:"disopyramide",genericName:"Disopyramide",brandNames:["Norpace","Norpace CR"],vwClass:"Ia",classFullName:"Class Ia - Sodium Channel Blocker with Anticholinergic and Negative Inotropic Effects",color:"amber",primaryTarget:"Type 1A antiarrhythmic with anticholinergic activity and negative inotropic properties; no effect on alpha- or beta-adrenergic receptors",actionPotential:{phase0:"Upstroke velocity decreased (animal studies)",apd:"Increased in normal cells (animal studies)",erp:"Atrial ERP lengthened; minimal effect on AV-node ERP"},ecgEffects:{pr:"May prolong (monitor)",qrs:"Little effect usually; stop if widening over 25%",qtc:"May prolong",hr:"Sinus node recovery time shortened"},indications:["vt_vf"],routes:["PO"],acuteDose:{en:"Rapid control of ventricular arrhythmia: loading dose 300 mg immediate-release (200 mg if under 50 kg), then maintenance; effect in 30 min to 3 h. If no response or toxicity within 6 h, 200 mg every 6 h may be used. No loading dose in cardiomyopathy or possible decompensation (start 100 mg every 6-8 h). Start in hospital.",th:"ต้องการควบคุม ventricular arrhythmia อย่างรวดเร็ว: ขนาดนำ 300 มก. ชนิดออกฤทธิ์ทันที (200 มก. ถ้าน้ำหนักน้อยกว่า 50 กก.) แล้วให้ขนาดต่อเนื่อง ออกฤทธิ์ใน 30 นาทีถึง 3 ชม. ถ้าไม่ตอบสนองหรือไม่มีพิษใน 6 ชม. ใช้ 200 มก. ทุก 6 ชม. ได้. ห้ามให้ขนาดนำใน cardiomyopathy หรืออาจมีหัวใจล้มเหลว (เริ่ม 100 มก. ทุก 6-8 ชม.) เริ่มยาในโรงพยาบาล"},maintenanceDose:{en:"Usual 400-800 mg/day in divided doses; most adults 600 mg/day (150 mg every 6 h immediate-release, or 300 mg every 12 h CR). Under 50 kg: 400 mg/day (100 mg every 6 h, or 200 mg every 12 h CR). Up to 1600 mg/day only in hospital for severe refractory VT.",th:"ปกติ 400-800 มก./วัน แบ่งให้ ผู้ใหญ่ส่วนใหญ่ 600 มก./วัน (150 มก. ทุก 6 ชม. ชนิดออกฤทธิ์ทันที หรือ 300 มก. ทุก 12 ชม. ชนิด CR) น้ำหนักน้อยกว่า 50 กก.: 400 มก./วัน (100 มก. ทุก 6 ชม. หรือ 200 มก. ทุก 12 ชม. CR) สูงสุด 1600 มก./วัน เฉพาะในโรงพยาบาลสำหรับ VT รุนแรงที่ดื้อยา"},pharmacokinetics:{onset:"30 min to 3 h after a 300 mg loading dose",peak:"Usually within 2 h (immediate-release)",halfLife:"Mean 6.7 h (4-10 h); 8-18 h if CrCl under 40 mL/min; longer in hepatic impairment",metabolism:"Hepatic CYP3A4; about 20% excreted as the mono-N-dealkylated metabolite",excretion:"About 50% unchanged in urine. Hemodialysis or charcoal hemoperfusion lowers levels in overdose."},renalAdjustment:{crcl50:"CrCl over 40: 400 mg/day in divided doses (100 mg every 6 h or 200 mg CR every 12 h) for moderate renal insufficiency",crcl30_50:"CrCl over 40: 400 mg/day divided. CrCl 30-40: 100 mg immediate-release every 8 h (with or without 150 mg load); CR not recommended",crcl10_30:"CrCl 15-30: 100 mg every 12 h; CrCl under 15: 100 mg every 24 h (immediate-release only)",crclLess10:"CrCl under 15: 100 mg every 24 h (immediate-release only)",hd:"Unknown (supplemental dose not stated; hemodialysis can lower levels in overdose)"},renalAdjust:!0,hepaticAdjustment:"Hepatic insufficiency: 400 mg/day in divided doses (100 mg every 6 h, or 200 mg CR every 12 h).",cautionsAndWarnings:["BOXED WARNING (CAST): reserve for life-threatening ventricular arrhythmias.","Negative inotropy: may cause or worsen heart failure or severe hypotension; do not use in uncompensated or marginally compensated heart failure or hypotension unless caused by the arrhythmia.","Anticholinergic: avoid in glaucoma, urinary retention, benign prostatic hypertrophy or myasthenia gravis unless overriding measures are taken; measure intraocular pressure if family history of glaucoma.","QRS widening over 25%: stop the drug. QT prolongation and torsades de pointes can occur.","Hypoglycemia (rare); higher risk in heart failure, malnutrition, hepatic or renal disease, or with beta-blockers or alcohol.","Care in sick sinus syndrome, WPW or bundle branch block; stop if second- or third-degree AV block or new fascicular block develops unless paced."],contraindications:["Cardiogenic shock","Pre-existing second- or third-degree AV block without a pacemaker","Congenital QT prolongation","Known hypersensitivity"],adverseEffects:["Dry mouth (32%)","Urinary hesitancy (14%)","Constipation (11%)","Blurred vision, urinary retention, nausea, dizziness (3-9%)","Hypotension and heart failure (most serious)"],monitoring:["ECG: PR, QRS (stop if over 25% wider), QT","Blood pressure and signs of heart failure","Plasma levels if anticholinergic effects increase","Blood glucose in at-risk patients","Intraocular pressure if family history of glaucoma"],interactions:["CYP3A4 inhibitors (clarithromycin, erythromycin): life-threatening interactions reported","Phenytoin and other enzyme inducers: lower disopyramide levels","Other antiarrhythmics (quinidine, procainamide, lidocaine, propranolol): excessive QRS widening or QT prolongation","Verapamil: do not give within 48 h before or 24 h after","Does not raise digoxin levels"],safeInHfref:!1,safeCad:!1,qtRisk:"Warning",nlem:{list:null},refs:{mech:["lbl:disopyramide-norpace#Clinical Pharmacology"],dose:["lbl:disopyramide-norpace#Dosage and Administration"],pk:["lbl:disopyramide-norpace#Clinical Pharmacology, Overdosage"],renal:["lbl:disopyramide-norpace#Dosage and Administration"],hepatic:["lbl:disopyramide-norpace#Dosage and Administration"],warn:["lbl:disopyramide-norpace#Boxed Warning, Warnings"],contra:["lbl:disopyramide-norpace#Contraindications"],adverse:["lbl:disopyramide-norpace#Adverse Reactions"],monitor:["lbl:disopyramide-norpace#Warnings, Precautions"],interact:["lbl:disopyramide-norpace#Precautions: Drug Interactions"],flags:["lbl:disopyramide-norpace#Boxed Warning, Warnings (negative inotropy)"],nlem:["nlem2569"]}},{id:"lidocaine",genericName:"Lidocaine",brandNames:[],vwClass:"Ib",classFullName:"Class Ib - Sodium Channel Blocker",color:"yellow",primaryTarget:"Raises the electrical stimulation threshold of the ventricle during diastole; no change in contractility, arterial pressure or absolute refractory period at usual doses",actionPotential:{phase0:"Unknown",apd:"Unknown",erp:"Absolute refractory period unchanged at usual doses"},ecgEffects:{pr:"Prolongation is a sign of excess effect (stop infusion)",qrs:"Widening is a sign of excess effect (stop infusion)",qtc:"Unknown",hr:"Ventricular rate may rise in AF or flutter"},indications:["vt_vf"],routes:["IV"],acuteDose:{en:"AHA 2025 cardiac arrest (shock-refractory VF/pVT, as an alternative to amiodarone): 1-1.5 mg/kg IV/IO, second dose 0.5-0.75 mg/kg.\nLabel (ventricular arrhythmias): single IV bolus 1-1.5 mg/kg at 25-50 mg/min, under constant ECG monitoring.",th:"AHA 2025 หัวใจหยุดเต้น (VF/pVT ที่ช็อกไม่ได้ผล ใช้แทน amiodarone ได้): 1-1.5 มก./กก. IV/IO ครั้งที่สอง 0.5-0.75 มก./กก.\nฉลากยา (ventricular arrhythmia): ฉีด IV ครั้งเดียว 1-1.5 มก./กก. อัตรา 25-50 มก./นาที ภายใต้การติดตาม ECG ตลอด"},maintenanceDose:{en:"IV infusion 1-4 mg/min (0.02-0.05 mg/kg/min in a 70 kg adult): 4 mg/mL at 15-60 mL/h, or 8 mg/mL at 7.5-30 mL/h. Reduce the rate by about half after 24 h of infusion (clearance falls). Rarely needed beyond 24 h; stop at the earliest sign of toxicity or once the rhythm is stable.",th:"หยด IV 1-4 มก./นาที (0.02-0.05 มก./กก./นาที ในผู้ใหญ่ 70 กก.): 4 มก./มล. อัตรา 15-60 มล./ชม. หรือ 8 มก./มล. อัตรา 7.5-30 มล./ชม. ลดอัตราลงประมาณครึ่งหนึ่งหลังหยด 24 ชม. (การกำจัดยาลดลง) ไม่ค่อยต้องหยดเกิน 24 ชม. หยุดเมื่อเริ่มมีอาการพิษหรือจังหวะคงที่"},pharmacokinetics:{onset:"Unknown",peak:"Unknown",halfLife:"1.5-2 h after an IV bolus; 2-fold or more in liver dysfunction; clearance falls after 24 h infusion",metabolism:"Hepatic CYP1A2 and CYP3A4 (N-dealkylation) to MEGX and GX (active, less potent)",excretion:"About 90% as metabolites, under 10% unchanged in urine. Severe renal dysfunction halves clearance and raises GX 1.5-fold."},renalAdjustment:{crcl50:"No change (mild-moderate renal impairment does not affect kinetics)",crcl30_50:"No change (mild-moderate renal impairment does not affect kinetics)",crcl10_30:"eGFR under 30: lower maintenance infusion rate with close monitoring for toxicity",crclLess10:"eGFR under 30: lower maintenance infusion rate with close monitoring for toxicity",hd:"Unknown"},renalAdjust:!0,hepaticAdjustment:"Lower maintenance infusion rate with close monitoring for toxicity (half-life may double or more).",cautionsAndWarnings:["CNS toxicity rises with venous levels above 6 mcg/mL: drowsiness, tinnitus, paresthesia, confusion, tremor, convulsions, respiratory depression.","Stop the infusion if PR prolongs, QRS widens or arrhythmias appear or worsen.","Sinus bradycardia or incomplete heart block: giving lidocaine without first raising the heart rate (isoproterenol or pacing) may cause worse ventricular arrhythmias or complete heart block.","Ventricular rate may accelerate in atrial fibrillation or flutter.","Renal or hepatic insufficiency raises toxicity risk.","Methemoglobinemia has been reported."],contraindications:["Hypersensitivity to amide-type local anesthetics","Stokes-Adams syndrome","Wolff-Parkinson-White syndrome","Severe sinoatrial, atrioventricular or intraventricular block"],adverseEffects:["CNS: drowsiness, dizziness, tinnitus, paresthesia, confusion, tremor, convulsions, respiratory depression","Bradycardia, hypotension, cardiac arrest","Methemoglobinemia","Allergic reactions (infrequent)"],monitoring:["Constant ECG monitoring during infusion","Signs of CNS toxicity","Infusion rate with a calibrated device; review after 24 h"],interactions:["CYP1A2 and/or CYP3A4 inhibitors (e.g. fluvoxamine, propofol): higher lidocaine levels","CYP1A2/CYP3A4 inducers (e.g. phenytoin): lower levels","Beta-blockers (e.g. propranolol): higher levels by lowering hepatic blood flow","Digitalis toxicity with AV block: monitor for toxicity","Incompatible in the line with amphotericin, cefazolin, phenytoin"],safeInHfref:!0,safeCad:!0,qtRisk:"None",nlem:{list:"b",old:"ก",items:[{form:"Lidocaine HCl (preservative free) sterile sol, 1% and 2%",cond:"ใช้สำหรับ ventricular arrhythmias"}]},refs:{mech:["lbl:lidocaine-premix#Clinical Pharmacology: Mechanism of Action","lbl:lidocaine-premix#Warnings"],dose:["aha25-ca","lbl:lidocaine-premix#Dosage and Administration"],pk:["lbl:lidocaine-premix#Clinical Pharmacology"],renal:["lbl:lidocaine-premix#Dosage and Administration, Clinical Pharmacology"],hepatic:["lbl:lidocaine-premix#Dosage and Administration, Clinical Pharmacology"],warn:["lbl:lidocaine-premix#Warnings, Clinical Pharmacology"],contra:["lbl:lidocaine-premix#Contraindications"],adverse:["lbl:lidocaine-premix#Adverse Reactions"],monitor:["lbl:lidocaine-premix#Dosage and Administration"],interact:["lbl:lidocaine-premix#Precautions: Drug Interactions; Dosage and Administration"],flags:["lbl:lidocaine-premix#Clinical Pharmacology (no change in contractility)","lbl:lidocaine-premix#Indications (ventricular arrhythmias in acute MI)"],nlem:["nlem2569"]}},{id:"mexiletine",genericName:"Mexiletine",brandNames:[],vwClass:"Ib",classFullName:"Class Ib - Oral Sodium Channel Blocker",color:"yellow",primaryTarget:"Inhibits the inward sodium current (like lidocaine; orally active)",actionPotential:{phase0:"Rate of rise reduced",apd:"Unknown",erp:"Decreased in Purkinje fibers"},ecgEffects:{pr:"Unknown",qrs:"Not prolonged",qtc:"Not prolonged",hr:"Sinus rate may fall in pre-existing conduction disease"},indications:["vt_vf"],routes:["PO"],acuteDose:{en:"When rapid control is essential: loading dose 400 mg, then 200 mg 8 h later; effect usually within 30 min to 2 h. Start in hospital.",th:"เมื่อต้องการควบคุมอย่างรวดเร็ว: ขนาดนำ 400 มก. แล้ว 200 มก. ในอีก 8 ชม. ออกฤทธิ์ภายใน 30 นาทีถึง 2 ชม. เริ่มยาในโรงพยาบาล"},maintenanceDose:{en:"Start 200 mg every 8 h with food or antacid; adjust by 50-100 mg no sooner than every 2-3 days. Most patients: 200-300 mg every 8 h; 400 mg every 8 h may be tried. Maximum 1200 mg/day. If controlled on 300 mg or less every 8 h, the same daily dose may be split every 12 h (up to 450 mg every 12 h).",th:"เริ่ม 200 มก. ทุก 8 ชม. พร้อมอาหารหรือยาลดกรด ปรับครั้งละ 50-100 มก. ห่างกันอย่างน้อย 2-3 วัน ส่วนใหญ่ 200-300 มก. ทุก 8 ชม. ลอง 400 มก. ทุก 8 ชม. ได้ สูงสุด 1200 มก./วัน ถ้าคุมได้ที่ 300 มก. หรือน้อยกว่าทุก 8 ชม. แบ่งให้ทุก 12 ชม. ได้ (สูงสุด 450 มก. ทุก 12 ชม.)"},pharmacokinetics:{onset:"30 min to 2 h after a loading dose",peak:"2-3 h",halfLife:"About 10-12 h in normal subjects; prolonged in hepatic impairment",metabolism:"Hepatic, mainly CYP2D6 (also CYP1A2); about 90% to inactive metabolites; low first-pass",excretion:"Limited renal elimination"},renalAdjustment:{crcl50:"Usual dose",crcl30_50:"Usual dose (renal failure generally needs the usual dose)",crcl10_30:"Usual dose (renal failure generally needs the usual dose)",crclLess10:"Usual dose (renal failure generally needs the usual dose)",hd:"Unknown"},renalAdjust:!1,hepaticAdjustment:"Severe liver disease (or marked right-sided heart failure) may need lower doses with close monitoring.",cautionsAndWarnings:["BOXED WARNING (CAST): reserve for life-threatening ventricular arrhythmias.","BOXED WARNING: abnormal liver tests after starting, mostly with heart failure or ischemia; rare severe liver injury including necrosis.","Caution in hypotension and severe heart failure.","Caution in known seizure disorder; convulsions reported (about 2 in 1000).","DRESS reported: stop if suspected.","Blood dyscrasias: marked leukopenia or agranulocytosis in a small number of patients."],contraindications:["Cardiogenic shock","Pre-existing second- or third-degree AV block without a pacemaker"],adverseEffects:["Upper GI distress (41%)","Tremor (12.6%)","Lightheadedness (10.5%)","Coordination difficulty (10.2%)","Reactions led to stopping therapy in 40% in controlled trials"],monitoring:["Clinical and ECG response (Holter if needed) when titrating","Liver function if abnormal tests or symptoms","Theophylline levels if co-prescribed","Plasma levels with enzyme inducers"],interactions:["CYP1A2 inhibitors (fluvoxamine): clearance down 38%","Propafenone: clearance down about 70% in extensive CYP2D6 metabolizers; titrate slowly","Phenytoin, rifampin, phenobarbital: lower mexiletine levels","Theophylline: levels rise; monitor"],safeInHfref:!1,safeCad:!1,qtRisk:"None",nlem:{list:null},refs:{mech:["lbl:mexiletine-cap#Clinical Pharmacology"],dose:["lbl:mexiletine-cap#Dosage and Administration"],pk:["lbl:mexiletine-cap#Clinical Pharmacology"],renal:["lbl:mexiletine-cap#Dosage and Administration, Clinical Pharmacology"],hepatic:["lbl:mexiletine-cap#Dosage and Administration, Precautions"],warn:["lbl:mexiletine-cap#Boxed Warning, Precautions"],contra:["lbl:mexiletine-cap#Contraindications"],adverse:["lbl:mexiletine-cap#Adverse Reactions"],monitor:["lbl:mexiletine-cap#Dosage and Administration, Precautions"],interact:["lbl:mexiletine-cap#Precautions: Drug Interactions"],flags:["lbl:mexiletine-cap#Boxed Warning (CAST), Precautions (severe heart failure)"],nlem:["nlem2569"]}},{id:"phenytoin",genericName:"Phenytoin",brandNames:[],vwClass:"Ib",classFullName:"Class Ib - Sodium Channel Blocker (antiepileptic; no antiarrhythmic indication in the label)",color:"yellow",primaryTarget:"Unknown (the injection label covers seizures only)",actionPotential:{phase0:"Unknown",apd:"Unknown",erp:"Unknown"},ecgEffects:{pr:"Unknown",qrs:"Unknown",qtc:"Unknown",hr:"Bradycardia and heart block reported with IV use"},indications:["vt_vf"],routes:["IV"],acuteDose:{en:"Antiarrhythmic dose: Unknown (no source checked gives one; the US injection label has no arrhythmia indication). Label limit for any IV use: no faster than 50 mg/min in adults (severe hypotension and arrhythmias with faster infusion).",th:"ขนาดยาสำหรับรักษาหัวใจเต้นผิดจังหวะ: ไม่ทราบ (แหล่งอ้างอิงที่ตรวจไม่ระบุ ฉลากยาฉีดของสหรัฐฯ ไม่มีข้อบ่งใช้ด้านหัวใจ) ข้อจำกัดของฉลากสำหรับการให้ IV ทุกกรณี: ไม่เร็วกว่า 50 มก./นาที ในผู้ใหญ่ (ให้เร็วกว่านี้ทำให้ความดันต่ำรุนแรงและหัวใจเต้นผิดจังหวะ)"},maintenanceDose:{en:"Unknown for arrhythmia (label covers seizures only).",th:"ไม่ทราบสำหรับหัวใจเต้นผิดจังหวะ (ฉลากยาครอบคลุมเฉพาะอาการชัก)"},pharmacokinetics:{onset:"Unknown",peak:"Unknown",halfLife:"10-15 h after IV dosing",metabolism:"Hepatic, mainly CYP2C9, less CYP2C19; CYP2C9*3 carriers clear it more slowly",excretion:"Unknown"},renalAdjustment:{crcl50:"Unknown",crcl30_50:"Unknown (label: unbound fraction rises in renal disease; monitor unbound levels)",crcl10_30:"Unknown (label: unbound fraction rises in renal disease; monitor unbound levels)",crclLess10:"Unknown (label: unbound fraction rises in renal disease; monitor unbound levels)",hd:"Unknown"},renalAdjust:null,hepaticAdjustment:"Unknown dose rule (label: unbound fraction rises in hepatic disease; monitor unbound levels; contraindicated after prior phenytoin hepatotoxicity).",cautionsAndWarnings:["BOXED WARNING: IV rate must not exceed 50 mg/min in adults; faster infusion risks severe hypotension and cardiac arrhythmias. Monitor the heart carefully during and after IV infusion.","Cardiac arrhythmias (bradycardia, heart block, VT, VF, asystole) have occurred, including at recommended doses and rates.","Local toxicity, including purple glove syndrome, after peripheral IV injection.","Serious skin reactions; higher risk with HLA-B*1502 or CYP2C9*3."],contraindications:["Hypersensitivity to phenytoin or other hydantoins","Sinus bradycardia, sino-atrial block, second- or third-degree AV block, Adams-Stokes syndrome","Prior acute hepatotoxicity from phenytoin","Coadministration with delavirdine"],adverseEffects:["Hypotension and arrhythmias with IV use","Purple glove syndrome","Serious skin reactions"],monitoring:["Cardiac and respiratory monitoring during and after IV infusion","Serum levels (unbound levels in renal or hepatic disease or low albumin)"],interactions:["Unknown for the antiarrhythmic setting; phenytoin is a CYP2C9/CYP2C19 substrate (see full label)"],safeInHfref:null,safeCad:null,qtRisk:"None",nlem:{list:"b",old:"ก",items:[{form:"Phenytoin sodium sterile sol (listed under 4.8 Antiepileptics)",cond:"-"}]},refs:{mech:["lbl:phenytoin-inj#Indications"],dose:["lbl:phenytoin-inj#Boxed Warning, Indications"],pk:["lbl:phenytoin-inj#Clinical Pharmacology"],renal:["lbl:phenytoin-inj#Clinical Pharmacology, Dosage and Administration"],hepatic:["lbl:phenytoin-inj#Contraindications, Clinical Pharmacology"],warn:["lbl:phenytoin-inj#Boxed Warning, Warnings and Precautions"],contra:["lbl:phenytoin-inj#Contraindications"],adverse:["lbl:phenytoin-inj#Warnings and Precautions"],monitor:["lbl:phenytoin-inj#Warnings and Precautions, Dosage and Administration"],interact:["lbl:phenytoin-inj#Clinical Pharmacology: Drug Interaction Studies"],flags:[],nlem:["nlem2569"]}}],DRUGS_PART_2=[{id:"flecainide",genericName:"Flecainide",brandNames:[],vwClass:"Ic",classFullName:"Class Ic - Sodium Channel Blocker",color:"rose",primaryTarget:"Class 1C sodium channel block (ACC/AHA 2023: inhibits INa); negative inotropic effect",actionPotential:{phase0:"Unknown",apd:"Unknown",erp:"Unknown"},ecgEffects:{pr:"Prolonged, about 25% on average (one-third develop first-degree AV block)",qrs:"Widened, about 25% on average (up to 150%)",qtc:"About 8% longer, mostly from QRS widening (JT about 4%)",hr:"Sinus bradycardia, pause or arrest possible in sick sinus syndrome"},indications:["af_rhythm","svt","vt_vf"],routes:["PO"],acuteDose:{en:"ACC/AHA 2023 (single-dose conversion of AF, including pill-in-the-pocket): 200 mg if under 70 kg, 300 mg if over 70 kg; conversion in 3-8 h. A beta-blocker or non-dihydropyridine CCB is generally given at least 30 min before, to prevent 1:1 AV conduction in atrial flutter. Not for patients with structural heart disease (label indication: patients without structural heart disease).",th:"ACC/AHA 2023 (ให้ครั้งเดียวเพื่อแปลง AF รวมถึง pill-in-the-pocket): 200 มก. ถ้าน้ำหนักน้อยกว่า 70 กก. หรือ 300 มก. ถ้ามากกว่า 70 กก. กลับจังหวะใน 3-8 ชม. มักให้ beta-blocker หรือ non-DHP CCB อย่างน้อย 30 นาทีก่อน เพื่อป้องกัน 1:1 AV conduction ใน atrial flutter ห้ามใช้ในผู้ป่วยโรคหัวใจเชิงโครงสร้าง (ข้อบ่งใช้ตามฉลาก: ผู้ป่วยที่ไม่มีโรคหัวใจเชิงโครงสร้าง)"},maintenanceDose:{en:"PSVT or paroxysmal AF/flutter: start 50 mg every 12 h; increase by 50 mg twice daily no more often than every 4 days; max 300 mg/day. Sustained VT (start in hospital): 100 mg every 12 h, increase by 50 mg twice daily every 4 days; most need no more than 150 mg every 12 h; max 400 mg/day. No loading dose. Amiodarone co-therapy: halve the flecainide dose.",th:"PSVT หรือ paroxysmal AF/flutter: เริ่ม 50 มก. ทุก 12 ชม. เพิ่มครั้งละ 50 มก. วันละ 2 ครั้ง ห่างกันอย่างน้อย 4 วัน สูงสุด 300 มก./วัน. Sustained VT (เริ่มในโรงพยาบาล): 100 มก. ทุก 12 ชม. เพิ่มครั้งละ 50 มก. วันละ 2 ครั้ง ทุก 4 วัน ส่วนใหญ่ไม่เกิน 150 มก. ทุก 12 ชม. สูงสุด 400 มก./วัน ไม่ให้ขนาดนำ. ใช้ร่วมกับ amiodarone: ลดขนาด flecainide ลงครึ่งหนึ่ง"},pharmacokinetics:{onset:"Conversion in 3-8 h after a single oral dose (ACC/AHA 2023)",peak:"Unknown",halfLife:"12-27 h in patients; steady state after 3-5 days; longer in renal or hepatic impairment",metabolism:"Extensive hepatic metabolism; CYP2D6 substrate",excretion:"About 30% (10-50%) unchanged in urine. Hemodialysis removes only about 1%."},renalAdjustment:{crcl50:"Less severe renal disease: start 100 mg every 12 h; plasma levels may help",crcl30_50:"CrCl over 35: start 100 mg every 12 h. CrCl 35 or less (per 1.73 m2): start 100 mg once daily or 50 mg twice daily with frequent plasma levels",crcl10_30:"Start 100 mg once daily or 50 mg twice daily; frequent plasma level monitoring; increase very cautiously after levels plateau (over 4 days)",crclLess10:"Start 100 mg once daily or 50 mg twice daily; frequent plasma level monitoring",hd:"Hemodialysis is not effective (removes about 1%)"},renalAdjust:!0,hepaticAdjustment:"Significant hepatic impairment: do not use unless benefit clearly outweighs risk (elimination markedly slower); monitor plasma levels.",cautionsAndWarnings:["BOXED WARNING (CAST): excess mortality after myocardial infarction (5.1% vs 2.3% death or cardiac arrest); do not use after recent MI; Class 1C risks generally unacceptable without life-threatening ventricular arrhythmias.","BOXED WARNING: not recommended in chronic atrial fibrillation; ventricular proarrhythmia (VT, VF, death) reported in AF/flutter.","1:1 AV conduction in atrial flutter as the atrial rate slows; negative chronotropic co-therapy (digoxin, beta-blocker) may lower the risk.","Negative inotropy: may cause or worsen heart failure, especially with cardiomyopathy, NYHA III-IV, or EF under 30%.","Raises endocardial pacing thresholds: check before, after 1 week and regularly.","Extreme caution in sick sinus syndrome.","Proarrhythmia: 80% of events in sustained-VT patients occurred within 14 days."],contraindications:["Pre-existing second- or third-degree AV block, or right bundle branch block with left hemiblock, unless paced","Cardiogenic shock","Known hypersensitivity"],adverseEffects:["New or worsened arrhythmias (1% in PSVT, 7% in paroxysmal AF)","New or worsened heart failure (0.4% in supraventricular arrhythmias; 9.1% in sustained VT)","ACC/AHA 2023 list: atrial flutter, AV block, dizziness, dyspnea, headache, nausea, visual disturbances, VT"],monitoring:["ECG: PR, QRS, QT","Plasma trough levels (0.2-1 mcg/mL suggested for maximal effect); strongly advised with amiodarone, and in heart failure or renal disease","Pacing thresholds in paced patients"],interactions:["Amiodarone: flecainide levels may double; reduce flecainide dose by 50%","Digoxin: digoxin levels up 13-19%","Cimetidine: flecainide levels up about 30%","CYP2D6 inhibitors (e.g. quinidine; ACC/AHA 2023: duloxetine, fluoxetine, paroxetine): may raise levels","Enzyme inducers (phenytoin, phenobarbital, carbamazepine): elimination up about 30%","Propranolol: PR effects less than additive"],safeInHfref:!1,safeCad:!1,qtRisk:"Warning",nlem:{list:"ex",old:"ง",items:[{form:"Flecainide acetate tab",cond:"ใช้กับผู้ป่วยที่ใช้ยาอื่นควบคุมจังหวะการเต้นผิดปกติของหัวใจไม่ได้หรือไม่ได้ผล"}]},refs:{mech:["lbl:flecainide-tab#Warnings (conduction, heart failure)","acc23-af#Table 23"],dose:["acc23-af#Table 22 and text (pill-in-the-pocket)","lbl:flecainide-tab#Indications, Dosage and Administration"],pk:["lbl:flecainide-tab#Dosage and Administration, Clinical Pharmacology, Overdosage","acc23-af#Table 22"],renal:["lbl:flecainide-tab#Dosage and Administration, Overdosage"],hepatic:["lbl:flecainide-tab#Precautions"],warn:["lbl:flecainide-tab#Boxed Warnings, Warnings"],contra:["lbl:flecainide-tab#Contraindications"],adverse:["lbl:flecainide-tab#Adverse Reactions","acc23-af#Table 22"],monitor:["lbl:flecainide-tab#Dosage and Administration: Plasma Level Monitoring, Warnings"],interact:["lbl:flecainide-tab#Precautions: Drug Interactions","acc23-af#Table 23"],flags:["lbl:flecainide-tab#Boxed Warnings (CAST), Warnings (heart failure)","acc23-af#text (CAST)"],nlem:["nlem2569"]}},{id:"propafenone",genericName:"Propafenone",brandNames:[],vwClass:"Ic",classFullName:"Class Ic - Sodium Channel Blocker with Weak Beta-Blocking Activity",color:"rose",primaryTarget:"Reduces the fast inward sodium current (Purkinje > myocardial fibers); beta-blocking potency about 1/40 of propranolol",actionPotential:{phase0:"Fast sodium current reduced",apd:"Unknown",erp:"Prolonged"},ecgEffects:{pr:"Prolonged (dose-related first-degree AV block)",qrs:"Widened (intraventricular conduction delay)",qtc:"May prolong",hr:"Bradycardia possible"},indications:["af_rhythm","svt","vt_vf"],routes:["PO"],acuteDose:{en:"ACC/AHA 2023 (single-dose conversion of AF, including pill-in-the-pocket): 450 mg if under 70 kg, 600 mg if over 70 kg; conversion in 3-8 h. A beta-blocker or non-dihydropyridine CCB is generally given at least 30 min before. Only without structural heart disease. IV propafenone: Unknown (no source checked).",th:"ACC/AHA 2023 (ให้ครั้งเดียวเพื่อแปลง AF รวมถึง pill-in-the-pocket): 450 มก. ถ้าน้ำหนักน้อยกว่า 70 กก. หรือ 600 มก. ถ้ามากกว่า 70 กก. กลับจังหวะใน 3-8 ชม. มักให้ beta-blocker หรือ non-DHP CCB อย่างน้อย 30 นาทีก่อน ใช้เฉพาะผู้ที่ไม่มีโรคหัวใจเชิงโครงสร้าง. Propafenone ฉีด: ไม่ทราบ (ไม่มีในแหล่งที่ตรวจ)"},maintenanceDose:{en:"Immediate-release: 150 mg every 8 h; after at least 3-4 days may increase to 225 mg every 8 h, then 300 mg every 8 h (900 mg/day; higher not established). Extended-release: 225 mg every 12 h; after at least 5 days 325 mg, then 425 mg every 12 h. Increase more gradually in the elderly or with marked myocardial damage.",th:"ชนิดออกฤทธิ์ทันที: 150 มก. ทุก 8 ชม. หลังอย่างน้อย 3-4 วัน เพิ่มเป็น 225 มก. ทุก 8 ชม. และ 300 มก. ทุก 8 ชม. ได้ (900 มก./วัน ขนาดที่สูงกว่านี้ยังไม่มีข้อมูล). ชนิดออกฤทธิ์นาน: 225 มก. ทุก 12 ชม. หลังอย่างน้อย 5 วัน เพิ่มเป็น 325 มก. และ 425 มก. ทุก 12 ชม. ผู้สูงอายุหรือกล้ามเนื้อหัวใจเสียหายมากให้เพิ่มช้ากว่านี้"},pharmacokinetics:{onset:"Conversion in 3-8 h after a single oral dose (ACC/AHA 2023)",peak:"About 3.5 h (immediate-release)",halfLife:"2-10 h in extensive metabolizers (over 90% of patients); 10-32 h in poor CYP2D6 metabolizers; about 9 h in moderate-severe liver disease",metabolism:"Saturable first-pass metabolism, CYP2D6, CYP3A4, CYP1A2; bioavailability 3-40% normally, about 70% in severe liver dysfunction",excretion:"About 50% of metabolites in urine"},renalAdjustment:{crcl50:"Unknown (no CrCl dose rule in label)",crcl30_50:"Unknown (label: monitor for signs of overdose in renal impairment)",crcl10_30:"Unknown (label: monitor for signs of overdose in renal impairment)",crclLess10:"Unknown (label: monitor for signs of overdose in renal impairment)",hd:"Unknown"},renalAdjust:null,hepaticAdjustment:"Consider reducing the dose (bioavailability rises to about 70% in severe liver dysfunction; clearance falls).",cautionsAndWarnings:["BOXED WARNING (CAST): consider any Class IC drug to carry significant proarrhythmic risk in structural heart disease; avoid in non-life-threatening ventricular arrhythmias.","Proarrhythmia: sudden death, VF, VT, asystole, torsades; may worsen PVCs or SVT and prolong QT. ECG before and during therapy.","May unmask Brugada syndrome: ECG after starting; stop if suggestive.","Atrial flutter: 1:1 conduction reported; give with a drug that lengthens AV-node refractoriness. Do not use for rate control in AF.","May provoke overt heart failure; conduction disturbances (first-degree AV block, intraventricular delay).","Agranulocytosis, usually in the first 2 months.","Avoid with both a CYP2D6 inhibitor and a CYP3A4 inhibitor; avoid other QT-prolonging drugs."],contraindications:["Heart failure","Cardiogenic shock","Sinoatrial, AV or intraventricular conduction disorders (e.g. sick sinus syndrome, AV block) without a pacemaker","Known Brugada syndrome","Bradycardia","Marked hypotension","Bronchospastic disorders or severe obstructive pulmonary disease","Marked electrolyte imbalance"],adverseEffects:["Most common (over 5%): unusual taste, nausea/vomiting, dizziness, constipation, headache, fatigue, first-degree AV block, intraventricular conduction delay","About 20% stopped treatment for adverse reactions"],monitoring:["ECG before and during therapy (QRS, PR, Brugada pattern)","Digoxin levels if co-prescribed","INR if on warfarin","Signs of overdose in renal impairment"],interactions:["CYP2D6 inhibitors (desipramine, paroxetine, sertraline, quinidine) and CYP3A4 inhibitors (ketoconazole, erythromycin, ritonavir, grapefruit): higher levels; avoid both together","Amiodarone: not recommended together","Digoxin: digoxin AUC up 60-270%; monitor and adjust","Warfarin: warfarin levels up 39%; monitor INR","Cimetidine: propafenone up 20%","Lidocaine: more CNS side effects","Orlistat: lower propafenone exposure"],safeInHfref:!1,safeCad:!1,qtRisk:"Warning",nlem:{list:"ex",old:"ง",items:[{form:"Propafenone HCl tab",cond:"ใช้กับผู้ป่วยที่ใช้ยาอื่นควบคุมจังหวะการเต้นผิดปกติของหัวใจไม่ได้หรือไม่ได้ผล"}]},refs:{mech:["lbl:propafenone-ir#Clinical Pharmacology, Warnings and Precautions"],dose:["acc23-af#Table 22 and text (pill-in-the-pocket)","lbl:propafenone-ir#Dosage and Administration","lbl:propafenone-er#Dosage and Administration"],pk:["lbl:propafenone-ir#Clinical Pharmacology","acc23-af#Table 22"],renal:["lbl:propafenone-ir#Use in Specific Populations"],hepatic:["lbl:propafenone-ir#Dosage and Administration, Clinical Pharmacology"],warn:["lbl:propafenone-ir#Boxed Warning, Indications, Warnings and Precautions"],contra:["lbl:propafenone-ir#Contraindications"],adverse:["lbl:propafenone-ir#Adverse Reactions"],monitor:["lbl:propafenone-ir#Warnings and Precautions, Drug Interactions"],interact:["lbl:propafenone-ir#Drug Interactions"],flags:["lbl:propafenone-ir#Boxed Warning, Contraindications (heart failure)"],nlem:["nlem2569"]}},{id:"esmolol",genericName:"Esmolol",brandNames:["Brevibloc"],vwClass:"II",classFullName:"Class II - Short-Acting Beta-1 Selective Blocker",color:"indigo",primaryTarget:"Beta-1 selective adrenergic blocker; rapid onset, very short action; no significant intrinsic sympathomimetic or membrane-stabilizing activity",actionPotential:{phase0:"Unknown",apd:"Unknown",erp:"Unknown"},ecgEffects:{pr:"AH interval prolonged",qrs:"Unknown",qtc:"Unknown",hr:"Decreased; sinus node recovery time prolonged"},indications:["af_rate","svt"],routes:["IV"],acuteDose:{en:"SVT, AF/flutter rate control, or noncompensatory sinus tachycardia: optional load 500 mcg/kg over 1 min, then 50 mcg/kg/min for 4 min; repeat the load if needed and step up to 100, 150, then 200 mcg/kg/min (each for 4 min). Titrate at intervals of 4 min or more. Doses above 200 mcg/kg/min add little rate lowering and more adverse effects (up to 300 is for hypertension). Without a load, steady state takes about 30 min.",th:"SVT ควบคุมอัตราเต้นใน AF/flutter หรือ sinus tachycardia ที่ไม่ใช่การชดเชย: ขนาดนำ (ไม่บังคับ) 500 มคก./กก. ใน 1 นาที แล้ว 50 มคก./กก./นาที นาน 4 นาที ให้ขนาดนำซ้ำได้ และเพิ่มเป็น 100, 150 และ 200 มคก./กก./นาที (ขั้นละ 4 นาที) ปรับทุก 4 นาทีขึ้นไป ขนาดเกิน 200 มคก./กก./นาที ลดอัตราเต้นได้น้อยแต่ผลข้างเคียงมากขึ้น (สูงถึง 300 ใช้สำหรับความดันสูง) ถ้าไม่ให้ขนาดนำ ถึงระดับคงที่ในประมาณ 30 นาที"},maintenanceDose:{en:"Maintenance infusion 50-200 mcg/kg/min (as low as 25 may suffice), for up to 48 h. Short-term use only; switch to an oral agent for longer control.",th:"หยดต่อเนื่อง 50-200 มคก./กก./นาที (ต่ำถึง 25 อาจพอ) นานได้ถึง 48 ชม. ใช้ระยะสั้นเท่านั้น หากต้องคุมนานให้เปลี่ยนเป็นยารับประทาน"},pharmacokinetics:{onset:"Rapid",peak:"Steady state about 30 min without a loading dose",halfLife:"About 9 min; substantial recovery from beta blockade 10-20 min after stopping. Acid metabolite about 3.7 h (about 48 h in ESRD)",metabolism:"Red blood cell esterases to an acid metabolite with negligible activity",excretion:"Acid metabolite 73-88% of the dose in urine within 24 h"},renalAdjustment:{crcl50:"No adjustment",crcl30_50:"No adjustment",crcl10_30:"No adjustment (label: for a maintenance infusion of 150 mcg/kg/min for 4 h)",crclLess10:"No adjustment for 150 mcg/kg/min over 4 h; acid metabolite half-life about 48 h in ESRD",hd:"Unknown (IV beta-blockers may cause life-threatening hyperkalemia in hemodialysis patients)"},renalAdjust:!1,hepaticAdjustment:"No special precautions (metabolized by red blood cell esterases).",cautionsAndWarnings:["Hypotension is the most important and common adverse effect.","May depress contractility and precipitate heart failure or cardiogenic shock.","Bradycardia, sinus pause, heart block, cardiac arrest.","Bronchospasm: stop the infusion; a beta-2 agonist may be given.","Infusion site reactions including thrombophlebitis, necrosis and blistering, especially with extravasation.","Abrupt stop in coronary disease: angina, MI or ventricular arrhythmias.","Hyperkalemia (renal impairment, hemodialysis); hyperkalemic renal tubular acidosis."],contraindications:["Severe sinus bradycardia","Heart block greater than first degree","Sick sinus syndrome","Decompensated heart failure","Cardiogenic shock","IV cardiodepressant calcium-channel blockers (e.g. verapamil) given close in time (fatal cardiac arrests reported)","Pulmonary hypertension","Hypersensitivity to esmolol"],adverseEffects:["Symptomatic and asymptomatic hypotension (over 10%)","Dizziness, sweating","Infusion site reactions"],monitoring:["Ventricular rate and blood pressure; titrate at 4-min intervals or longer","Infusion site","Potassium in renal impairment"],interactions:["Digoxin: digoxin levels up about 10-20%; additive bradycardia","IV verapamil or other cardiodepressant CCBs: contraindicated in close proximity","Clonidine, guanfacine, moxonidine: withdrawal rebound hypertension","Succi : metoprolol tartrate 2.5-5 mg IV over 2 min, up to 3 doses. Avoid in decompensated heart failure. (No current US IV label was found in this check.)",th:"ควบคุมอัตราเต้นใน AF/flutter (AHA 2025, ACC/AHA 2023): metoprolol tartrate 2.5-5 มก. IV ใน 2 นาที ได้ถึง 3 ครั้ง หลีกเลี่ยงในหัวใจล้มเหลวที่ไม่คงที่ (การตรวจนี้ไม่พบฉลากยาฉีดของสหรัฐฯ ที่ใช้อยู่ปัจจุบัน)"},maintenanceDose:{en:"AF rate control (ACC/AHA 2023): tartrate 25-200 mg twice daily; succinate 50-400 mg once daily or divided twice daily. Toprol-XL label: titrate at weekly or longer intervals; heart failure start 12.5-25 mg once daily; same total daily dose when switching from immediate-release. Lopressor label (post-MI): 50 mg every 6 h, max 100 mg twice daily, with or after meals.",th:"ควบคุมอัตราเต้นใน AF (ACC/AHA 2023): tartrate 25-200 มก. วันละ 2 ครั้ง; succinate 50-400 มก. วันละครั้งหรือแบ่ง 2 ครั้ง. ฉลาก Toprol-XL: ปรับขนาดทุก 1 สัปดาห์ขึ้นไป หัวใจล้มเหลวเริ่ม 12.5-25 มก. วันละครั้ง เปลี่ยนจากชนิดออกฤทธิ์ทันทีใช้ขนาดรวมต่อวันเท่าเดิม. ฉลาก Lopressor (หลัง MI): 50 มก. ทุก 6 ชม. สูงสุด 100 มก. วันละ 2 ครั้ง พร้อมหรือหลังอาหาร"},pharmacokinetics:{onset:"Unknown",peak:"Unknown",halfLife:"About 3-7 h",metabolism:"Hepatic, mainly CYP2D6 (absent in about 8% of Caucasians and 2% of most other populations)",excretion:"Under 5% unchanged in urine; inactive metabolites renally"},renalAdjustment:{crcl50:"No reduction needed",crcl30_50:"No reduction needed",crcl10_30:"No reduction needed",crclLess10:"No reduction needed (renal failure)",hd:"Unknown"},renalAdjust:!1,hepaticAdjustment:"Start at low doses and increase gradually with close monitoring.",cautionsAndWarnings:["Abrupt stop may worsen ischemia (angina, MI).","Heart failure may worsen during up-titration.","Bronchospastic disease: generally avoid; if used, keep a beta-2 agonist available.","May mask hypoglycemia; abrupt withdrawal in thyrotoxicosis may precipitate thyroid storm.","Pheochromocytoma: start an alpha-blocker first.","Do not start high-dose metoprolol for non-cardiac surgery; do not routinely stop chronic therapy before surgery."],contraindications:["Severe bradycardia","Second- or third-degree heart block","Cardiogenic shock","Decompensated heart failure","Sick sinus syndrome without a permanent pacemaker","Systolic BP under 100 mmHg (Lopressor, post-MI use)","Hypersensitivity"],adverseEffects:["Acute MI trial (metoprolol vs placebo): hypotension 27.4% vs 23.2%, bradycardia under 40/min 15.9% vs 6.7%, first-degree AV block 5.3% vs 1.9%"],monitoring:["Heart rate and blood pressure","Signs of worsening heart failure during titration"],interactions:["Strong CYP2D6 inhibitors (quinidine, fluoxetine, paroxetine, propafenone): double metoprolol levels","Digoxin, clonidine, diltiazem, verapamil: more bradycardia","Clonidine withdrawal: rebound hypertension (stop the beta-blocker first)","Catecholamine-depleting drugs (reserpine, MAO inhibitors): additive effect","Epinephrine: reduced response"],safeInHfref:!0,safeCad:!0,qtRisk:"None",nlem:{list:"b",old:"ก",items:[{form:"Metoprolol tartrate immediate-release tab",cond:"-"}]},refs:{mech:["lbl:metoprolol-lopressor#Warnings and Precautions, Drug Interactions"],dose:["aha25-als#Table (AF/AFL rate control)","acc23-af#Table 21","lbl:metoprolol-toprol#Dosage and Administration","lbl:metoprolol-lopressor#Dosage and Administration"],pk:["lbl:metoprolol-toprol#Clinical Pharmacology","lbl:metoprolol-lopressor#Clinical Pharmacology"],renal:["lbl:metoprolol-toprol#Use in Specific Populations","lbl:metoprolol-lopressor#Clinical Pharmacology"],hepatic:["lbl:metoprolol-lopressor#Use in Specific Populations"],warn:["lbl:metoprolol-lopressor#Warnings and Precautions"],contra:["lbl:metoprolol-lopressor#Contraindications","lbl:metoprolol-toprol#Contraindications"],adverse:["lbl:metoprolol-lopressor#Adverse Reactions"],monitor:["lbl:metoprolol-lopressor#Dosage and Administration, Warnings"],interact:["lbl:metoprolol-lopressor#Drug Interactions"],flags:["lbl:metoprolol-toprol#Indication ["Postural hypotension and dizziness, mainly at start and dose increases (alpha-1 blockade); take with food.","Do not stop abruptly (worsening angina, MI, ventricular arrhythmias).","Worsening heart failure or fluid retention during up-titration.","Worsening renal function in heart failure patients with low BP, ischemic disease, vascular disease or renal insufficiency.","May mask hypoglycemia."],contraindications:["Bronchial asthma or related bronchospastic conditions (deaths from status asthmaticus after single doses)","Second- or third-degree AV block","Sick sinus syndrome","Severe bradycardia without a permanent pacemaker","Cardiogenic shock or decompensated heart failure needing IV inotropes","Severe hepatic impairment","Serious hypersensitivity (e.g. Stevens-Johnson syndrome, anaphylaxis)"],adverseEffects:["Mild-moderate heart failure trials (carvedilol vs placebo): dizziness 32% vs 19%, fatigue 24% vs 22%, hyperglycemia 12% vs 8%, diarrhea 12% vs 6%, bradycardia 9% vs 1%, hypotension 9% vs 3%"],monitoring:["Heart rate and standing/sitting blood pressure during titration","Weight and fluid status in heart failure","Renal function during titration in at-risk patients"],interactions:["Digoxin: levels up about 15%; more bradycardia","CYP2D6 inhibitors: may raise carvedilol levels","Clonidine: hypotension and bradycardia","Non-dihydropyridine CCBs: conduction effects"],safeInHfref:!0,safeCad:!0,qtRisk:"None",nlem:{list:"s",old:"ค",items:[{form:"Carvedilol tab",cond:"ใช้สำหรับ heart failure with reduced ejection fraction"}]},refs:{mech:["lbl:carvedilol-coreg#Indications, Clinical Pharmacology"],dose:["acc23-af#Table 21","lbl:carvedilol-coreg#Dosage and Administration"],pk:["lbl:carvedilol-coreg#Clinical Pharmacology","acc23-af#Table 21"],renal:["lbl:carvedilol-coreg#Clinical Pharmacology, Warnings and Precautions"],hepatic:["lbl:carvedilol-coreg#Contraindications, Clinical Pharmacology"],warn:["lbl:carvedilol-coreg#Warnings and Precautions"],contra:["lbl:carvedilol-
