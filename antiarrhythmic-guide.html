lement("path",{d:"m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"}),React.createElement("path",{d:"M5 3v4M3 5h4M19 3v4M17 5h4"})),HistoryIcon=({className:e})=>React.createElement("svg",{xmlns:"http://www.w3.org/2000/svg",viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round",className:e},React.createElement("path",{d:"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"}),React.createElement("path",{d:"M3 3v5h5"}),React.createElement("path",{d:"M12 7v5l4 2"})),changelogData=[{version:"v1.2.8",date:"November 9, 2026",dateTh:"9 พฤศจิกายน 2569",features:["The Countries group now also has US, UK, EU and JP buttons beside TH and Others, so availability can be filtered country by country (every selected button must hold; Others = any of the four).","Country availability like the bronchodilator guide: each card shows TH, US, UK, EU and JP chips (current, past †, not found ⊘). The Filters box has a Countries group with TH and Others (US, UK, EU or Japan), an FDA status group (Currently, Past, Not found) beside it, and NLEM only next to that; the old three-way NLEM menu is replaced. The Overview tab lists the status per country with its basis. Sources: Thai FDA register, DailyMed, emc, AEMPS CIMA (Spain as the EU proxy) and KEGG MEDICUS (JAPIC), checked 9 Nov 2026.","Every drug now has a dosage-form icon (oral, injection, or both) tinted by its class; tile cards have a class colour edge, a bigger name, one merged brand line, and show the first MIMS dose line with the rest on tap. On phones the list view is a compact row list with no sideways scroll.","Tile cards now show the adult dose from MIMS Thailand, one line for each indication or route, in full (the same rows as the Dosing tab).","The sort order, grid or list view and folded class groups are now remembered in this browser, like Group by class.","Third guideline block in the Dosing tab: the 2019 ESC supraventricular tachycardia guideline for the 13 drugs it names (recommendation class and level, the doses it gives); the other 14 show N/A. Added to the references.","Print Ward Sheet now shows the first Thai brands and a Doses by source column (the first MIMS and ESC entry of each drug).","Action potential: the 5 Class III drugs and 6 of the 7 Other drugs now show their own mechanism by phase, from the ACC/AHA 2023 table, the FDA label or AHA/ACC/HRS 2017, in the pop-up and on the cards. Vernakalant has no mechanism in the sources read, so it shows N/A.","Second guideline block in the Dosing tab: what the 2022 ESC ventricular arrhythmia guideline says about 18 drugs (doses, contraindications, recommendations); the other 9 show N/A. Added to the references.","New block in the Dosing tab with what the 2024 ESC atrial fibrillation guideline says about each drug it covers (rhythm control and rate control doses, cautions, recommendation class); other drugs show N/A. ESC added to the references.","Thai brand names from MIMS Thailand are on the cards and searchable (full list in the Dosing tab); drugs MIMS lists no Thai brand for show none.","References are grouped under headings: guidelines, drug labels, MIMS Thailand, Thai NLEM and journal articles.","The class buttons moved into the Filters box, with Group by class (and Collapse all) beside them.","Controls row now matches the bronchodilator guide: on phones the search is an icon that opens the search box, the sort menu (with its icon) stays in the row, the view buttons show the active mode name, and the Filters button has a funnel icon with the filter count.","Class chips are multi-select: tap several classes to show them together; All clears the selection.","Action Potential pop-up and drug cards now show the mechanism in each phase (0, 2, 3, 4) taken from the drug's class, marked as class-level; anything the drug's own label states is shown separately with its source. The class curve is drawn right in the drug card (the View Curve button is gone). The curve has a light background in light mode. The group Other has no shared mechanism, so it shows N/A."],featuresTh:["กลุ่มประเทศมีปุ่ม US, UK, EU และ JP เพิ่มข้าง TH และ อื่น ๆ กรองการวางจำหน่ายรายประเทศได้ (ต้องเป็นจริงทุกปุ่มที่เลือก ส่วน อื่น ๆ = ประเทศใดประเทศหนึ่งในสี่ประเทศ)","แสดงการวางจำหน่ายตามประเทศเหมือนแอป bronchodilator: การ์ดยามีป้าย TH, US, UK, EU และ JP (ปัจจุบัน เคยมี † ไม่พบ ⊘) กล่องตัวกรองมีกลุ่มประเทศ TH และ อื่น ๆ (สหรัฐฯ สหราชอาณาจักร สหภาพยุโรป หรือญี่ปุ่น) กลุ่มสถานะ อย. (ปัจจุบัน เคยมี ไม่พบ) ถัดไป และ เฉพาะบัญชียาหลัก ต่อจากนั้น แทนเมนู NLEM สามตัวเลือกเดิม แท็บภาพรวมแสดงสถานะรายประเทศพร้อมที่มา แหล่งข้อมูล: ทะเบียนยา อย. DailyMed emc AEMPS CIMA (ใช้สเปนแทนสหภาพยุโรป) และ KEGG MEDICUS (JAPIC) ตรวจเมื่อ 9 พ.ย. 2569","ยาทุกตัวมีไอคอนรูปแบบยา (รับประทาน ฉีด หรือทั้งสอง) ใช้สีตามกลุ่มยา การ์ด tile มีแถบสีกลุ่มยาด้านซ้าย ชื่อยาใหญ่ขึ้น บรรทัดชื่อการค้ารวมกัน และแสดงขนาดยาบรรทัดแรกของ MIMS ส่วนที่เหลือแตะเพื่อดู บนมือถือมุมมองรายการเป็นแถวกะทัดรัดไม่ต้องเลื่อนซ้ายขวา","การ์ดแบบ tile แสดงขนาดยาผู้ใหญ่จาก MIMS Thailand แยกบรรทัดตามข้อบ่งใช้หรือทางให้ยา ครบทั้งข้อความ (เป็นแถวเดียวกับแท็บขนาดยา)","จดจำการเรียงลำดับ มุมมองกริดหรือรายการ และกลุ่มยาที่พับไว้ในเบราว์เซอร์นี้ เช่นเดียวกับปุ่มจัดกลุ่มตามกลุ่มยา","เพิ่มส่วนที่สามในแท็บขนาดยา สรุปแนวทาง ESC 2019 สำหรับ supraventricular tachycardia ของยา 13 ตัวที่แนวทางระบุ (ระดับคำแนะนำ และขนาดยาที่แนวทางให้ไว้) ยาอีก 14 ตัวแสดง N/A และเพิ่มในเอกสารอ้างอิง","ใบสรุปสำหรับพิมพ์ (Print Ward Sheet) แสดงชื่อการค้าในไทยบางส่วนและคอลัมน์ขนาดยาตามแหล่งอ้างอิง (รายการแรกของ MIMS และ ESC ของยาแต่ละตัว)","Action potential: ยา Class III ทั้ง 5 ตัวและยากลุ่ม Other 6 จาก 7 ตัวแสดงกลไกเฉพาะตัวยาแยกตาม phase จากตาราง ACC/AHA 2023 ฉลาก FDA หรือ AHA/ACC/HRS 2017 ทั้งในหน้าต่างรูปคลื่นและการ์ดยา Vernakalant ไม่มีกลไกในแหล่งอ้างอิงที่อ่าน จึงแสดง N/A","เพิ่มส่วนที่สองในแท็บขนาดยา สรุปแนวทาง ESC 2022 สำหรับ ventricular arrhythmia ของยา 18 ตัว (ขนาดยา ข้อห้ามใช้ คำแนะนำ) ยาอีก 9 ตัวแสดง N/A และเพิ่มในเอกสารอ้างอิง","เพิ่มส่วนในแท็บขนาดยาที่สรุปแนวทาง ESC 2024 สำหรับ AF ของยาแต่ละตัวที่แนวทางครอบคลุม (ขนาดยาควบคุมจังหวะและอัตรา ข้อควรระวัง ระดับคำแนะนำ) ยาอื่นแสดง N/A และเพิ่ม ESC ในเอกสารอ้างอิง","เพิ่มชื่อการค้าในไทยจาก MIMS Thailand บนการ์ดยาและค้นหาได้ (รายชื่อเต็มอยู่ในแท็บขนาดยา) ยาที่ MIMS ไม่มีชื่อการค้าในไทยจะไม่แสดง","เอกสารอ้างอิงแบ่งเป็นหมวด: แนวทางเวชปฏิบัติ ฉลากยา MIMS Thailand บัญชียาหลักแห่งชาติ และบทความวารสาร","ย้ายปุ่มกลุ่มยาเข้าไปในกล่องตัวกรอง โดยมีปุ่มจัดกลุ่มตามกลุ่มยา (และยุบทั้งหมด) อยู่ข้างกัน","แถวควบคุมเหมือนแอป bronchodilator: บนมือถือการค้นหาเป็นไอคอนที่กดเพื่อเปิดช่องค้นหา เมนูเรียงลำดับ (พร้อมไอคอน) อยู่ในแถวเดียวกัน ปุ่มมุมมองแสดงชื่อโหมดที่ใช้ และปุ่มตัวกรองมีไอคอนกรวยพร้อมจำนวนตัวกรอง","ปุ่มกลุ่มยาเลือกได้หลายกลุ่ม: แตะหลายกลุ่มเพื่อแสดงพร้อมกัน ปุ่ม All ล้างการเลือก","หน้าต่าง Action Potential และการ์ดยาแสดงกลไกในแต่ละ phase (0, 2, 3, 4) จากกลุ่มยา โดยระบุว่าเป็นข้อมูลระดับกลุ่ม ส่วนที่ฉลากของยานั้นระบุไว้แสดงแยกพร้อมแหล่งอ้างอิง รูปคลื่นของกลุ่มยาแสดงในการ์ดยาโดยตรง (เอาปุ่มดูรูปคลื่นออก) พื้นหลังรูปคลื่นสว่างในโหมดสว่าง กลุ่ม Other ไม่มีกลไกร่วมกัน จึงแสดง N/A"],bugs:[],bugsTh:[]},{version:"v1.2.7",date:"November 3, 2026",dateTh:"3 พฤศจิกายน 2569",features:["New References section at the bottom of the page, like the bronchodilator guide: closed by default, opens to a numbered list of every source with its link and what it was used for.","Class groups fold: tap a class heading to hide or show its drugs (arrow shows the state), and a Collapse all / Expand all button appears next to Group by class.",'Dosing tab now opens with the adult dose recommended by MIMS Thailand for every drug (generic medicine info, "not country-specific"), paraphrased with MIMS as the linked source, laid out as short rows (route and indication in bold, then the dose) instead of one long paragraph. Drugs where MIMS lists no arrhythmia dose (phenytoin, carvedilol, bisoprolol, magnesium, ivabradine, ranolazine) say so and show the dose MIMS does give; vernakalant is not in MIMS Thailand.','New "Group by class" toggle next to the result count: the grid and list put the drugs under class headings (Ia, Ib, Ic, II, III, IV, Other) with a count each, keeping the chosen sort inside each class. The choice is remembered.',"The class filter now lives only in the chip row under the search bar (tap to filter, long-press for the action potential); the duplicate class buttons inside the Filters box are removed.",'Layout now matches the bronchodilator guide: page title with the version, language and theme pills at the top right, a "Made by" line and a disclaimer link, tinted tool tiles pinned with the search row (one row of six short-name tiles on phones), and the same page width. The language pill shows the other language (ไทย / EN).','Class buttons: a tap now only selects the class filter; the action potential pop-up opens on a long press (about half a second). The "AP" tag on the buttons is removed.',"Magnesium for torsades de pointes now shows a dose, from the Tzivoni 1988 case series (12 patients): 2 g IV bolus, a second 2 g after 5-15 min if needed, then 3-20 mg/min for 7-48 h. The guidelines give no dose, so this is labelled as case-series evidence in the drug record, the IV protocols and the torsades pathway."],featuresTh:["เพิ่มส่วนเอกสารอ้างอิงท้ายหน้า เหมือนแอป bronchodilator: ปิดไว้ก่อน เปิดแล้วเห็นรายการแหล่งอ้างอิงทั้งหมดพร้อมลิงก์และสิ่งที่ใช้อ้างอิง","กลุ่มยาพับได้: แตะหัวข้อกลุ่มเพื่อซ่อนหรือแสดงยาในกลุ่ม (ลูกศรบอกสถานะ) และมีปุ่ม ยุบทั้งหมด / ขยายทั้งหมด ข้างปุ่มจัดกลุ่มตามกลุ่มยา",'แท็บขนาดยาเริ่มด้วยขนาดยาผู้ใหญ่ที่ MIMS Thailand แนะนำสำหรับยาทุกตัว (ข้อมูลยากลาง "ไม่เฉพาะประเทศ") สรุปด้วยถ้อยคำของเราและมีลิงก์ MIMS เป็นแหล่งอ้างอิง แบ่งเป็นแถวสั้นๆ (เส้นทางให้ยา/ข้อบ่งใช้เป็นตัวหนา แล้วตามด้วยขนาดยา) แทนย่อหน้ายาว ยาที่ MIMS ไม่มีขนาดสำหรับหัวใจเต้นผิดจังหวะ (phenytoin, carvedilol, bisoprolol, magnesium, ivabradine, ranolazine) ระบุไว้ชัดเจนพร้อมขนาดที่ MIMS ให้ไว้ ส่วน vernakalant ไม่มีใน MIMS Thailand','เพิ่มปุ่ม "จัดกลุ่มตามกลุ่มยา" ข้างจำนวนผลลัพธ์: การ์ดและรายการจัดยาไว้ใต้หัวข้อกลุ่ม (Ia, Ib, Ic, II, III, IV, อื่นๆ) พร้อมจำนวน และคงการเรียงที่เลือกไว้ในแต่ละกลุ่ม ระบบจำค่าที่เลือก',"ตัวกรองกลุ่มยาเหลือเฉพาะแถวปุ่มใต้ช่องค้นหา (แตะเพื่อกรอง กดค้างเพื่อดูกราฟศักย์ไฟฟ้า) เอาปุ่มกลุ่มยาซ้ำในกล่องตัวกรองออกแล้ว",'หน้าตาเหมือนคู่มือยาพ่นขยายหลอดลม: ชื่อหน้า พร้อมปุ่มเวอร์ชัน ภาษา และธีมที่มุมขวาบน บรรทัด "Made by" และลิงก์ข้อจำกัดความรับผิดชอบ ปุ่มเครื่องมือสีอ่อนตรึงไว้กับแถวค้นหา (บนโทรศัพท์เป็นหนึ่งแถว 6 ปุ่มชื่อสั้น) และความกว้างหน้าเท่ากัน ปุ่มภาษาแสดงภาษาอีกฝั่ง (ไทย / EN)','ปุ่มกลุ่มยา: แตะเพื่อเลือกตัวกรองเท่านั้น กดค้าง (ประมาณครึ่งวินาที) เพื่อเปิดกราฟศักย์ไฟฟ้า และเอาป้าย "AP" บนปุ่มออกแล้ว',"Magnesium สำหรับ torsades de pointes แสดงขนาดยาแล้ว จากรายงาน Tzivoni 1988 (12 ราย): 2 ก. IV ครั้งเดียว ให้ 2 ก. ซ้ำหลัง 5-15 นาทีถ้าจำเป็น แล้วหยด 3-20 มก./นาที นาน 7-48 ชม. แนวทางปฏิบัติไม่ระบุขนาด จึงระบุว่าเป็นหลักฐานจากรายงานผู้ป่วยในข้อมูลยา สูตรยาหยด IV และแนวทางการรักษา torsades"],bugs:[],bugsTh:[]},{version:"v1.2.0",date:"October 28, 2026",dateTh:"28 ตุลาคม 2569",features:["Content audit: every drug record was rewritten from its current US FDA label (EU label for vernakalant), the 2025 AHA advanced life support guideline and algorithms, the 2023 ACC/AHA/ACCP/HRS atrial fibrillation guideline and the 2017 AHA/ACC/HRS ventricular arrhythmia guideline. Each section of the detail view now shows its sources with links. Anything no source supports is shown as Unknown.","Thai NLEM updated to บัญชียาหลักแห่งชาติ พ.ศ. 2569 with its new sub-lists (b, s, ex) and the official condition text. Twelve drugs are not in the list (procainamide, quinidine, disopyramide, mexiletine, sotalol, dronedarone, ibutilide, vernakalant, ivabradine, dofetilide, bisoprolol, ranolazine); IV diltiazem is new to the list; only verapamil tablets (no injection) are listed.","Arrhythmia pathways, IV infusion protocols and drug interactions rewritten from the same sources, each step with its source; shock energy now follows AHA 2025 (device setting or maximum; 200 J or more first shock for AF and flutter).","QT filter and sort now use what the label says (boxed warning, warning, or none) instead of an unsourced risk grade. HFrEF and CAD filters keep only drugs the sources do not caution against; unknown is shown as unknown.","Atropine is listed under a new Bradycardia filter. Phenytoin, ivabradine and ranolazine are marked as having no arrhythmia indication in their labels.","Version button in the header opens this changelog.","Light/dark is now one round sun/moon button, as in the other guides.","Phone layout: nothing scrolls sideways any more. The class chips use short labels (Ia, II, Other) so the pinned search bar stays two rows, the tabs of the drug detail view wrap onto extra rows, the header title wraps instead of being cut off, tool button names wrap, and the search hint is shorter."],featuresTh:["ตรวจสอบเนื้อหา: เขียนข้อมูลยาทุกตัวใหม่จากฉลากยา US FDA ฉบับปัจจุบัน (ฉลาก EU สำหรับ vernakalant) แนวทาง AHA 2025 advanced life support และ algorithm แนวทาง ACC/AHA/ACCP/HRS 2023 เรื่อง atrial fibrillation และแนวทาง AHA/ACC/HRS 2017 เรื่อง ventricular arrhythmia ทุกหัวข้อในหน้ารายละเอียดแสดงแหล่งอ้างอิงพร้อมลิงก์ ข้อมูลที่ไม่มีแหล่งอ้างอิงแสดงเป็น ไม่ทราบ (Unknown)","ปรับบัญชียาหลักเป็นบัญชียาหลักแห่งชาติ พ.ศ. 2569 พร้อมบัญชีย่อยใหม่ (b, s, ex) และเงื่อนไขตามประกาศ ยา 12 ตัวไม่อยู่ในบัญชี (procainamide, quinidine, disopyramide, mexiletine, sotalol, dronedarone, ibutilide, vernakalant, ivabradine, dofetilide, bisoprolol, ranolazine) diltiazem ฉีดเพิ่มเข้าบัญชีใหม่ verapamil มีเฉพาะยาเม็ด (ไม่มียาฉีด)","แนวทางการรักษา สูตรยาหยด IV และปฏิกิริยาระหว่างยา เขียนใหม่จากแหล่งเดียวกัน ทุกขั้นระบุแหล่งอ้างอิง พลังงานช็อกตาม AHA 2025 (ตามเครื่องหรือสูงสุด; ช็อกแรก 200 J ขึ้นไปสำหรับ AF และ flutter)","ตัวกรองและการเรียงตาม QT ใช้ข้อความในฉลากยา (boxed warning, คำเตือน หรือไม่มี) แทนระดับความเสี่ยงที่ไม่มีแหล่งอ้างอิง ตัวกรอง HFrEF และ CAD แสดงเฉพาะยาที่แหล่งอ้างอิงไม่ได้เตือน ที่ไม่ทราบแสดงว่าไม่ทราบ","Atropine อยู่ในตัวกรองใหม่ Bradycardia ระบุว่า phenytoin, ivabradine และ ranolazine ไม่มีข้อบ่งใช้ด้านหัวใจเต้นผิดจังหวะในฉลากยา","ปุ่มเวอร์ชันที่หัวหน้าจอเปิดประวัติการอัปเดตนี้","ปุ่มสลับโหมดสว่าง/มืดเป็นปุ่มกลมรูปดวงอาทิตย์/ดวงจันทร์ เหมือนคู่มืออื่น","หน้าจอโทรศัพท์: ไม่ต้องเลื่อนด้านข้างอีก ปุ่มกรอง Class ใช้ชื่อย่อ (Ia, II, Other) ให้แถบค้นหาที่ตรึงไว้สูงเพียงสองแถว แท็บในหน้ารายละเอียดยาขึ้นบรรทัดใหม่ ชื่อแอปที่หัวหน้าจอขึ้นบรรทัดใหม่แทนการถูกตัด ชื่อปุ่มเครื่องมือขึ้นบรรทัดใหม่ และข้อความในช่องค้นหาสั้นลง"],bugs:["Corrected many unsourced or wrong values, for example: esmolol maximum 200 mcg/kg/min for arrhythmias (was 200-300); sotalol kidney intervals now follow the label (CrCl 30-59 every 24 h, 10-29 every 36-48 h); ranolazine contraindication is liver cirrhosis (severe kidney disease was listed); propafenone IV and adenosine 3 mg reduced doses removed (no source); NLEM categories corrected.","Tisdale QT risk score: added the missing item (one QT-prolonging drug, 3 points) so the maximum is 21 as published; the percentages are now labelled as rates of QTc prolongation, not torsades.","Tool windows and the drug detail view now start fresh each time they open; before, they broke React's rule on state order, which could crash the page."],bugsTh:["แก้ค่าที่ผิดหรือไม่มีแหล่งอ้างอิงหลายจุด เช่น esmolol สูงสุด 200 มคก./กก./นาที สำหรับหัวใจเต้นผิดจังหวะ (เดิม 200-300) ระยะห่างของ sotalol ตามไตเป็นไปตามฉลาก (CrCl 30-59 ทุก 24 ชม., 10-29 ทุก 36-48 ชม.) ข้อห้ามของ ranolazine คือตับแข็ง (เดิมระบุไตวายรุนแรง) ลบ propafenone ฉีดและ adenosine ขนาดลด 3 มก. (ไม่มีแหล่งอ้างอิง) แก้บัญชียาหลักให้ถูกต้อง","คะแนน Tisdale: เพิ่มข้อที่ขาด (ยาที่ทำให้ QT ยาว 1 ชนิด 3 คะแนน) ให้คะแนนเต็ม 21 ตามที่ตีพิมพ์ ร้อยละที่แสดงเป็นอัตรา QTc ยาว ไม่ใช่ torsades","หน้าต่างเครื่องมือและหน้ารายละเอียดยาเริ่มใหม่ทุกครั้งที่เปิด เดิมผิดกฎลำดับ state ของ React ซึ่งอาจทำให้หน้าเว็บค้างได้"]},{version
